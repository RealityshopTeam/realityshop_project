  <div class="container">
    <h1 class="section-title">Our Products</h1>
    <div class="search-sort-bar">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search products..." />
      </div>
      <div class="sort-box">
        <select id="sortSelect">
          <option value="">Sort By</option>
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
          <option value="name-asc">Name: A to Z</option>
          <option value="name-desc">Name: Z to A</option>
          <option value="category-asc">Category: A to Z</option>
          <option value="category-desc">Category: Z to A</option>
        </select>
      </div>
    </div>
    <div class="grid" id="product-grid"></div>
  </div>


 <!-- JS Logic with asset existence checks and graceful fallbacks -->
  <script>
    const products = [

      {name: "Single Cot", price: 999, glb: "imgs/singlecot.glb", category: "Furniture"},

      {name: "Three Seat Sofa", price: 999, glb: "imgs/sofa1.glb", category: "Furniture"},
      {name: "Wooden Table", price: 750, glb: "imgs/wood table.glb", category: "Furniture"},
      {name: "Sweat Shirt", price: 550, img: "imgs/Tshort.jpg", category: "Clothing"},
      {name: "Head Phones", price: 899, glb: "imgs/head phone.glb", category: "Electronics"},
      {name: "Single Sofa", price: 980, glb: "imgs/sofa.glb", category: "Furniture"},
      {name: "nike shoes", price: 1400, glb: "imgs/nike_air_zoom_pegasus_36.glb", category:"Shoes"},
      {name: "puma shoes", price:2905, glb: "imgs/free_shoe_model.glb", category:"Shoes"},
      {name: "white crop top",price:345,glb:"imgs/cc0_-_shirt_on_hanger.glb",category:"Clothings"},
      {name: "men shirt",price:800,glb:"imgs/realistic_dress_shirt.glb",category:"Clothings"},
      {name:"clear sunglass",price:250,glb:"imgs/sunglasses_free.glb",category:"sunglass"},
      {name:"pink sunglass",price:389,glb:"imgs/pink_round_sunglasses.glb",category:"sunglass"},
      {name:"balenciaga sunglass",price:20000,glb:"imgs/balenciaga_sunglasses.glb",category:"sunglass"},
      {name: "wireless ear buds", price:1500,glb:"imgs/wireless_unbranded_in_ear_head_phones.glb",category:"Electronics"},
      {name:"white ear phones",price:350,glb:"imgs/ear_phones.glb",category:"Electronics"},
      {name:"head phones",price:2000,glb:"imgs/ear_phone.glb",category:"Electronics"},
      {name: "gold necklace", price:299, glb:"imgs/gold_necklace__chain.glb", category:"Accessories"},
      {name: "gemstone necklace", price:259, glb:"imgs/gemstone_necklace.glb", category:"Accessories"},
      {name: "hex necklace", price:199, glb:"imgs/hex_necklace.glb", category:"Accessories"},
      {name: "jashin necklace", price:369, glb:"imgs/jashin_necklace.glb", category:"Accessories"},
      {name: "pearl necklace", price:499, glb:"imgs/pearl_necklace.glb", category:"Accessories"},

      {name: "star earrings", price:79, glb:"imgs/stars_earrings.glb", category:"Accessories"},
      {name: "louboutin", price:88, glb:"imgs/louboutin_earring.glb", category:"Accessories"},
      {name: "anarkali earrings", price:108, glb:"imgs/anarkali_earring.glb", category:"Accessories"},
      {name: "diamond earrings", price:167, glb:"imgs/earring_diamond.glb", category:"Accessories"},
      {name:"men checks shirt",price:567,glb:"imgs/mens_casual_shirt.glb",category:"Clothing"},
      {name:"canon retro camera",price:70000,glb:"imgs/canon_at-1_retro_camera.glb",category:"Electronics"},
      {name:"Samsung led tv",price:52000,glb:"imgs/samsung_55_curved_tv_and_remote.glb",category:"Electronics"},
      {name:"LG led tv",price:39000,glb:"imgs/tv_led_large.glb",category:"Electronics"},
      {name:"refrigerator",price:23149,glb:"imgs/refrigerator.glb",category:"Electronics"},
      {name:"fridge",price:20000,glb:"imgs/refrigerator_-_household_props_challenge_day_23.glb",category:"Electronics"},
      {name: "watch", price:569, glb:"imgs/watches_chopard_-_low_poly_-_free.glb", category:"Accessories"},
      {name: "smart watch", price:1599, glb:"imgs/free_-_smart_watches.glb", category:"Accessories"},
      {name:"apple watch",price:45000,glb:"imgs/apple_watch.glb",category:"Electronics"},
      {name:"silver chain watch",price:1200,glb:"imgs/invicta_watch.glb",category:"Electronics"},
      {name:"black chain watch",price:999,glb:"imgs/digital_watch.glb",category:"Electronics"},
      {name:"HP victus laptop",price:700000,glb:"imgs/hp_victus_gaming_laptop.glb",category:"Electronics"},
      {name:"lenovo laptop",price:55000,glb:"imgs/lenovo_thinkpad_laptop.glb",category:"Electronics"},
      {name:"washing machine",price:18250,glb:"imgs/washing_machine.glb",category:"Electronics"},
      {name:"lg washing machine",price:19490,glb:"imgs/washing_machine(1).glb",category:"Electronics"},
      {name:"Tube Light",price:1900,glb:"imgs/tube_light.glb",category:"Electronics"},
      {name:"fry pan",price:1500,glb:"imgs/frying_pan_36cm.glb",category:"Electronics"},
      {name:"gas stove",price:3000,glb:"imgs/gas_stove_kitchen.glb",category:"Electronics"},
      {name:"mobile charger",price:550,glb:"imgs/mobile_charger.glb",category:"Electonics"},
    ];

    const grid = document.getElementById('product-grid');
    const searchInput = document.getElementById('searchInput');
    const sortSelect = document.getElementById('sortSelect');

    const assetOkCache = new Map();

    async function assetExists(url) {
      if (!url) return false;
      if (assetOkCache.has(url)) return assetOkCache.get(url);
      try {
        const res = await fetch(url, { method: 'HEAD' });
        const ok = res.ok;
        assetOkCache.set(url, ok);
        return ok;
      } catch (e) {
        assetOkCache.set(url, false);
        return false;
      }
    }

    function makeFallbackNode(text = 'Preview not available') {
      const d = document.createElement('div');
      d.className = 'no-asset';
      d.textContent = text;
      return d;
    }

    async function renderProducts() {
      const searchTerm = (searchInput.value || '').toLowerCase();
      let filtered = products.filter(
        p => p.name.toLowerCase().includes(searchTerm) ||
             p.category.toLowerCase().includes(searchTerm)
      );

      const sortValue = sortSelect.value;
      if (sortValue) {
        const [key, order] = sortValue.split('-');
        filtered.sort((a, b) => {
          if (key === 'price') {
            return order === 'asc' ? a.price - b.price : b.price - a.price;
          } else if (key === 'name' || key === 'category') {
            const aVal = String(a[key]).toLowerCase();
            const bVal = String(b[key]).toLowerCase();
            if (aVal < bVal) return order === 'asc' ? -1 : 1;
            if (aVal > bVal) return order === 'asc' ? 1 : -1;
            return 0;
          }
          return 0;
        });
      }

      grid.innerHTML = '';

      for (let i = 0; i < filtered.length; i++) {
        const p = filtered[i];
        const div = document.createElement('div');
        div.className = 'product';
        div.setAttribute('data-name', p.name);
        div.setAttribute('data-price', p.price);
        div.setAttribute('data-category', p.category);

        // Navigate to product page (ignore clicks on buttons)
        div.onclick = (e) => {
          if (e.target.tagName === 'BUTTON') return;
          window.location.href = 'product.html?name=' + encodeURIComponent(p.name);
        };

        // Choose the best available preview WITHOUT triggering 404s
        let previewNode = null;
        const hasGLB = await assetExists(p.glb);
        if (hasGLB) {
          const mv = document.createElement('model-viewer');
          mv.setAttribute('src', p.glb);
          mv.setAttribute('alt', `${p.name} 3D view`);
          mv.setAttribute('auto-rotate', '');
          mv.setAttribute('camera-controls', '');
          mv.setAttribute('ar', '');
          mv.setAttribute('shadow-intensity', '1');
          mv.style.width = '100%';
          mv.style.height = '200px';
          mv.style.objectFit = 'contain';
          mv.style.borderRadius = '8px';
          mv.style.marginBottom = '12px';
          // If something still goes wrong, gracefully fallback
          mv.addEventListener('error', () => {
            mv.replaceWith(p.img ? makeImageNode(p.img, p.name) : makeFallbackNode());
          });
          previewNode = mv;
        } else if (p.img) {
          previewNode = makeImageNode(p.img, p.name);
        } else {
          previewNode = makeFallbackNode();
        }

        div.appendChild(previewNode);

        div.insertAdjacentHTML('beforeend', `
          <h3>${p.name}</h3>
          <p class="category">${p.category}</p>
          <p>₹${p.price}.00</p>
          <div class="button-row">
            <button class="cart-btn" type="button">Add to Cart</button>
            <button class="wishlist-btn${isWishlisted(p.name) ? ' added' : ''}" type="button">
              ${isWishlisted(p.name) ? "Remove from Wishlist" : "Add to Wishlist"}
            </button>
          </div>
        `);

        // Cart button
        div.querySelector('.cart-btn').onclick = (event) => {
          event.stopPropagation();
          let cart = JSON.parse(localStorage.getItem('cart') || '[]');
          let existing = cart.find(item => item.name === p.name);
          if (existing) existing.quantity += 1;
          else cart.push({ name: p.name, price: p.price, quantity: 1 });
          localStorage.setItem('cart', JSON.stringify(cart));
          alert(p.name + " added to cart!");
        };

        // Wishlist button toggle
        const wishBtn = div.querySelector('.wishlist-btn');
        wishBtn.onclick = (event) => {
          event.stopPropagation();
          let wishlist = getWishlist();
          const index = wishlist.findIndex(item => item.name === p.name);
          if (index > -1) {
            wishlist.splice(index, 1);
            wishBtn.classList.remove('added');
            wishBtn.textContent = "Add to Wishlist";
          } else {
            wishlist.push({ name: p.name, price: p.price, category: p.category, img: p.img, glb: p.glb });
            wishBtn.classList.add('added');
            wishBtn.textContent = "Remove from Wishlist";
          }
          setWishlist(wishlist);
        };

        grid.appendChild(div);
      }
    }

    function makeImageNode(src, alt) {
      const img = document.createElement('img');
      img.src = src;
      img.alt = alt;
      img.addEventListener('error', () => {
        img.replaceWith(makeFallbackNode());
      });
      return img;
    }

    function getWishlist() {
      return JSON.parse(localStorage.getItem('wishlist') || '[]');
    }
    function setWishlist(wishlist) {
      localStorage.setItem('wishlist', JSON.stringify(wishlist));
    }
    function isWishlisted(name) {
      return getWishlist().some(item => item.name === name);
    }

    // --- Lightweight self-tests (console only) ---
    (function selfTests(){
      console.log('[SelfTest] makeFallbackNode returns element:', makeFallbackNode() instanceof HTMLElement);
      const dummy = document.createElement('model-viewer');
      dummy.addEventListener('error', () => {
        console.log('[SelfTest] model-viewer error event captured.');
      });
      dummy.dispatchEvent(new Event('error'));
      // Asset existence negative test (expected false)
      assetExists('imgs/__does_not_exist__.glb').then(ok => {
        console.log('[SelfTest] nonexistent assetExists ->', ok === false ? 'PASS' : 'FAIL');
      });
    })();

    // Events
    searchInput.addEventListener('input', () => { renderProducts(); });
    sortSelect.addEventListener('change', () => { renderProducts(); });
    window.onload = () => { renderProducts(); };
  </script>
