<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reality Shop - Products</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <link rel="stylesheet" href="styles.css" />
  <script type="module" src="logic.js" defer></script>
  <script type="module" src="products.js" defer></script>
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="logo">Reality Shop</a>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="shop.html" class="active">Shop</a></li>
      <li><a href="cart.html">Cart</a></li>
      <li><a href="wishlist.html">Wishlist</a></li>
      <li><a href="login.html">Account</a></li>
    </ul>
  </nav>

  <nav class="mobile-bottom-nav">
    <a href="index.html">...</a>
    <a href="shop.html" class="active">...</a>
    <a href="cart.html">...</a>
    <a href="wishlist.html">...</a>
    <a href="login.html">...</a>
  </nav>

  <div class="container">
    <h1 class="section-title">Our Products</h1>
    <div class="search-sort-bar">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search products..." aria-label="Search products" />
      </div>
      <div class="sort-box">
        <select id="sortSelect" aria-label="Sort products">
          <option value="">Sort By</option>
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
          <option value="name-asc">Name: A to Z</option>
          <option value="name-desc">Name: Z to A</option>
          <option value="category-asc">Category: A to Z</option>
          <option value="category-desc">Category: Z to A</option>
        </select>
      </div>
    </div>
    <div class="grid" id="product-grid" role="list" aria-live="polite" aria-label="Product list"></div>
  </div>

  <footer>
    <p>© 2025 Reality Shop. All rights reserved.</p>
  </footer>
</body>
</html>
