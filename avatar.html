<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Avatar Try-On - Reality Shop</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body { margin:0; overflow:hidden; background:#111; color:white; font-family:Arial; }
    #info { position:absolute; top:10px; left:10px; background:rgba(0,0,0,0.6); padding:10px; border-radius:8px; }
    #controls { position:absolute; top:10px; right:10px; display:flex; gap:8px; }
    button {
      padding:6px 12px; border:none; border-radius:6px;
      background:#0072ff; color:#fff; font-weight:bold; cursor:pointer;
    }
    button:hover { background:#0055cc; }
  </style>

  <!-- Import Map -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js",
      "three/examples/": "https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="info">👕 Avatar Clothing Try-On</div>
  <div id="controls">
    <button id="idleBtn">Idle</button>
    <button id="tposeBtn">T-Pose</button>
    <button id="walkBtn">Walk</button>
  </div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/examples/controls/OrbitControls.js";
    import { GLTFLoader } from "three/examples/loaders/GLTFLoader.js";

    let scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111);

    let camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.6, 3);

    let renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    let controls = new OrbitControls(camera, renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.2));
    scene.add(new THREE.DirectionalLight(0xffffff, 1));

    let loader = new GLTFLoader();
    let mixer, avatar, avatarSkeleton;
    let actions = {};

    // === Load Avatar ===
    loader.load("imgs/avatar.glb", (gltf) => {
      avatar = gltf.scene;
      avatar.position.set(0,-1,0);
      scene.add(avatar);

      // Skeleton
      avatar.traverse(obj=>{
        if(obj.isSkinnedMesh){
          avatarSkeleton = obj.skeleton;
        }
      });

      // Animations
      mixer = new THREE.AnimationMixer(avatar);
      gltf.animations.forEach((clip)=>{
        actions[clip.name] = mixer.clipAction(clip);
      });

      // Play Idle by default
      if(actions["Idle"]) actions["Idle"].play();
      else if(gltf.animations[0]) mixer.clipAction(gltf.animations[0]).play();

      // === Load Clothing from localStorage ===
      let selected = localStorage.getItem("selectedClothing");
      if(selected){
        let product = JSON.parse(selected);
        if(product.glb){
          loader.load(product.glb, (clothGltf)=>{
            let clothing = clothGltf.scene;
            clothing.traverse(obj=>{
              if(obj.isSkinnedMesh && avatarSkeleton){
                obj.skeleton = avatarSkeleton;
                obj.bind(avatarSkeleton);
              }
            });
            avatar.add(clothing);
          });
        }
      }
    });

    // === Animation Controls ===
    function playAction(name){
      for(let key in actions){
        actions[key].stop();
      }
      if(actions[name]) actions[name].reset().play();
    }
    document.getElementById("idleBtn").onclick = ()=> playAction("Idle");
    document.getElementById("tposeBtn").onclick = ()=> playAction("T-Pose");
    document.getElementById("walkBtn").onclick = ()=> playAction("Walk");

    // Animate
    let clock = new THREE.Clock();
    function animate(){
      requestAnimationFrame(animate);
      let delta = clock.getDelta();
      if(mixer) mixer.update(delta);
      renderer.render(scene,camera);
    }
    animate();

    window.addEventListener("resize", ()=>{
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
