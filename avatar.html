<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>External Avatar Loader (Three.js)</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    #controls {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.7);
      padding: 10px;
      border-radius: 8px;
    }
    select, button {
      margin: 5px;
      padding: 5px;
      border-radius: 5px;
      border: none;
    }
    button {
      background: #4caf50;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background: #45a049;
    }
  </style>
</head>
<body>
  <div id="controls">
    Avatar:
    <select id="avatarSelect">
      <option value="https://models.readyplayer.me/65f6bfa8d1ad1f6c2f9f.glb">Avatar 1</option>
      <option value="https://models.readyplayer.me/63c5dbeefcd23b1a2c8f.glb">Avatar 2</option>
      <option value="https://models.readyplayer.me/64f7c1ad3d1c5c2b3e9b.glb">Avatar 3</option>
    </select>
    <button onclick="updateAvatar()">Load Avatar</button>
  </div>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js";
    import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/controls/OrbitControls.js";
    import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/loaders/GLTFLoader.js";

    let scene, camera, renderer, controls;
    let avatar;
    const loader = new GLTFLoader();

    init();
    loadAvatar(document.getElementById("avatarSelect").value); // load first avatar by default

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x111111);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 1.6, 3);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
      hemiLight.position.set(0, 1, 0);
      scene.add(hemiLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 1);
      dirLight.position.set(3, 10, 5);
      scene.add(dirLight);

      animate();
      window.addEventListener("resize", onWindowResize);
    }

    function loadAvatar(url) {
      loader.load(url, function (gltf) {
        if (avatar) scene.remove(avatar); // remove previous avatar
        avatar = gltf.scene;
        avatar.position.set(0, 0, 0);
        avatar.scale.set(1, 1, 1);
        scene.add(avatar);
      }, undefined, function (error) {
        console.error("Error loading avatar:", error);
      });
    }

    function updateAvatar() {
      const url = document.getElementById("avatarSelect").value;
      loadAvatar(url);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
