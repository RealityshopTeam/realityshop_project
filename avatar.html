<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Avatar Try-On - Reality Shop</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="styles.css">
<style>
  body { margin:0; overflow:hidden; background:#121212; color:white; }
  #canvas-container { width:100%; height:100vh; display:block; }
</style>
</head>
<body>
<div id="canvas-container"></div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js",
    "three/examples/": "https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/examples/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/examples/controls/OrbitControls.js';

const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x121212);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0,1.6,2);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0,1,0);
controls.update();

// Lights
const hemiLight = new THREE.HemisphereLight(0xffffff,0x444444,1.2);
hemiLight.position.set(0,2,0);
scene.add(hemiLight);

const dirLight = new THREE.DirectionalLight(0xffffff,1);
dirLight.position.set(0,2,2);
dirLight.castShadow = true;
scene.add(dirLight);

// Floor
const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(10,10),
    new THREE.ShadowMaterial({opacity:0.3})
);
floor.rotation.x = -Math.PI/2;
floor.position.y = 0;
floor.receiveShadow = true;
scene.add(floor);

const loader = new GLTFLoader();

let avatar;                // avatar scene object
let avatarSkeleton;        // THREE.Skeleton of avatar (from SkinnedMesh)
let previousClothing = null; // To remove old clothing if swapped

// Load avatar and extract skeleton from its SkinnedMesh
async function loadAvatar() {
    return new Promise((resolve, reject) => {
        loader.load('baseAvatar.glb', gltf => {
            avatar = gltf.scene;
            avatar.traverse(child => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                    if (child.isSkinnedMesh && !avatarSkeleton) {
                        avatarSkeleton = child.skeleton;
                    }
                }
            });
            scene.add(avatar);
            resolve();
        }, undefined, err => reject(err));
    });
}

// Load clothing, bind its skeleton to avatar's skeleton, and add to avatar
async function loadClothing() {
    const selected = JSON.parse(localStorage.getItem("selectedClothing") || null);
    if (!selected || !selected.glb) return;

    loader.load(selected.glb, gltf => {
        const clothing = gltf.scene;

        // Remove previous clothing from avatar if exists
        if (previousClothing) {
            avatar.remove(previousClothing);
            previousClothing = null;
        }

        clothing.traverse(child => {
            if (child.isSkinnedMesh) {
                child.castShadow = true;
                // Bind clothing skeleton to avatar skeleton for exact fit
                if (avatarSkeleton) {
                    child.bind(avatarSkeleton, child.bindMatrix);
                    child.pose();
                }
            } else if(child.isMesh) {
                child.castShadow = true;
            }
        });

        // Attach clothing as child of avatar for grouped transformations
        avatar.add(clothing);

        // Reset clothing transform to align with avatar
        clothing.position.set(0, 0, 0);
        clothing.rotation.set(0, 0, 0);
        clothing.scale.set(1, 1, 1);

        previousClothing = clothing;
    }, undefined, err => console.error('Clothing load error:', err));
}

async function init() {
    await loadAvatar();
    await loadClothing();
}

init();

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
}

animate();

</script>
</body>
</html>
