<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Avatar Try-On - Reality Shop</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css">
  <style>
    body { margin:0; overflow:hidden; background:#121212; color:white; }
    #canvas-container { width:100%; height:100vh; display:block; }
  </style>
</head>
<body>
<div id="canvas-container"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js",
    "three/examples/": "https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/examples/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/examples/controls/OrbitControls.js';

const container = document.getElementById('canvas-container');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x121212);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0, 1.6, 2);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0,1,0);
controls.update();

// Light
const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
hemiLight.position.set(0, 2, 0);
scene.add(hemiLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 1);
dirLight.position.set(0, 2, 2);
dirLight.castShadow = true;
scene.add(dirLight);

// Floor
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(10,10),
  new THREE.ShadowMaterial({ opacity:0.3 })
);
floor.rotation.x = -Math.PI/2;
floor.position.y = 0;
floor.receiveShadow = true;
scene.add(floor);

// Load avatar
const loader = new GLTFLoader();
let avatar, avatarBox;

loader.load('baseAvatar.glb', gltf => {
    avatar = gltf.scene;
    avatar.traverse(c => { if(c.isMesh) { c.castShadow=true; c.receiveShadow=true; } });
    avatar.scale.set(1,1,1);
    scene.add(avatar);

    // Avatar bounding box
    avatarBox = new THREE.Box3().setFromObject(avatar);

    // Load clothing after avatar is loaded
    loadClothing();
}, undefined, err => console.error(err));

function loadClothing() {
    const selected = JSON.parse(localStorage.getItem("selectedClothing") || null);
    if(!selected || !selected.glb) return;

    loader.load(selected.glb, gltf => {
        const product = gltf.scene;
        product.traverse(c => { if(c.isMesh) c.castShadow=true; });

        const avatarSize = avatarBox.getSize(new THREE.Vector3());
        const avatarMinY = avatarBox.min.y;
        const avatarCenterY = avatarMinY + avatarSize.y / 2;

        const productBox = new THREE.Box3().setFromObject(product);
        const productSize = productBox.getSize(new THREE.Vector3());
        const productCenterY = (productBox.min.y + productBox.max.y)/2;

        // --- Scaling clothing to torso ---
        const targetTorsoHeight = avatarSize.y * 0.5; // 50% of avatar height
        const scale = targetTorsoHeight / productSize.y;
        product.scale.set(scale, scale, scale);

        // --- Positioning clothing ---
        const torsoY = avatarMinY + avatarSize.y * 0.6; // position around upper torso
        product.position.set(
            0,
            torsoY - (productCenterY * scale),
            0
        );

        scene.add(product);
    }, undefined, err => console.error(err));
}

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
