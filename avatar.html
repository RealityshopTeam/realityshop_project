<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Avatar Try-On - Reality Shop</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { margin:0; overflow:hidden; background:#121212; }
    #canvas-container { width:100%; height:100vh; }
  </style>
</head>
<body>
<div id="canvas-container"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js",
    "three/examples/": "https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/examples/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/examples/controls/OrbitControls.js';

const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x121212);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0,1.6,2);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0,1.5,0);
controls.update();

// Lights
scene.add(new THREE.HemisphereLight(0xffffff,0x444444,1.2));
const dirLight = new THREE.DirectionalLight(0xffffff,1);
dirLight.position.set(2,3,5);
scene.add(dirLight);

const loader = new GLTFLoader();
let avatar, avatarSkeleton;

// --- Load Ready Player Me avatar ---
async function loadAvatar() {
  return new Promise((resolve, reject)=>{
    loader.load("baseAvatar.glb", gltf=>{ // replace with your avatar URL
      avatar = gltf.scene;
      avatar.traverse(c=>{
        if(c.isSkinnedMesh && c.skeleton){
          avatarSkeleton = c.skeleton; // Capture skeleton for clothing
        }
      });
      scene.add(avatar);
      resolve();
    }, undefined, err=>reject(err));
  });
}

// --- Load clothing from products.html ---
async function loadClothing() {
  const selected = JSON.parse(localStorage.getItem("selectedClothing"));
  if(!selected) return;

  loader.load(selected.glb, gltf=>{
    const clothing = gltf.scene;

    // Bind clothing meshes to avatar skeleton
    clothing.traverse(c=>{
      if(c.isSkinnedMesh && avatarSkeleton){
        try {
          c.bind(avatarSkeleton);
        } catch(e){
          console.warn("⚠️ Binding failed", e);
        }
      }
    });

    scene.add(clothing);
    console.log("✅ Wearing:", selected.category);
  });
}

// Init
(async ()=>{
  await loadAvatar();
  await loadClothing();
})();

window.addEventListener("resize", ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate(){
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}
animate();
</script>
  dfads
</body>
</html>
