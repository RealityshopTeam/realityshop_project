<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reality Shop - AR View with Products (Importmap)</title>
  <style>
    body { margin: 0; overflow: hidden; }
  </style>

  <!-- A-Frame + AR.js -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://rawcdn.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <!-- Importmap for Three.js (optional, if you want advanced logic) -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/examples/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body style="margin:0; overflow:hidden;">
  <a-scene
    vr-mode-ui="enabled: false"
    embedded
    arjs="sourceType: webcam; detectionMode: mono; debugUIEnabled: false;">
    
    <!-- Marker -->
    <a-marker preset="hiro">
      <a-entity id="productModel" scale="0.5 0.5 0.5" rotation="0 180 0" position="0 0 0"></a-entity>
    </a-marker>

    <!-- Camera -->
    <a-entity camera></a-entity>
  </a-scene>

  <script type="module">
    // Import Three.js in case we need to extend lighting, shadows, etc.
    import * as THREE from "three";

    // Read product from query string
    const urlParams = new URLSearchParams(window.location.search);
    const productUrl = urlParams.get("product") || "models/chair.glb";

    // Load product into AR marker
    const productEntity = document.getElementById("productModel");
    productEntity.setAttribute("gltf-model", productUrl);

    // Optional: add better lighting using Three.js
    const scene = document.querySelector("a-scene").object3D;
    const light = new THREE.HemisphereLight(0xffffff, 0x444444, 1);
    scene.add(light);
  </script>
</body>
</html>
