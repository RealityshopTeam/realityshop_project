<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reality Shop - Avatar Try On</title>
  <style>
    body { margin: 0; overflow: hidden; background: #111; }
    canvas { display: block; }
    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 10px 16px;
      background: rgba(0,0,0,0.6);
      color: white;
      font-family: Arial, sans-serif;
      border-radius: 8px;
      font-size: 14px;
      z-index: 10;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.156.1/build/three.module.js",
        "three/examples/jsm/controls/OrbitControls.js": "https://unpkg.com/three@0.156.1/examples/jsm/controls/OrbitControls.js",
        "three/examples/jsm/loaders/GLTFLoader.js": "https://unpkg.com/three@0.156.1/examples/jsm/loaders/GLTFLoader.js"
      }
    }
  </script>
</head>
<body>
  <div id="info">👕 Loading avatar with clothing...</div>
  <canvas id="c"></canvas>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';

    const canvas = document.querySelector('#c');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x202020);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.6, 3);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.4, 0);
    controls.update();

    // Lights
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
    scene.add(hemiLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    const loader = new GLTFLoader();
    let avatar = null, clothing = null;

    function removeClothing() {
      if (avatar && clothing) {
        avatar.remove(clothing);
        clothing.traverse((child) => {
          if (child.isMesh) child.geometry.dispose();
          if (child.material) child.material.dispose();
        });
        clothing = null;
      }
    }

    function attachClothing(url) {
      loader.load(url, (gltf) => {
        removeClothing();
        clothing = gltf.scene;

        // Position and scale must be adjusted to fit avatar correctly
        // Adjust these as per your avatar and clothing model specifics
        clothing.position.set(0, -1.0, 0);  // Example: move clothing down by 1 unit on Y-axis
        clothing.scale.set(1, 1, 1);        // Adjust scale if needed

        avatar.add(clothing);
        document.getElementById("info").textContent += " | Clothing applied!";
        console.log("👕 Clothing applied:", url);
      }, undefined, (err) => {
        document.getElementById("info").textContent = "❌ Error loading clothing!";
        console.error("Error loading clothing:", err);
      });
    }

    // Load avatar and selected clothing
    loader.load('baseAvatar.glb', (gltf) => {
      avatar = gltf.scene;
      avatar.position.set(0, 0, 0);
      avatar.scale.set(1, 1, 1);
      scene.add(avatar);

      console.log("✅ Base Avatar loaded");

      // Load clothing info from localStorage
      const stored = localStorage.getItem("selectedClothing");
      if (stored) {
        const selected = JSON.parse(stored);
        if (selected && selected.glb) {
          document.getElementById("info").textContent = `Wearing: ${selected.name}`;
          attachClothing(selected.glb);
        } else {
          document.getElementById("info").textContent = "⚠️ No 3D model for this clothing.";
        }
      } else {
        document.getElementById("info").textContent = "⚠️ No clothing selected.";
      }
    }, undefined, (err) => {
      document.getElementById("info").textContent = "❌ Error loading avatar!";
      console.error("Error loading avatar:", err);
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
