<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Avatar Try-On - Reality Shop</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js",
    "three/examples/": "https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/examples/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/examples/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x121212);

const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 1.6, 3);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// Orbit Controls
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1, 0);
controls.update();

// Lights
const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
hemiLight.position.set(0, 20, 0);
scene.add(hemiLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(-3, 10, -10);
dirLight.castShadow = true;
scene.add(dirLight);

// Load Avatar
const loader = new GLTFLoader();
let avatar, avatarBox;

loader.load('baseAvatar.glb', gltf => {
  avatar = gltf.scene;
  avatar.traverse(c => { if(c.isMesh) c.castShadow = true; });
  scene.add(avatar);

  avatarBox = new THREE.Box3().setFromObject(avatar);

  // Load product after avatar
  loadProduct();
}, undefined, err => console.error(err));

// Load selected product
function loadProduct() {
  const selectedProduct = JSON.parse(localStorage.getItem('selectedClothing') || 'null');
  if(!selectedProduct || !selectedProduct.glb) return;

  loader.load(selectedProduct.glb, gltf => {
    const product = gltf.scene;
    product.traverse(c => { if(c.isMesh) c.castShadow = true; });

    const avatarSize = avatarBox.getSize(new THREE.Vector3());
    const avatarCenterY = avatarBox.min.y + avatarSize.y / 2;

    const productBox = new THREE.Box3().setFromObject(product);
    const productSize = productBox.getSize(new THREE.Vector3());
    const productCenterY = (productBox.min.y + productBox.max.y)/2;

    // Scale product to fit avatar
    const scale = avatarSize.y / productSize.y * 0.95;
    product.scale.set(scale, scale, scale);

    // Position product on avatar
    const clothingAnchors = {
      'Clothing': 0,
      'Shoes': -0.8,
      'Accessories': 0.1
    };
    const anchor = clothingAnchors[selectedProduct.category] || 0;
    product.position.set(
      0,
      avatarCenterY - (productCenterY * scale) + anchor,
      0
    );

    scene.add(product);
  }, undefined, err => console.error(err));
}

// Ground
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(50, 50),
  new THREE.MeshStandardMaterial({ color: 0x222222 })
);
ground.rotation.x = -Math.PI/2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

// Animate
function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}
animate();

// Handle resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

<style>
body { margin:0; overflow:hidden; }
</style>
</head>
<body></body>
</html>
