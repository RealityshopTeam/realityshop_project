<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Avatar Try-On - Reality Shop</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  body { margin:0; overflow:hidden; background:#121212; }
  #canvas-container { width:100%; height:100vh; display:block; }
</style>
</head>
<body>
<div id="canvas-container"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js",
    "three/examples/": "https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/examples/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/examples/controls/OrbitControls.js';

const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x121212);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0,1.6,2);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0,1.2,0);
controls.update();

scene.add(new THREE.HemisphereLight(0xffffff,0x444444,1.2));
const dirLight = new THREE.DirectionalLight(0xffffff,1);
dirLight.position.set(2,4,2);
dirLight.castShadow = true;
scene.add(dirLight);

const loader = new GLTFLoader();
let avatar, mixer, avatarSkeleton, bones = {};

// Load avatar
async function loadAvatar() {
  return new Promise((resolve, reject)=>{
    loader.load("baseAvatar.glb", gltf=>{
      avatar = gltf.scene;
      scene.add(avatar);

      if (gltf.animations && gltf.animations.length > 0) {
        mixer = new THREE.AnimationMixer(avatar);
        mixer.clipAction(gltf.animations[0]).play();
      }

      avatar.traverse(obj=>{
        if(obj.isBone){
          bones[obj.name.toLowerCase()] = obj; // store bone refs in lowercase
        }
        if(obj.isSkinnedMesh && obj.skeleton){
          avatarSkeleton = obj.skeleton;
        }
      });

      resolve();
    }, undefined, err=>reject(err));
  });
}

// Attach clothing to correct bone
function attachClothingToBone(clothing, category) {
  let targetBone = null;

  if(category === "shirt" || category === "jacket") {
    targetBone = bones["spine"] || bones["spine1"] || bones["chest"];
  } else if(category === "pants") {
    targetBone = bones["hips"];
  } else if(category === "shoes") {
    targetBone = bones["foot_l"] || bones["foot_r"] || bones["leftfoot"] || bones["rightfoot"];
  } else {
    targetBone = avatar; // fallback: attach to avatar root
  }

  if(targetBone) {
    targetBone.add(clothing);
    clothing.position.set(0,0,0);
    clothing.rotation.set(0,0,0);
    clothing.scale.set(1,1,1);
  }
}

// Load clothing dynamically
async function loadClothing() {
  const selected = JSON.parse(localStorage.getItem("selectedClothing") || null);
  if(!selected || !selected.glb) return;

  loader.load(selected.glb, gltf=>{
    const clothing = gltf.scene;

    let bound = false;
    clothing.traverse(c=>{
      if(c.isSkinnedMesh && avatarSkeleton){
        try {
          c.bind(avatarSkeleton);
          bound = true;
        } catch(e){
          console.warn("⚠️ Binding failed", e);
        }
      }
    });

    if(bound){
      scene.add(clothing); // skinned clothing
    } else {
      attachClothingToBone(clothing, selected.category?.toLowerCase());
    }

    console.log("✅ Clothing loaded:", selected.name);
  }, undefined, err=>console.error(err));
}

// Init
(async ()=>{
  await loadAvatar();
  await loadClothing();
})();

window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  if(mixer) mixer.update(delta);
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
