<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reality Shop — Avatar Try-On</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body { margin:0; overflow:hidden; background:#111; color:white; font-family:Arial; }
    #controls { position:absolute; top:10px; left:10px; }
    button {
      padding:6px 12px; border:none; border-radius:6px;
      background:#0072ff; color:#fff; font-weight:bold; cursor:pointer;
    }
    button:hover { background:#0055cc; }
  </style>

  <!-- ImportMap -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js",
      "three/examples/": "https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="controls">
    <button id="reset">Reset Avatar</button>
  </div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/examples/controls/OrbitControls.js";
    import { GLTFLoader } from "three/examples/loaders/GLTFLoader.js";

    let scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111);

    let camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.6, 3);

    let renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    let controls = new OrbitControls(camera, renderer.domElement);

    // Lights
    scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.2));
    let dirLight = new THREE.DirectionalLight(0xffffff, 1);
    dirLight.position.set(3, 5, 2);
    scene.add(dirLight);

    let loader = new GLTFLoader();
    let mixer, avatar, avatarSkeleton;

    // === Load Avatar ===
    async function loadAvatar(){
      return new Promise((resolve, reject)=>{
        loader.load("imgs/avatar.glb", (gltf)=>{
          avatar = gltf.scene;
          avatar.position.set(0,-1,0);
          scene.add(avatar);

          // Capture skeleton
          avatar.traverse(obj=>{
            if(obj.isSkinnedMesh && !avatarSkeleton){
              avatarSkeleton = obj.skeleton;
            }
          });

          // Default animation (if available)
          if(gltf.animations.length){
            mixer = new THREE.AnimationMixer(avatar);
            let action = mixer.clipAction(gltf.animations[0]);
            action.play();
          }

          resolve();
        }, undefined, reject);
      });
    }

    // === Load Clothing from localStorage (set in product.html) ===
    async function loadClothing(){
      let selected = localStorage.getItem("selectedClothing");
      if(!selected) return;

      let product = JSON.parse(selected);
      if(!product.glb) return;

      loader.load(product.glb, (clothGltf)=>{
        let clothing = clothGltf.scene;

        clothing.traverse(obj=>{
          if(obj.isSkinnedMesh && avatarSkeleton){
            obj.skeleton = avatarSkeleton;
            obj.bind(avatarSkeleton);
          }
        });

        avatar.add(clothing);
      });
    }

    // === Reset button ===
    document.getElementById("reset").onclick = ()=>{
      scene.remove(avatar);
      avatar = null;
      avatarSkeleton = null;
      loadAvatar().then(loadClothing);
    };

    // Start
    await loadAvatar();
    await loadClothing();

    // Animate loop
    let clock = new THREE.Clock();
    function animate(){
      requestAnimationFrame(animate);
      let delta = clock.getDelta();
      if(mixer) mixer.update(delta);
      renderer.render(scene, camera);
    }
    animate();

    // Resize
    window.addEventListener("resize", ()=>{
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
