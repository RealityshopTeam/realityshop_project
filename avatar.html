<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reality Shop - Avatar Try-On</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    #uploadBox {
      position: absolute;
      top: 10px; left: 10px;
      z-index: 10;
      background: rgba(255,255,255,0.1);
      padding: 10px;
      border-radius: 10px;
      color: #fff;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js",
      "GLTFLoader": "https://cdn.jsdelivr.net/npm/three@0.166.1/examples/jsm/loaders/GLTFLoader.js",
      "OrbitControls": "https://cdn.jsdelivr.net/npm/three@0.166.1/examples/jsm/controls/OrbitControls.js"
    }
  }
  </script>
</head>
<body>

  <div id="uploadBox">
    <label>Upload Selfie: </label>
    <input type="file" id="selfieInput" accept="image/*">
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'GLTFLoader';
    import { OrbitControls } from 'OrbitControls';

    // Suppress extension warning
    console.warn = (msg) => {
      if (msg.includes("KHR_materials_pbrSpecularGlossiness")) return;
      console.log(msg);
    };

    let scene, camera, renderer, mixer, avatar, controls;

    init();
    animate();

    async function init() {
      // Scene setup
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x000000);

      camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 100);
      camera.position.set(0, 1.6, 3);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      // Lighting
      const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 2);
      hemiLight.position.set(0, 2, 0);
      scene.add(hemiLight);
      const dirLight = new THREE.DirectionalLight(0xffffff, 1);
      dirLight.position.set(0, 2, 2);
      scene.add(dirLight);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 1.4, 0);
      controls.update();

      const loader = new GLTFLoader();

      // Load avatar
      loader.load("imgs/avatar.glb", (gltf) => {
        avatar = gltf.scene;
        avatar.scale.set(1, 1, 1);
        scene.add(avatar);

        // Play animation if available
        if (gltf.animations && gltf.animations.length) {
          mixer = new THREE.AnimationMixer(avatar);
          const action = mixer.clipAction(gltf.animations[0]);
          action.play();
        }

        // After avatar loads, try to load selected product
        loadSelectedProduct(avatar);
      });

      // Handle selfie upload
      document.getElementById("selfieInput").addEventListener("change", handleSelfie);

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    // === Load Selected Product and Attach to Avatar ===
    function loadSelectedProduct(avatar) {
      const selectedProduct = JSON.parse(localStorage.getItem("selectedProduct"));
      if (!selectedProduct || !selectedProduct.glb) {
        console.log("No product selected.");
        return;
      }
      console.log("Selected Product:", selectedProduct);

      const loader = new GLTFLoader();
      loader.load(selectedProduct.glb, (productGLTF) => {
        const product = productGLTF.scene;
        product.scale.set(1, 1, 1);

        // Find avatar bone to attach clothing
        const spine = avatar.getObjectByName("Spine") || avatar.getObjectByName("Hips") || avatar;
        spine.add(product);
        product.position.set(0, 0, 0);

        console.log("✅ Product attached to avatar successfully");
      });
    }

    // === Detect average color from selfie and recolor avatar ===
    async function handleSelfie(event) {
      const file = event.target.files[0];
      if (!file) return;

      const img = new Image();
      img.src = URL.createObjectURL(file);
      await img.decode();

      // Create canvas to extract average color
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");
      canvas.width = img.width;
      canvas.height = img.height;
      ctx.drawImage(img, 0, 0, img.width, img.height);
      const imageData = ctx.getImageData(0, 0, img.width, img.height).data;

      let r = 0, g = 0, b = 0, count = 0;
      for (let i = 0; i < imageData.length; i += 4 * 100) {
        r += imageData[i];
        g += imageData[i + 1];
        b += imageData[i + 2];
        count++;
      }
      r = Math.round(r / count);
      g = Math.round(g / count);
      b = Math.round(b / count);

      const avgColor = new THREE.Color(`rgb(${r},${g},${b})`);
      console.log("Detected skin color:", avgColor);

      // Apply detected color to avatar materials
      avatar.traverse((child) => {
        if (child.isMesh && child.material) {
          if (child.name.toLowerCase().includes("skin")) {
            child.material.color.copy(avgColor);
          }
          if (child.name.toLowerCase().includes("hair")) {
            const darker = avgColor.clone().multiplyScalar(0.5);
            child.material.color.copy(darker);
          }
        }
      });
    }

    // === Animate ===
    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta?.() || 0.016;
      if (mixer) mixer.update(delta);
      renderer.render(scene, camera);
    }

    const clock = new THREE.Clock();
  </script>

</body>
</html>
