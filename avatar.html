<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reality Shop – Avatar Try-On</title>
  <script type="module" src="https://unpkg.com/three@0.160.0/build/three.module.js"></script>
  <script type="module" src="https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js"></script>
  <style>
    body {
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
      font-family: "Poppins", sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    #avatarCanvas { flex: 1; display: block; }
    #productList {
      background: #1e293b;
      padding: 10px;
      overflow-y: auto;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      height: 140px;
    }
    .product-item {
      background: #334155;
      padding: 8px 14px;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.3s;
      color: #fff;
    }
    .product-item:hover { background: #06b4d4; transform: translateY(-2px); }
    h1 { text-align: center; color: #06b4d4; font-weight: 700; margin: 10px 0; }
  </style>
</head>
<body>
  <h1>Reality Shop – Avatar Try-On</h1>
  <canvas id="avatarCanvas"></canvas>
  <div id="productList">Loading products...</div>

  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
    import { GLTFLoader } from "https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";

    // --- Three.js setup ---
    const canvas = document.getElementById("avatarCanvas");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight - 160);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f172a);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / (window.innerHeight - 160), 0.1, 100);
    camera.position.set(0, 1.6, 3);
    scene.add(camera);

    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1);
    dirLight.position.set(5, 10, 7.5);
    scene.add(hemiLight, dirLight);

    const loader = new GLTFLoader();
    let avatar, clothing;

    loader.load("imgs/avatar.glb", gltf => {
      avatar = gltf.scene;
      avatar.scale.set(1, 1, 1);
      scene.add(avatar);
      // After avatar loads, auto-apply product if saved
      autoApplyProduct();
    });

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();

    // --- Load clothing ---
    function loadClothing(url) {
      if (!url) return alert("No model available for this product.");
      if (clothing) { scene.remove(clothing); clothing = null; }

      loader.load(url, gltf => {
        clothing = gltf.scene;
        clothing.scale.set(1, 1, 1);
        clothing.position.set(0, 1, 0);
        scene.add(clothing);
      }, undefined, err => console.error("Error loading clothing:", err));
    }

    // --- Fetch products from product.html ---
    async function fetchProductsFromHTML() {
      try {
        const res = await fetch("product.html");
        if (!res.ok) throw new Error("Failed to load product.html");
        const text = await res.text();
        const match = text.match(/const products\\s*=\\s*(\\[.*?\\]);/s);
        if (!match) throw new Error("No products array found");

        const products = Function(`"use strict"; return ${match[1]};`)();
        return products.filter(p => ["Clothing", "Shoes", "Accessories"].includes(p.category));
      } catch (err) {
        console.error("Error fetching products:", err);
        return [];
      }
    }

    // --- Populate UI ---
    async function populateProductList() {
      const list = document.getElementById("productList");
      list.innerHTML = "Loading...";
      const products = await fetchProductsFromHTML();
      list.innerHTML = "";

      if (products.length === 0) { list.textContent = "No products available."; return; }

      products.forEach(prod => {
        const div = document.createElement("div");
        div.className = "product-item";
        div.textContent = prod.name;
        div.onclick = () => loadClothing(prod.glb);
        list.appendChild(div);
      });
    }

    // --- Auto apply saved product from product.html ---
    function autoApplyProduct() {
      const selected = localStorage.getItem("selectedProduct");
      if (!selected) return;
      const product = JSON.parse(selected);
      console.log("Auto-applying product:", product.name);
      loadClothing(product.glb);
      localStorage.removeItem("selectedProduct"); // clear after use
    }

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / (window.innerHeight - 160);
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight - 160);
    });

    populateProductList();
  </script>
</body>
</html>
