<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Avatar Try-On - Reality Shop</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { margin:0; overflow:hidden; background:#121212; color:white; }
    #canvas-container { width:100%; height:100vh; display:block; }
  </style>
</head>
<body>
<div id="canvas-container"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js",
    "three/examples/": "https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/examples/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/examples/controls/OrbitControls.js';
import * as SkeletonUtils from 'three/examples/jsm/utils/SkeletonUtils.js';

const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x121212);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0,1.6,2);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0,1,0);
controls.update();

// Lights
const hemiLight = new THREE.HemisphereLight(0xffffff,0x444444,1.2);
hemiLight.position.set(0,2,0);
scene.add(hemiLight);

const dirLight = new THREE.DirectionalLight(0xffffff,1);
dirLight.position.set(0,2,2);
dirLight.castShadow = true;
scene.add(dirLight);

// Floor
const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(10,10),
    new THREE.ShadowMaterial({opacity:0.3})
);
floor.rotation.x=-Math.PI/2;
floor.position.y=0;
floor.receiveShadow=true;
scene.add(floor);

const loader = new GLTFLoader();
let avatar, avatarSkeleton, mixer;

async function loadAvatar() {
    return new Promise((resolve, reject)=>{
        loader.load('imgs/avatar.glb', gltf=>{
            avatar = gltf.scene;
            avatar.traverse(c=>{ if(c.isMesh) {c.castShadow=true; c.receiveShadow=true;} });
            scene.add(avatar);

            // Store skeleton bones
            avatarSkeleton = {};
            avatar.traverse(obj=>{
                if(obj.isBone) avatarSkeleton[obj.name] = obj;
            });

            // If avatar has animations
            if(gltf.animations.length) {
                mixer = new THREE.AnimationMixer(avatar);
                gltf.animations.forEach(clip=>mixer.clipAction(clip).play());
            }

            resolve();
        }, undefined, err=>reject(err));
    });
}

// Attach clothing dynamically
function attachClothing(gltf) {
    const clothing = gltf.scene;

    // Clone skinned meshes so bones bind correctly
    clothing.traverse(node=>{
        if(node.isSkinnedMesh) {
            const skinnedMesh = node;
            const skeleton = skinnedMesh.skeleton;

            // Try to rebind skeleton
            for(let i=0; i<skeleton.bones.length; i++) {
                const boneName = skeleton.bones[i].name;
                if(avatarSkeleton[boneName]) {
                    skeleton.bones[i] = avatarSkeleton[boneName];
                }
            }
            skinnedMesh.bind(new THREE.Skeleton(skeleton.bones), skinnedMesh.bindMatrix);
        }
    });

    avatar.add(clothing);
    clothing.position.set(0,0,0);
    clothing.scale.set(1,1,1);
}

// Load clothing when message received from product.html
window.addEventListener("message", (event)=>{
    if(event.data.type === "tryOn" && event.data.glb) {
        loader.load(event.data.glb, gltf=>{
            attachClothing(gltf);
        }, undefined, err=>console.error(err));
    }
});

// Resize
window.addEventListener('resize', ()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
    requestAnimationFrame(animate);
    if(mixer) mixer.update(0.016);
    renderer.render(scene, camera);
}
animate();

loadAvatar();
</script>
</body>
</html>
