<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Avatar Try-On - Reality Shop</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  body { margin:0; overflow:hidden; background:#121212; }
  #canvas-container { width:100%; height:100vh; display:block; }
</style>
</head>
<body>
<div id="canvas-container"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js",
    "three/examples/": "https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/examples/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/examples/controls/OrbitControls.js';

const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x121212);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0,1.6,2);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0,1.2,0);
controls.update();

// Lights
scene.add(new THREE.HemisphereLight(0xffffff,0x444444,1.2));
const dirLight = new THREE.DirectionalLight(0xffffff,1);
dirLight.position.set(2,4,2);
dirLight.castShadow = true;
scene.add(dirLight);

const loader = new GLTFLoader();
let avatar, mixer, avatarSkeleton;

// Load avatar
async function loadAvatar() {
  return new Promise((resolve, reject)=>{
    loader.load("baseAvatar.glb", gltf=>{
      avatar = gltf.scene;
      scene.add(avatar);

      // If avatar has animation
      if (gltf.animations && gltf.animations.length > 0) {
        mixer = new THREE.AnimationMixer(avatar);
        mixer.clipAction(gltf.animations[0]).play(); // play idle animation
      }

      // Store skeleton reference
      avatar.traverse(c=>{
        if(c.isSkinnedMesh && c.skeleton){
          avatarSkeleton = c.skeleton;
        }
      });

      resolve();
    }, undefined, err=>reject(err));
  });
}

// Load clothing
async function loadClothing() {
  const selected = JSON.parse(localStorage.getItem("selectedClothing") || null);
  if(!selected || !selected.glb) return;

  loader.load(selected.glb, gltf=>{
    const clothing = gltf.scene;

    let bound = false;
    clothing.traverse(c=>{
      if(c.isSkinnedMesh && avatarSkeleton){
        try {
          // Bind clothing to avatar skeleton
          c.bind(avatarSkeleton);
          bound = true;
        } catch(e){
          console.warn("⚠️ Clothing binding failed, fallback used.", e);
        }
      }
    });

    if(!bound){
      // Fallback → simple scaling + positioning
      const avatarBox = new THREE.Box3().setFromObject(avatar);
      const clothingBox = new THREE.Box3().setFromObject(clothing);

      const avatarSize = avatarBox.getSize(new THREE.Vector3());
      const clothingSize = clothingBox.getSize(new THREE.Vector3());

      const scale = avatarSize.y * 0.5 / clothingSize.y; // fit half height
      clothing.scale.set(scale, scale, scale);

      clothing.position.y = avatarBox.min.y + avatarSize.y * 0.5;
    }

    scene.add(clothing);
    console.log("✅ Clothing loaded:", selected.name);
  }, undefined, err=>console.error(err));
}

// Init
(async ()=>{
  await loadAvatar();
  await loadClothing();
})();

// Resize
window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Render
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  if(mixer) mixer.update(delta); // play animations
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
