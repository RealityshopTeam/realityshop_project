<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reality Shop - Avatar & Custom Try-On</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <!-- Import Map -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/examples/jsm/loaders/GLTFLoader.js": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js",
        "three/examples/jsm/controls/OrbitControls.js": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js"
      }
    }
  </script>

  <style>
    :root { --pad: 12px; }
    body {
      margin: 0;
      font-family: system-ui, Arial, sans-serif;
      background: linear-gradient(135deg,#0b0d10 0%, #1c1f26 100%);
      color:#e9eef3;
      display:flex;
      flex-direction:column;
      min-height:100dvh;
      scroll-behavior:smooth;
    }
    nav {
      background-color: #212121;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
      position: fixed;
      width: 100%;
      top: 0; left: 0;
      z-index: 100;
    }
    .nav-container {
      max-width:1200px;
      margin:0 auto;
      display:flex;
      justify-content:space-between;
      align-items:center;
      height:60px;
      padding:0 16px;
    }
    .logo {
      color:#ff9800;
      font-weight:700;
      font-size:1.6rem;
      letter-spacing:2px;
      text-decoration:none;
    }
    ul.nav-links {
      display:flex; list-style:none; gap:24px; margin:0; padding:0;
    }
    ul.nav-links a {
      color:#eee; text-decoration:none; font-size:1rem;
      padding:6px 8px; border-radius:8px;
      transition:background-color 0.2s;
    }
    ul.nav-links a:hover, ul.nav-links a.active {
      background-color:#ff9800; color:#212121;
    }
    main {
      display:grid;
      grid-template-columns:1fr 360px;
      gap:16px;
      padding:80px 20px 20px;
      flex:1;
      max-width:1200px;
      margin:0 auto;
      width:100%;
      box-sizing:border-box;
      min-height:calc(100dvh - 80px);
    }
    #viewer {
      background:#0f1318;
      border:1px solid #1b2026;
      border-radius:16px;
      min-height:70dvh;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
      overflow:hidden;
    }
    #controls {
      background:#0f1318;
      border:1px solid #1b2026;
      border-radius:16px;
      padding:16px;
      display:flex;
      flex-direction:column;
      gap:14px;
      font-size:14px;
      color:#ccc;
    }
    .row { display:flex; align-items:center; gap:10px; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .sep { height:1px; background:#1b2026; margin:6px 0; }
    .product-list {
      max-height:250px;
      overflow-y:auto;
      padding:6px;
      border:1px solid #222b34;
      border-radius:8px;
    }
    .product-item {
      padding:6px 8px;
      background:#1a2029;
      margin-bottom:6px;
      border-radius:6px;
      cursor:pointer;
      transition:background 0.2s;
    }
    .product-item:hover { background:#324455; }
    @media(max-width:1024px){
      main{ grid-template-columns:1fr; padding:80px 12px 16px; }
      #viewer{ min-height:50dvh; }
    }
  </style>
</head>

<body>
  <nav>
    <div class="nav-container">
      <a href="index.html" class="logo">Reality Shop</a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="shop.html">Shop</a></li>
        <li><a href="wishlist.html">Wishlist</a></li>
        <li><a href="cart.html">Cart</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="login.html">Account</a></li>
      </ul>
    </div>
  </nav>

  <main>
    <div id="viewer"></div>

    <aside id="controls">
      <div class="row" style="justify-content:space-between;">
        <div>
          <strong>1) Upload selfie</strong>
          <div class="hint">Frontal face, good light. JPG/PNG.</div>
        </div>
        <label class="btn" for="selfieInput">Choose file</label>
        <input id="selfieInput" type="file" accept="image/*" style="display:none;" />
      </div>

      <canvas id="selfieCanvas" width="512" height="512" style="display:none;"></canvas>

      <div class="sep"></div>

      <div><strong>2) Detected colors</strong></div>
      <div class="grid">
        <div>
          <div class="row"><label for="skinColor">Skin</label><input id="skinColor" type="color" value="#f2d3c2" /></div>
        </div>
        <div>
          <div class="row"><label for="hairColor">Hair</label><input id="hairColor" type="color" value="#3a2a20" /></div>
        </div>
      </div>

      <div class="sep"></div>

      <div><strong>3) Try our products</strong></div>
      <div id="productList" class="product-list">Loading products...</div>

      <div class="row">
        <button id="applyBtn">Apply Colors</button>
        <button id="resetBtn">Reset Avatar</button>
      </div>
    </aside>
  </main>

  <footer style="padding:12px;text-align:center;color:#888;border-top:1px solid #1b2026;">
    For best results, use a clear, well-lit selfie.
  </footer>

  <!-- Main Script -->
  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/examples/jsm/loaders/GLTFLoader.js";
    import { OrbitControls } from "three/examples/jsm/controls/OrbitControls.js";

    // ===== Scene Setup =====
    const viewer = document.getElementById('viewer');
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(viewer.clientWidth, viewer.clientHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    viewer.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, viewer.clientWidth / viewer.clientHeight, 0.1, 100);
    camera.position.set(0, 1.5, 3);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 0.9));
    const keyLight = new THREE.DirectionalLight(0xffffff, 1);
    keyLight.position.set(3, 5, 2);
    scene.add(keyLight);

    const ground = new THREE.Mesh(new THREE.CircleGeometry(5, 64),
      new THREE.MeshStandardMaterial({ color: 0x0c1116, roughness: 1 }));
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = 0;
    scene.add(ground);

    const loader = new GLTFLoader();
    let avatarRoot = null;
    let clothingCurrent = null;

    // ===== Load Avatar =====
    async function loadModel() {
      if (avatarRoot) scene.remove(avatarRoot);
      const gltf = await loader.loadAsync('imgs/avatar.glb');
      avatarRoot = gltf.scene;
      avatarRoot.traverse(obj => {
        if (obj.isMesh) obj.material = new THREE.MeshStandardMaterial({ color: 0xffffff });
      });
      scene.add(avatarRoot);
    }

    // ===== Selfie Color Estimation =====
    const selfieInput = document.getElementById('selfieInput');
    const canvas = document.getElementById('selfieCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const skinColorInput = document.getElementById('skinColor');
    const hairColorInput = document.getElementById('hairColor');

    function rgbToHex(r, g, b) {
      return "#" + [r, g, b].map(x => Math.round(x).toString(16).padStart(2, '0')).join('');
    }

    async function estimateColorsFromSelfie(file) {
      const img = new Image();
      const url = URL.createObjectURL(file);
      await new Promise(res => { img.onload = res; img.src = url; });
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
      let avgR = 0, avgG = 0, avgB = 0, count = 0;
      for (let i = 0; i < data.length; i += 4) {
        avgR += data[i]; avgG += data[i + 1]; avgB += data[i + 2]; count++;
      }
      skinColorInput.value = rgbToHex(avgR / count, avgG / count, avgB / count);
      hairColorInput.value = "#3a2a20";
      URL.revokeObjectURL(url);
    }

    selfieInput.addEventListener('change', async e => {
      if (e.target.files[0]) await estimateColorsFromSelfie(e.target.files[0]);
    });

    // ===== Apply colors to avatar =====
    document.getElementById('applyBtn').addEventListener('click', () => {
      if (!avatarRoot) return;
      avatarRoot.traverse(obj => {
        if (obj.isMesh) {
          const matName = obj.material.name?.toLowerCase() || '';
          if (matName.includes('skin')) obj.material.color.set(skinColorInput.value);
          if (matName.includes('hair')) obj.material.color.set(hairColorInput.value);
        }
      });
    });

    document.getElementById('resetBtn').addEventListener('click', loadModel);

    // ===== Load products from product.html =====
    async function fetchProducts() {
      try {
        const res = await fetch('product.html');
        if (!res.ok) throw new Error("Failed to fetch product.html");
        const text = await res.text();
        const parser = new DOMParser();
        const doc = parser.parseFromString(text, "text/html");

        const productElements = doc.querySelectorAll('[data-name][data-file]');
        const products = Array.from(productElements).map(el => ({
          name: el.getAttribute('data-name'),
          file: el.getAttribute('data-file')
        }));

        if (products.length === 0) {
          console.warn("No valid products found in product.html");
        }
        return products;
      } catch (e) {
        console.error("Error loading products from product.html:", e);
        return [];
      }
    }

    async function populateProductList() {
      const list = document.getElementById('productList');
      const products = await fetchProducts();
      list.innerHTML = '';

      if (products.length === 0) {
        list.textContent = 'No products available right now.';
        return;
      }

      products.forEach(prod => {
        const div = document.createElement('div');
        div.className = 'product-item';
        div.textContent = prod.name;
        div.addEventListener('click', () => loadClothing(prod.file));
        list.appendChild(div);
      });
    }

    function loadClothing(file) {
      loader.load(file, gltf => {
        if (clothingCurrent) scene.remove(clothingCurrent);
        clothingCurrent = gltf.scene;
        clothingCurrent.position.copy(avatarRoot.position);
        clothingCurrent.scale.copy(avatarRoot.scale);
        scene.add(clothingCurrent);
      });
    }

    // ===== Animation Loop =====
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    // ===== Init =====
    (async function init() {
      await loadModel();
      await populateProductList();
      animate();
    })();

    window.addEventListener('resize', () => {
      const w = viewer.clientWidth, h = viewer.clientHeight;
      renderer.setSize(w, h);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    });
  </script>
</body>
</html>
