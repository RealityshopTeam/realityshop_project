<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Avatar Try-On - Reality Shop</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { margin:0; overflow:hidden; background:#121212; color:white; }
    #canvas-container { width:100%; height:100vh; }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js",
      "three/examples/": "https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/examples/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/examples/controls/OrbitControls.js';

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x121212);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.set(0,1.6,2);

    const renderer = new THREE.WebGLRenderer({ antialias:true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0,1,0);
    controls.update();

    // Lights
    const hemiLight = new THREE.HemisphereLight(0xffffff,0x444444,1.2);
    hemiLight.position.set(0,2,0);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xffffff,1);
    dirLight.position.set(0,2,2);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // Floor
    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(10,10),
      new THREE.ShadowMaterial({opacity:0.3})
    );
    floor.rotation.x = -Math.PI/2;
    floor.position.y = 0;
    floor.receiveShadow = true;
    scene.add(floor);

    const loader = new GLTFLoader();
    let avatar, avatarSkeleton;

    // Morph target values to auto-fit avatar shape (can be dynamic)
    let morphFit = { chest: 0.4, waist: 0.5, hips: 0.3 };

    function buildSkeletonMap(model) {
      const map = {};
      model.traverse(obj => {
        if(obj.isBone) map[obj.name] = obj;
      });
      return map;
    }

    function applyMorphTargets(mesh, morphValues) {
      if(mesh.morphTargetDictionary) {
        if(morphValues.chest !== undefined && mesh.morphTargetDictionary['chest'] !== undefined)
          mesh.morphTargetInfluences[mesh.morphTargetDictionary['chest']] = morphValues.chest;
        if(morphValues.waist !== undefined && mesh.morphTargetDictionary['waist'] !== undefined)
          mesh.morphTargetInfluences[mesh.morphTargetDictionary['waist']] = morphValues.waist;
        if(morphValues.hips !== undefined && mesh.morphTargetDictionary['hips'] !== undefined)
          mesh.morphTargetInfluences[mesh.morphTargetDictionary['hips']] = morphValues.hips;
      }
    }

    async function loadAvatar() {
      return new Promise((resolve, reject) => {
        loader.load('baseAvatar.glb', gltf => {
          avatar = gltf.scene;
          scene.add(avatar);
          avatarSkeleton = buildSkeletonMap(avatar);

          // Baseline: neutral pose, scale, reset morph targets
          avatar.position.set(0, 0, 0);
          avatar.rotation.set(0, 0, 0);
          avatar.scale.set(1, 1, 1);

          avatar.traverse(obj => {
            if(obj.isMesh && obj.morphTargetInfluences) {
              for(let i = 0; i < obj.morphTargetInfluences.length; i++) {
                obj.morphTargetInfluences[i] = 0; // baseline morph reset
              }
            }
          });

          // Default T-pose function
          function poseTPose(skeleton) {
            if(skeleton['mixamorigLeftArm'] && skeleton['mixamorigRightArm']) {
              skeleton['mixamorigLeftArm'].rotation.z = Math.PI/2;
              skeleton['mixamorigRightArm'].rotation.z = -Math.PI/2;
            }
            if(skeleton['mixamorigLeftUpLeg'] && skeleton['mixamorigRightUpLeg']) {
              skeleton['mixamorigLeftUpLeg'].rotation.y = 0.1;
              skeleton['mixamorigRightUpLeg'].rotation.y = -0.1;
            }
          }
          poseTPose(avatarSkeleton);

          // Apply morph-fit values after baseline
          avatar.traverse(obj => {
            if(obj.isMesh) {
              applyMorphTargets(obj, morphFit);
              obj.castShadow = true;
              obj.receiveShadow = true;
            }
          });

          resolve();
        }, undefined, reject);
      });
    }

    function retargetClothingSkeleton(clothing, avatarSkeleton) {
      clothing.traverse(obj => {
        if(obj.isSkinnedMesh && obj.skeleton) {
          obj.skeleton.bones.forEach((bone, i) => {
            if(avatarSkeleton[bone.name]) {
              obj.skeleton.bones[i] = avatarSkeleton[bone.name];
            }
          });
          obj.bind(new THREE.Skeleton(Object.values(avatarSkeleton)), obj.bindMatrix);
        }
      });
    }

    // Get bounding box for avatar part based on mesh name substring (e.g. 'spine' or 'hips')
    function getBoundingBoxForAvatarPart(partName) {
      const bbox = new THREE.Box3();
      let found = false;
      avatar.traverse(obj => {
        if(obj.isMesh && obj.name.toLowerCase().includes(partName.toLowerCase())) {
          if(!found) {
            bbox.copy(new THREE.Box3().setFromObject(obj));
            found = true;
          } else {
            bbox.union(new THREE.Box3().setFromObject(obj));
          }
        }
      });
      return found ? bbox : null;
    }

    // Scale and position clothing to fit avatar bounding box dynamically
    function fitClothingToAvatarPart(clothing, avatarBBox) {
      if(!avatarBBox) {
        console.warn('No bounding box found to fit clothing.');
        return;
      }
      const clothingBBox = new THREE.Box3().setFromObject(clothing);
      const avatarHeight = avatarBBox.max.y - avatarBBox.min.y;
      const clothingHeight = clothingBBox.max.y - clothingBBox.min.y;

      // Scale uniformly for height match
      const scaleFactor = avatarHeight / clothingHeight;
      clothing.scale.setScalar(scaleFactor);

      clothing.updateMatrixWorld();
      const scaledClothingBBox = new THREE.Box3().setFromObject(clothing);

      // Align bottom of clothing with bottom of avatar bbox on y-axis
      const offsetY = avatarBBox.min.y - scaledClothingBBox.min.y;
      clothing.position.set(0, offsetY, 0);
    }

    async function loadClothing() {
      const selected = JSON.parse(localStorage.getItem("selectedClothing") || 'null');
      if(!selected || !selected.glb) {
        console.warn("No selected clothing found.");
        return;
      }
      return new Promise((resolve, reject) => {
        loader.load(selected.glb, gltf => {
          const clothing = gltf.scene;

          clothing.traverse(obj => {
            if(obj.isMesh || obj.isSkinnedMesh) {
              obj.castShadow = true;
              obj.receiveShadow = true;
              applyMorphTargets(obj, morphFit);
            }
          });

          retargetClothingSkeleton(clothing, avatarSkeleton);

          // Determine avatar part for fitting dynamically
          const avatarPart = (selected.category === 'pants' || selected.category === 'skirt') ? 'hips' : 'spine';
          const avatarBBox = getBoundingBoxForAvatarPart(avatarPart);

          fitClothingToAvatarPart(clothing, avatarBBox);

          // Parent clothing to avatar root to follow animations/movements
          avatar.add(clothing);

          resolve();
        }, undefined, reject);
      });
    }

    async function init() {
      await loadAvatar();
      await loadClothing();
    }
    init();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
