<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reality Shop – Avatar Try-On</title>

  <!-- Importmap for Three.js -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/examples/jsm/loaders/GLTFLoader.js": "https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js",
        "three/examples/jsm/controls/OrbitControls.js": "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js"
      }
    }
  </script>

  <style>
    body {
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
      font-family: "Poppins", sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    h1 {
      text-align: center;
      color: #06b4d4;
      font-weight: 700;
      margin: 10px 0;
    }
    #avatarCanvas { flex: 1; display: block; }
    #productList {
      background: #1e293b;
      padding: 10px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      overflow-y: auto;
      height: 140px;
    }
    .product-item {
      background: #334155;
      padding: 8px 14px;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.3s;
      color: #fff;
    }
    .product-item:hover {
      background: #06b4d4;
      transform: translateY(-2px);
    }
    #uploadContainer {
      text-align: center;
      padding: 6px;
      background: #1e293b;
    }
    #selfieInput {
      background: #06b4d4;
      color: white;
      padding: 6px 12px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <h1>Reality Shop – Avatar Try-On</h1>
  <div id="uploadContainer">
    <input type="file" id="selfieInput" accept="image/*" />
    <small> Upload a selfie to auto-match skin & hair color </small>
  </div>
  <canvas id="avatarCanvas"></canvas>
  <div id="productList">Loading products...</div>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/examples/jsm/loaders/GLTFLoader.js";
    import { OrbitControls } from "three/examples/jsm/controls/OrbitControls.js";

    // === Scene Setup ===
    const canvas = document.getElementById("avatarCanvas");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight - 180);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f172a);

    const camera = new THREE.PerspectiveCamera(
      50,
      window.innerWidth / (window.innerHeight - 180),
      0.1,
      100
    );
    camera.position.set(0, 1.6, 3);
    scene.add(camera);

    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1);
    dirLight.position.set(5, 10, 7.5);
    scene.add(hemiLight, dirLight);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    const loader = new GLTFLoader();
    let avatar, clothing, mixer, animations;

    // === Load Avatar with Animations ===
    loader.load("imgs/avatar.glb", (gltf) => {
      avatar = gltf.scene;
      avatar.scale.set(1, 1, 1);
      scene.add(avatar);

      if (gltf.animations && gltf.animations.length > 0) {
        mixer = new THREE.AnimationMixer(avatar);
        animations = gltf.animations;
        const action = mixer.clipAction(animations[0]);
        action.play();
      }
    });

    // === Fit and Attach Clothing ===
    function loadClothing(url) {
      if (!url) return alert("No 3D model found for this item.");
      if (clothing) { scene.remove(clothing); clothing = null; }

      loader.load(
        url,
        (gltf) => {
          clothing = gltf.scene;
          scene.add(clothing);

          // Scale and position relative to avatar
          const avatarBox = new THREE.Box3().setFromObject(avatar);
          const clothBox = new THREE.Box3().setFromObject(clothing);

          const avatarSize = new THREE.Vector3();
          const clothSize = new THREE.Vector3();
          avatarBox.getSize(avatarSize);
          clothBox.getSize(clothSize);

          const scaleFactor = avatarSize.y / clothSize.y;
          clothing.scale.multiplyScalar(scaleFactor);

          const avatarCenter = avatarBox.getCenter(new THREE.Vector3());
          const clothCenter = clothBox.getCenter(new THREE.Vector3());
          clothing.position.sub(clothCenter).add(avatarCenter);
          clothing.position.y += 0.02 * avatarSize.y;
        },
        undefined,
        (err) => console.error("Error loading clothing:", err)
      );
    }

    // === Fetch Products from product.html ===
    async function fetchProductsFromHTML() {
      try {
        const res = await fetch("product.html");
        const text = await res.text();
        const match = text.match(/const products\\s*=\\s*(\\[.*?\\]);/s);
        if (!match) throw new Error("No products found in product.html");
        const products = Function(`"use strict"; return ${match[1]};`)();
        return products.filter((p) =>
          ["Clothing", "Shoes", "Accessories"].includes(p.category)
        );
      } catch (err) {
        console.error(err);
        return [];
      }
    }

    // === Populate Product List ===
    async function populateProductList() {
      const list = document.getElementById("productList");
      list.textContent = "Loading...";
      const products = await fetchProductsFromHTML();
      list.innerHTML = "";

      if (products.length === 0) {
        list.textContent = "No wearable products found.";
        return;
      }

      products.forEach((p) => {
        const div = document.createElement("div");
        div.className = "product-item";
        div.textContent = p.name;
        div.onclick = () => loadClothing(p.glb);
        list.appendChild(div);
      });
    }

    // === Average Skin Tone from Selfie ===
    document.getElementById("selfieInput").addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const img = new Image();
      img.src = URL.createObjectURL(file);
      await img.decode();

      const tempCanvas = document.createElement("canvas");
      const ctx = tempCanvas.getContext("2d");
      tempCanvas.width = 64;
      tempCanvas.height = 64;
      ctx.drawImage(img, 0, 0, 64, 64);
      const data = ctx.getImageData(0, 0, 64, 64).data;

      let r = 0, g = 0, b = 0, count = 0;
      for (let i = 0; i < data.length; i += 4) {
        r += data[i];
        g += data[i + 1];
        b += data[i + 2];
        count++;
      }
      const avgColor = new THREE.Color(r / count / 255, g / count / 255, b / count / 255);

      // Apply to avatar skin/hair materials
      avatar.traverse((child) => {
        if (child.isMesh) {
          const name = child.name.toLowerCase();
          if (name.includes("skin")) {
            child.material.color.copy(avgColor);
          } else if (name.includes("hair")) {
            const darker = avgColor.clone().multiplyScalar(0.5);
            child.material.color.copy(darker);
          }
        }
      });
    });

    // === Resize Handler ===
    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / (window.innerHeight - 180);
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight - 180);
    });

    // === Animation Loop ===
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      if (mixer) mixer.update(clock.getDelta());
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    populateProductList();
  </script>
</body>
</html>
