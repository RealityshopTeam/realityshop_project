<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reality Shop - Avatar Customization</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "GLTFLoader": "https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js",
        "OrbitControls": "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js"
      }
    }
  </script>
  <style>
    body { margin: 0; overflow: hidden; background: #111; }
    canvas { display: block; }
    #info {
      position: absolute; top: 10px; left: 10px;
      color: #fff; background: rgba(0,0,0,0.6);
      padding: 10px 14px; border-radius: 6px;
      font-family: sans-serif;
    }
  </style>
</head>
<body>
  <div id="info">👕 Loading avatar with selected clothing...</div>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'GLTFLoader';
    import { OrbitControls } from 'OrbitControls';

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.6, 3);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Lights
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
    hemiLight.position.set(0, 20, 0);
    scene.add(hemiLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    // Controls
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    const loader = new GLTFLoader();
    let avatar, clothing;

    // Load base avatar
    loader.load("baseAvatar.glb", (gltf) => {
      avatar = gltf.scene;
      avatar.scale.set(1,1,1);
      scene.add(avatar);

      // After avatar loads, load selected clothing
      const selected = JSON.parse(localStorage.getItem("selectedClothing"));
      if (selected && selected.glb) {
        loader.load(selected.glb, (clothingGLTF) => {
          clothing = clothingGLTF.scene;
          clothing.scale.set(1,1,1);
          clothing.position.set(0,0,0); // adjust to fit avatar
          avatar.add(clothing); // attach clothing to avatar
          document.getElementById("info").innerText = `✅ Wearing: ${selected.name}`;
        });
      } else {
        document.getElementById("info").innerText = "⚠️ No clothing selected.";
      }
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
