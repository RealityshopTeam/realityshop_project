<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Advanced Avatar Try-On - Reality Shop</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body { margin: 0; overflow: hidden; background: #121212; }
  canvas { display: block; }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
import { AnimationMixer, SkeletonHelper } from 'three';

let scene, camera, renderer, controls;
let avatar, avatarSkeleton, mixer;
let clothingMeshes = [];
const clock = new THREE.Clock();
const loader = new GLTFLoader();

// --- Scene Setup ---
scene = new THREE.Scene();
scene.background = new THREE.Color(0x121212);

camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0, 1.6, 3);

renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.5, 0);
controls.update();

// Lights
const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
scene.add(hemi);
const dir = new THREE.DirectionalLight(0xffffff, 0.8);
dir.position.set(0, 10, 10);
scene.add(dir);

// --- Load Avatar ---
loader.load('imgs/avatar.glb', gltf => {
  avatar = SkeletonUtils.clone(gltf.scene);
  scene.add(avatar);

  avatar.traverse(obj => {
    if(obj.isSkinnedMesh && !avatarSkeleton) avatarSkeleton = obj.skeleton;
  });

  // Optional: visualize skeleton for debugging
  // const helper = new SkeletonHelper(avatar);
  // scene.add(helper);

  if(gltf.animations && gltf.animations.length > 0){
    mixer = new AnimationMixer(avatar);
    gltf.animations.forEach(clip => mixer.clipAction(clip).play());
  }

  loadClothing();
});

// --- Load Clothing ---
function loadClothing(){
  const selected = localStorage.getItem("selectedClothing");
  if(!selected) return;
  const product = JSON.parse(selected);
  if(!product.glb) return;

  loader.load(product.glb, gltf => {
    const clothing = SkeletonUtils.clone(gltf.scene);

    clothing.traverse(mesh => {
      if(mesh.isSkinnedMesh){
        mesh.skeleton = avatarSkeleton;
        mesh.bind(avatarSkeleton);
        clothingMeshes.push(mesh);

        // Advanced fitting
        fitClothing(mesh, product.category);
      }
    });

    scene.add(clothing);
  });
}

// --- Advanced Clothing Fit Function ---
function fitClothing(mesh, category){
  const avatarBox = new THREE.Box3().setFromObject(avatar);
  const avatarHeight = avatarBox.max.y - avatarBox.min.y;

  const clothBox = new THREE.Box3().setFromObject(mesh);
  const clothHeight = clothBox.max.y - clothBox.min.y;

  let scale = avatarHeight / clothHeight;

  switch(category){
    case "Clothing": // Shirts/Jackets
      scale *= 0.15;
      mesh.scale.set(scale, scale, scale);
      mesh.position.y = avatarBox.min.y + avatarHeight *1- (clothBox.min.y + clothHeight/3)*scale;
      break;
    case "Pants":
      scale *= 0.95;
      mesh.scale.set(scale, scale, scale);
      mesh.position.y = avatarBox.min.y + avatarHeight * 0.25 - (clothBox.min.y + clothHeight/2)*scale;
      break;
    case "Shoes":
      scale *= 1.0;
      mesh.scale.set(scale, scale, scale);
      mesh.position.y = avatarBox.min.y - (clothBox.min.y)*scale + 0.02;
      break;
    case "Accessories":
      scale *= 1.0;
      mesh.scale.set(scale, scale, scale);
      mesh.position.y = avatarBox.max.y - (clothBox.max.y)*scale - 0.05;
      break;
    default:
      mesh.position.y = avatarBox.min.y + avatarHeight * 0.55;
      mesh.scale.set(scale, scale, scale);
  }
}

// --- Animation & Sync ---
function animate(){
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  if(mixer) mixer.update(delta);

  // Keep clothing synced
  clothingMeshes.forEach(mesh => mesh.skeleton.pose());

  renderer.render(scene, camera);
}
animate();

// --- Handle Resize ---
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>
</body>
</html>
