<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Avatar Try-On - Reality Shop</title>
  <style>
    body { margin: 0; overflow: hidden; background: #111; }
    #loading {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: white; font-family: sans-serif;
    }
  </style>

  <!-- ✅ Import Map for Three.js -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/examples/jsm/controls/OrbitControls": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js",
      "three/examples/jsm/loaders/GLTFLoader": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js"
    }
  }
  </script>
</head>

<body>
  <div id="loading">Loading Avatar...</div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/examples/jsm/controls/OrbitControls";
    import { GLTFLoader } from "three/examples/jsm/loaders/GLTFLoader";

    let scene, camera, renderer, controls, mixer, clock, avatar, skeleton;

    init();
    animate();

    async function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x202020);

      // Camera setup
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 1.6, 3);

      // Renderer setup
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      document.body.appendChild(renderer.domElement);

      // Orbit controls
      controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 1.5, 0);
      controls.update();

      // Lights
      const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.5);
      hemiLight.position.set(0, 20, 0);
      scene.add(hemiLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
      dirLight.position.set(-3, 10, -10);
      dirLight.castShadow = true;
      scene.add(dirLight);

      clock = new THREE.Clock();
      const loader = new GLTFLoader();

      // ✅ Load main avatar
      try {
        const avatarGLB = await loader.loadAsync("imgs/avatar.glb"); // Make sure this exists
        avatar = avatarGLB.scene;
        scene.add(avatar);

        avatar.traverse((obj) => {
          if (obj.isSkinnedMesh) skeleton = obj.skeleton;
        });

        // Play avatar animations (if any)
        if (avatarGLB.animations && avatarGLB.animations.length > 0) {
          mixer = new THREE.AnimationMixer(avatar);
          avatarGLB.animations.forEach((clip) => {
            const action = mixer.clipAction(clip);
            action.play();
          });
        }
      } catch (err) {
        console.error("❌ Error loading avatar.glb:", err);
      }

      document.getElementById("loading").style.display = "none";

      // ✅ Load selected clothing
      let selectedProduct = localStorage.getItem("selectedProduct");
      if (!selectedProduct || selectedProduct === "null" || selectedProduct.trim() === "") {
        selectedProduct = "imgs/shirt.glb"; // fallback file
      }

      console.log("🧥 Selected product to load:", selectedProduct);

      try {
        const clothGLB = await loader.loadAsync(selectedProduct);
        const clothing = clothGLB.scene;

        let attached = false;
        clothing.traverse((obj) => {
          if (obj.isSkinnedMesh && skeleton) {
            obj.skeleton = skeleton;
            obj.bind(skeleton, obj.bindMatrix);
            attached = true;
          }
        });

        if (!attached) {
          // Static fallback for non-rigged meshes
          clothing.position.set(0, 0, 0);
          clothing.scale.set(1, 1, 1);
          avatar.add(clothing);
          console.warn("⚠️ Clothing is not rigged, added as static mesh.");
        } else {
          avatar.add(clothing);
          console.log("✅ Clothing attached to avatar skeleton.");
        }

      } catch (err) {
        console.error("❌ Error loading clothing model:", err);
        console.warn("💡 Check file path or localStorage value.");
      }

      window.addEventListener("resize", onWindowResize);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      if (mixer) mixer.update(delta);
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
