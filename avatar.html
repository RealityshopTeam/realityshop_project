<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Reality Shop - Avatar Try-On</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  body { margin:0; background:#121212; color:white; }
  #canvas-container { width:100%; height:100vh; display:block; }
</style>
</head>
<body>
<div id="canvas-container"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js",
    "three/examples/": "https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/examples/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/examples/controls/OrbitControls.js';

const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x121212);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0,1.6,2);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0,1,0);
controls.update();

// Lights
scene.add(new THREE.HemisphereLight(0xffffff,0x444444,1.2));
const dirLight = new THREE.DirectionalLight(0xffffff,1);
dirLight.position.set(0,2,2);
scene.add(dirLight);

// Floor
const floor = new THREE.Mesh(new THREE.PlaneGeometry(10,10), new THREE.ShadowMaterial({opacity:0.3}));
floor.rotation.x=-Math.PI/2;
floor.receiveShadow=true;
scene.add(floor);

// Loader
const loader = new GLTFLoader();

let avatar, avatarSkeleton, avatarBox;

// Load Avatar
async function loadAvatar(url="baseAvatar.glb") {
  return new Promise((resolve, reject)=>{
    loader.load(url, gltf=>{
      if(avatar) scene.remove(avatar);
      avatar = gltf.scene;
      avatar.traverse(c=>{
        if(c.isMesh) { c.castShadow=true; c.receiveShadow=true; }
        if(c.isSkinnedMesh && c.skeleton) avatarSkeleton = c.skeleton;
      });
      scene.add(avatar);

      avatarBox = new THREE.Box3().setFromObject(avatar);

      // Play idle animation if available
      if(gltf.animations && gltf.animations.length > 0) {
        const mixer = new THREE.AnimationMixer(avatar);
        mixer.clipAction(gltf.animations[0]).play();
        animateMixers.push(mixer);
      }

      resolve();
    }, undefined, err=>reject(err));
  });
}

// Load Clothing
async function loadClothing() {
  const selected = JSON.parse(localStorage.getItem("selectedClothing") || null);
  if(!selected || !selected.glb) return;

  loader.load(selected.glb, gltf=>{
    const clothing = gltf.scene;
    let bound = false;

    clothing.traverse(c=>{
      if(c.isSkinnedMesh && avatarSkeleton){
        try {
          c.bind(avatarSkeleton);  // bind clothing to avatar skeleton
          bound = true;
        } catch(e){
          console.warn("⚠️ Skeleton binding failed:", e);
        }
      }
    });

    if(!bound){
      // Fallback → bounding box fit
      const avatarSize = avatarBox.getSize(new THREE.Vector3());
      const clothingBox = new THREE.Box3().setFromObject(clothing);
      const clothingSize = clothingBox.getSize(new THREE.Vector3());

      const scale = (avatarSize.x * 0.5) / clothingSize.x;
      clothing.scale.set(scale, scale, scale);

      clothing.position.set(0, avatarBox.min.y + avatarSize.y*0.5, 0);
    }

    scene.add(clothing);
    console.log("✅ Clothing loaded:", selected.name, "Rigged:", bound);
  }, undefined, err=>console.error(err));
}

// Init
async function init() {
  await loadAvatar();
  await loadClothing();
}
init();

// Animation mixers for avatar
const animateMixers = [];

window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Render loop
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  animateMixers.forEach(m => m.update(delta));
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
