<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Avatar Try-On - Reality Shop</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { margin:0; overflow:hidden; background:#121212; color:white; }
    #canvas-container { width:100%; height:100vh; }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js",
      "three/examples/": "https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/examples/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/examples/controls/OrbitControls.js';

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x121212);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.set(0,1.6,2);

    const renderer = new THREE.WebGLRenderer({ antialias:true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0,1,0);
    controls.update();

    // Lights
    const hemiLight = new THREE.HemisphereLight(0xffffff,0x444444,1.2);
    hemiLight.position.set(0,2,0);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xffffff,1);
    dirLight.position.set(0,2,2);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // Floor
    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(10,10),
      new THREE.ShadowMaterial({opacity:0.3})
    );
    floor.rotation.x = -Math.PI/2;
    floor.position.y = 0;
    floor.receiveShadow = true;
    scene.add(floor);

    const loader = new GLTFLoader();
    let avatar, avatarSkeleton;

    // Example "auto-fit" body morph values that could come from clothing metadata
    // Adjust these values dynamically if you have real user data or clothing sizes
    let morphFit = {
      chest: 0.4,
      waist: 0.5,
      hips: 0.3
    };

    // Utility to build a bone name to bone object map
    function buildSkeletonMap(model) {
      const map = {};
      model.traverse(obj => {
        if(obj.isBone) map[obj.name] = obj;
      });
      return map;
    }

    // Apply morph targets to avatar mesh for auto-fitting
    function applyMorphTargets(mesh, morphValues) {
      if(mesh.morphTargetDictionary) {
        if(morphValues.chest && mesh.morphTargetDictionary["chest"] !== undefined)
          mesh.morphTargetInfluences[mesh.morphTargetDictionary["chest"]] = morphValues.chest;
        if(morphValues.waist && mesh.morphTargetDictionary["waist"] !== undefined)
          mesh.morphTargetInfluences[mesh.morphTargetDictionary["waist"]] = morphValues.waist;
        if(morphValues.hips && mesh.morphTargetDictionary["hips"] !== undefined)
          mesh.morphTargetInfluences[mesh.morphTargetDictionary["hips"]] = morphValues.hips;
      }
    }

    async function loadAvatar() {
      return new Promise((resolve, reject) => {
        loader.load('baseAvatar.glb', gltf => {
          avatar = gltf.scene;
          scene.add(avatar);

          // Setup skeleton map
          avatarSkeleton = buildSkeletonMap(avatar);

          // Apply morph targets to avatar's meshes
          avatar.traverse(obj => {
            if(obj.isMesh) {
              applyMorphTargets(obj, morphFit);
              obj.castShadow = true;
              obj.receiveShadow = true;
            }
          });

          resolve();
        }, undefined, reject);
      });
    }

    // Retarget clothing skeleton to avatar's skeleton by matching bone names
    function retargetClothingSkeleton(clothing) {
      clothing.traverse(obj => {
        if(obj.isSkinnedMesh && obj.skeleton) {
          obj.skeleton.bones.forEach((bone, i) => {
            if (avatarSkeleton[bone.name]) {
              obj.skeleton.bones[i] = avatarSkeleton[bone.name];
            }
          });
          obj.bind(new THREE.Skeleton(Object.values(avatarSkeleton)), obj.bindMatrix);
        }
      });
    }

    async function loadClothing() {
      const selected = JSON.parse(localStorage.getItem("selectedClothing") || 'null');
      if(!selected || !selected.glb) {
        console.warn("No selected clothing found in localStorage.");
        return;
      }
      
      return new Promise((resolve, reject) => {
        loader.load(selected.glb, gltf => {
          const clothing = gltf.scene;

          // Set shadows on clothing
          clothing.traverse(obj => {
            if(obj.isMesh || obj.isSkinnedMesh) {
              obj.castShadow = true;
              obj.receiveShadow = true;

              // Apply morph targets to clothing if present (sync with avatar morphFit)
              applyMorphTargets(obj, morphFit);
            }
          });

          // Retarget clothing skeleton to avatar skeleton for perfect fit and animation
          retargetClothingSkeleton(clothing);

          // Add clothing as child of avatar so it moves with avatar.animation
          avatar.add(clothing);

          resolve();
        }, undefined, reject);
      });
    }

    async function init() {
      await loadAvatar();
      await loadClothing();
    }

    init();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();

  </script>
</body>
</html>
