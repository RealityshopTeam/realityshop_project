<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Avatar Customization</title>
  <style>
    body { margin: 0; overflow: hidden; background: #111; }
    canvas { display: block; }
    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 8px 12px;
      background: rgba(0,0,0,0.6);
      color: #fff;
      font-family: Arial, sans-serif;
      font-size: 14px;
      border-radius: 6px;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.152.2/build/three.module.js",
        "three/examples/jsm/loaders/GLTFLoader.js": "https://unpkg.com/three@0.152.2/examples/jsm/loaders/GLTFLoader.js",
        "three/examples/jsm/controls/OrbitControls.js": "https://unpkg.com/three@0.152.2/examples/jsm/controls/OrbitControls.js"
      }
    }
  </script>
</head>
<body>
  <div id="info">👕 Loading avatar...</div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';

    // Scene setup
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x202020);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.6, 3);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Lights
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
    hemiLight.position.set(0, 20, 0);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1);
    dirLight.position.set(5, 10, 7.5);
    scene.add(dirLight);

    // Controls
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 1.4, 0);

    // Loader
    const loader = new GLTFLoader();
    let avatar, clothing;

    // Load base avatar
    loader.load('./baseAvatar.glb', (gltf) => {
      avatar = gltf.scene;
      avatar.position.set(0, 0, 0);
      avatar.scale.set(1, 1, 1);
      scene.add(avatar);
      document.getElementById('info').innerText = "✅ Avatar loaded";
      
      // After base loads, try clothing
      loadClothing();
    }, undefined, (err) => {
      console.error("Error loading avatar:", err);
      document.getElementById('info').innerText = "❌ Failed to load avatar";
    });

    // Load clothing from localStorage
    function loadClothing() {
      const selected = JSON.parse(localStorage.getItem("selectedClothing"));
      if (!selected || !selected.glb) {
        document.getElementById('info').innerText = "👕 No clothing selected.";
        return;
      }

      loader.load(selected.glb, (gltf) => {
        clothing = gltf.scene;
        clothing.position.set(0, 0, 0);
        clothing.scale.set(1, 1, 1);
        avatar.add(clothing);
        document.getElementById('info').innerText = `✅ Wearing: ${selected.name}`;
        console.log("Clothing applied:", selected);
      }, undefined, (err) => {
        console.error("Error loading clothing:", err);
        document.getElementById('info').innerText = "❌ Failed to load clothing";
      });
    }

    // Handle resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Render loop
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
