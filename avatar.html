<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Avatar Try-On - Reality Shop</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  
  <!-- Importmap for Three.js -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js",
      "three/examples/": "https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/"
    }
  }
  </script>
  <!-- Ready Player Me SDK -->
  <script src="https://cdn.readyplayer.me/sdk/readyplayerme.js"></script>

  <style>
    body { margin: 0; overflow: hidden; background: #111; }
    #canvas-container { width: 100vw; height: 100vh; }
    #back-btn {
      position: absolute; top: 15px; left: 15px;
      padding: 10px 20px; background: linear-gradient(135deg,#00cfff,#0072ff);
      border: none; border-radius: 20px; color: #fff; font-weight: bold;
      cursor: pointer; box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      z-index: 10;
    }
    #rpm-frame {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      border: none; z-index: 20;
    }
  </style>
</head>
<body>
  <button id="back-btn" onclick="window.location.href='product.html'">⟵ Back</button>
  <div id="canvas-container"></div>
  <iframe id="rpm-frame" allow="camera *; microphone *"
    src="https://demo.readyplayer.me/avatar?frameApi"></iframe>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/examples/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/examples/loaders/GLTFLoader.js';

    const container = document.getElementById('canvas-container');
    const loader = new GLTFLoader();

    // Scene
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111);

    // Camera
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.6, 3);

    // Renderer
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    // Controls
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.5, 0);
    controls.update();

    // Lights
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
    hemiLight.position.set(0, 20, 0);
    scene.add(hemiLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1);
    dirLight.position.set(3, 10, 10);
    scene.add(dirLight);

    let avatar, mixer;

    // --- Load Avatar from Ready Player Me ---
    const rpmFrame = document.getElementById("rpm-frame");
    window.addEventListener("message", (event) => {
      if (event.origin !== "https://demo.readyplayer.me") return;
      const url = event.data?.url;
      if (url && url.endsWith(".glb")) {
        console.log("Avatar Loaded:", url);
        loadAvatar(url);
        rpmFrame.style.display = "none"; // hide iframe after avatar selection
      }
    });

    function loadAvatar(url) {
      loader.load(url, (gltf) => {
        avatar = gltf.scene;
        avatar.scale.set(1.2, 1.2, 1.2);
        avatar.position.set(0, 0, 0);
        scene.add(avatar);

        if (gltf.animations.length > 0) {
          mixer = new THREE.AnimationMixer(avatar);
          gltf.animations.forEach((clip) => mixer.clipAction(clip).play());
        }

        loadSelectedClothing(gltf);
      });
    }

    // --- Load Clothing from product.html ---
    function loadSelectedClothing(avatarGLTF) {
      const selectedProducts = JSON.parse(localStorage.getItem("selectedProducts") || "[]");

      if (!selectedProducts.length) {
        console.log("No clothing selected.");
        return;
      }

      selectedProducts.forEach(product => {
        loader.load(product.glb, (gltf) => {
          let prodMesh = null;
          gltf.scene.traverse(child => { if (child.isSkinnedMesh) prodMesh = child; });

          if (!prodMesh) {
            avatar.add(gltf.scene);
            console.warn(product.name + ": not rigged, only attached.");
            return;
          }

          // Match skeleton with avatar
          let avatarMesh = null;
          avatarGLTF.scene.traverse(child => { if (child.isSkinnedMesh) avatarMesh = child; });
          if (!avatarMesh) return;

          prodMesh.skeleton = avatarMesh.skeleton;
          prodMesh.bind(avatarMesh.skeleton);
          avatar.add(prodMesh);

          prodMesh.scale.set(1, 1, 1); // adjust if needed
          prodMesh.position.set(0, 0, 0);
          console.log("Clothing attached:", product.name);
        });
      });
    }

    // --- Animate ---
    function animate() {
      requestAnimationFrame(animate);
      if (mixer) mixer.update(0.016);
      renderer.render(scene, camera);
    }
    animate();

    // --- Responsive ---
    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
