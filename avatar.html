<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Avatar Try-On - Reality Shop</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body { margin: 0; overflow: hidden; background: #121212; }
  #avatar-container { width: 100vw; height: 100vh; }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
import { AnimationMixer } from 'three';

let scene, camera, renderer, controls;
let avatar, avatarSkeleton, mixer;
let clothingMeshes = [];
const clock = new THREE.Clock();
const loader = new GLTFLoader();

// === Scene Setup ===
scene = new THREE.Scene();
scene.background = new THREE.Color(0x121212);
camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0,1.6,3);

renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0,1.5,0);
controls.update();

scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.2));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(0,10,10);
scene.add(dirLight);

// === Load Avatar ===
loader.load('imgs/avatar.glb', gltf => {
  avatar = SkeletonUtils.clone(gltf.scene);
  scene.add(avatar);

  // Find avatar skeleton
  avatar.traverse(obj => {
    if(obj.isSkinnedMesh && !avatarSkeleton){
      avatarSkeleton = obj.skeleton;
    }
  });

  // Animation Mixer for avatar
  mixer = new AnimationMixer(avatar);
  gltf.animations.forEach(clip => mixer.clipAction(clip).play());

  // Load clothing after avatar
  loadClothing();
});

// === Load Clothing Dynamically ===
function loadClothing(){
  const selected = localStorage.getItem("selectedClothing");
  if(!selected) return;
  const product = JSON.parse(selected);
  if(!product.glb) return;

  loader.load(product.glb, gltf => {
    const clothing = SkeletonUtils.clone(gltf.scene);

    // Bind clothing to avatar skeleton
    clothing.traverse(mesh => {
      if(mesh.isSkinnedMesh){
        mesh.skeleton = avatarSkeleton;
        mesh.bind(avatarSkeleton);
        clothingMeshes.push(mesh);
      }
    });

    // Fit clothing automatically
    autoFitClothing(clothing, product.category);
    scene.add(clothing);

    // Apply avatar animations to clothing
    if(gltf.animations && gltf.animations.length > 0){
      const clothingMixer = new AnimationMixer(clothing);
      gltf.animations.forEach(clip => clothingMixer.clipAction(clip).play());
      // Store clothing mixer (optional, for more complex syncing)
      clothing.meshMixer = clothingMixer;
    }
  });
}

// === Automatic Clothing Fit Function ===
function autoFitClothing(clothing, category){
  const clothBox = new THREE.Box3().setFromObject(clothing);
  const clothSize = new THREE.Vector3();
  clothBox.getSize(clothSize);

  const avatarBox = new THREE.Box3().setFromObject(avatar);
  const avatarSize = new THREE.Vector3();
  avatarBox.getSize(avatarSize);

  // Scale to match avatar
  let scaleFactor = avatarSize.y / clothSize.y;

  switch(category){
    case "Clothing": // Shirts / Jackets
      scaleFactor *= 0.95;
      clothing.position.y = avatarBox.min.y + avatarSize.y * 0.55;
      break;
    case "Pants":
      scaleFactor *= 0.95;
      clothing.position.y = avatarBox.min.y + avatarSize.y * 0.25;
      break;
    case "Shoes":
      scaleFactor *= 1.0;
      clothing.position.y = avatarBox.min.y + 0.02;
      break;
    case "Accessories":
      scaleFactor *= 1.0;
      clothing.position.y = avatarBox.max.y - 0.05;
      break;
    default:
      clothing.position.y = avatarBox.min.y + avatarSize.y * 0.55;
  }

  clothing.scale.setScalar(scaleFactor);
}

// === Animation Loop ===
function animate(){
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  if(mixer) mixer.update(delta);
  renderer.render(scene, camera);
}
animate();

// === Window Resize Handling ===
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
