<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Avatar Viewer - Three.js (Importmap)</title>
  <style>
    body { margin: 0; overflow: hidden; background: #111; }
    canvas { display: block; }
  </style>

  <!-- Importmap -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/examples/jsm/loaders/GLTFLoader": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js",
      "three/examples/jsm/controls/OrbitControls": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js"
    }
  }
  </script>
</head>
<body>
  <button>back</button>
<script type="module">
  import * as THREE from "three";
  import { GLTFLoader } from "three/examples/jsm/loaders/GLTFLoader";
  import { OrbitControls } from "three/examples/jsm/controls/OrbitControls";

  let scene, camera, renderer, controls, mixer, clock;
  let avatar, skeleton;
  let clothingItems = {};
  const loader = new GLTFLoader();

  init();
  animate();

  function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x202020);

    camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.6, 3);

    renderer = new THREE.WebGLRenderer({antialias: true});
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.5, 0);
    controls.update();

    // Lights
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.5);
    hemiLight.position.set(0, 20, 0);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(-3, 10, -10);
    dirLight.castShadow = true;
    scene.add(dirLight);

    clock = new THREE.Clock();

    // ✅ Load base avatar
    loader.load("imgs/avatar.glb", (gltf) => {
      avatar = gltf.scene;
      avatar.traverse((obj) => {
        if (obj.isSkinnedMesh) {
          skeleton = obj.skeleton;  // save skeleton for clothes
        }
      });
      scene.add(avatar);

      // Play animations if exist
      if (gltf.animations && gltf.animations.length > 0) {
        mixer = new THREE.AnimationMixer(avatar);
        gltf.animations.forEach((clip) => {
          let action = mixer.clipAction(clip);
          action.play();
        });
      }

      // ✅ Check URL for product
      const urlParams = new URLSearchParams(window.location.search);
      const productPath = urlParams.get("product");
      const category = urlParams.get("category");

      if (productPath && category) {
        wearClothing(productPath, category);
      }
    });

    window.addEventListener("resize", onWindowResize);
  }

  // ✅ Attach clothing to avatar skeleton
  function wearClothing(filePath, category) {
    if (clothingItems[category]) {
      scene.remove(clothingItems[category]);
      clothingItems[category] = null;
    }

    loader.load(filePath, (gltf) => {
      const clothing = gltf.scene;

      clothing.traverse((obj) => {
        if (obj.isSkinnedMesh && skeleton) {
          obj.bind(skeleton, obj.bindMatrix); // sync with avatar skeleton
        }
      });

      scene.add(Clothing);
      clothingItems[category] = Clothing;
    });
  }

  function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  function animate() {
    requestAnimationFrame(animate);
    const delta = clock.getDelta();
    if (mixer) mixer.update(delta);
    renderer.render(scene, camera);
  }
</script>
