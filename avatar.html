<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Avatar Clothing Customization</title>
  <style>
    body { margin: 0; overflow: hidden; background: #111; }
    canvas { display: block; }
    #ui {
      position: absolute;
      top: 10px; left: 10px;
      background: rgba(0,0,0,0.6);
      padding: 10px;
      border-radius: 8px;
      color: white;
    }
    button { margin: 5px; padding: 6px 12px; cursor: pointer; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js",
        "three/examples/": "https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="ui">
    <button id="shirtBtn">👕 Wear Shirt</button>
    <button id="pantsBtn">👖 Wear Pants</button>
  </div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/examples/controls/OrbitControls.js";
    import { GLTFLoader } from "three/examples/loaders/GLTFLoader.js";

    // Scene setup
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x202020);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.6, 3);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Lights
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
    hemiLight.position.set(0, 20, 0);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1);
    dirLight.position.set(5, 10, 7.5);
    scene.add(dirLight);

    // Controls
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.4, 0);
    controls.update();

    // Loaders
    const loader = new GLTFLoader();

    let avatar, skeleton;
    let clothes = [];

    // Load base avatar
    loader.load("./baseAvatar.glb", (gltf) => {
      avatar = gltf.scene;
      avatar.position.set(0, 0, 0);
      avatar.scale.set(1, 1, 1);
      scene.add(avatar);

      // Get skeleton
      avatar.traverse((obj) => {
        if (obj.isSkinnedMesh) {
          skeleton = obj.skeleton;
        }
      });

      console.log("✅ Avatar loaded with skeleton", skeleton);
    });

    // Function to wear clothes
    function wearClothing(path) {
      loader.load(path, (gltf) => {
        const clothing = gltf.scene;
        clothing.scale.set(1, 1, 1);

        // Bind clothing to avatar skeleton
        clothing.traverse((obj) => {
          if (obj.isSkinnedMesh && skeleton) {
            obj.skeleton = skeleton;
          }
        });

        scene.add(clothing);
        clothes.push(clothing);
        console.log("👕 Clothing added:", path);
      });
    }

    // UI buttons
    document.getElementById("shirtBtn").addEventListener("click", () => {
      wearClothing("./imgs/short.glb"); // replace with your shirt model
    });

    document.getElementById("pantsBtn").addEventListener("click", () => {
      wearClothing("./pants.glb"); // replace with your pants model
    });

    // Handle resize
    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Animation loop
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
