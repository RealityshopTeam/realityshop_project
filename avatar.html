<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reality Shop – Avatar Try-On</title>

  <!-- Three.js Importmap -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/examples/jsm/loaders/GLTFLoader.js": "https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js",
        "three/examples/jsm/controls/OrbitControls.js": "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js"
      }
    }
  </script>

  <style>
    body {
      margin: 0;
      background: #0f172a;
      color: #e2e8f0;
      font-family: 'Poppins', sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    h1 {
      text-align: center;
      color: #06b4d4;
      margin: 12px 0;
      font-weight: 700;
    }
    #avatarCanvas { flex: 1; display: block; }
    #ui-panel {
      background: #1e293b;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    #selfieInput {
      background: #06b4d4;
      color: white;
      padding: 8px 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    #productName {
      color: #fff;
      font-size: 1.1rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <h1>Reality Shop – Avatar Try-On</h1>

  <div id="ui-panel">
    <input type="file" id="selfieInput" accept="image/*" />
    <span id="productName">Loading selected product...</span>
  </div>

  <canvas id="avatarCanvas"></canvas>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/examples/jsm/loaders/GLTFLoader.js";
    import { OrbitControls } from "three/examples/jsm/controls/OrbitControls.js";

    const canvas = document.getElementById("avatarCanvas");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight - 100);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f172a);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / (window.innerHeight - 100), 0.1, 100);
    camera.position.set(0, 1.6, 3);
    scene.add(camera);

    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
    dirLight.position.set(5, 10, 7.5);
    scene.add(hemiLight, dirLight);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    const loader = new GLTFLoader();
    let avatar, clothing, mixer, animations;

    // === Load Avatar (Animated GLB) ===
    loader.load("imgs/avatar.glb", (gltf) => {
      avatar = gltf.scene;
      avatar.scale.set(1, 1, 1);
      scene.add(avatar);

      if (gltf.animations && gltf.animations.length > 0) {
        mixer = new THREE.AnimationMixer(avatar);
        animations = gltf.animations;
        const action = mixer.clipAction(animations[0]);
        action.play();
      }

      // Load clothing after avatar is ready
      loadSelectedProduct();
    });

    // === Load Selected Product (from localStorage) ===
    function loadSelectedProduct() {
      const stored = localStorage.getItem("selectedClothing");
      const productNameElem = document.getElementById("productName");

      if (!stored) {
        productNameElem.textContent = "No product selected.";
        return;
      }

      const product = JSON.parse(stored);
      productNameElem.textContent = `Wearing: ${product.name}`;

      if (product.glb) {
        loader.load(
          product.glb,
          (gltf) => {
            clothing = gltf.scene;
            scene.add(clothing);

            fitClothingToAvatar(avatar, clothing);
          },
          undefined,
          (err) => console.error("Error loading clothing:", err)
        );
      } else {
        productNameElem.textContent += " (No 3D model available)";
      }
    }

    // === Auto Fit Clothing to Avatar ===
    function fitClothingToAvatar(avatar, clothing) {
      if (!avatar || !clothing) return;
      const avatarBox = new THREE.Box3().setFromObject(avatar);
      const clothBox = new THREE.Box3().setFromObject(clothing);

      const avatarSize = new THREE.Vector3();
      const clothSize = new THREE.Vector3();
      avatarBox.getSize(avatarSize);
      clothBox.getSize(clothSize);

      const scaleFactor = avatarSize.y / clothSize.y;
      clothing.scale.multiplyScalar(scaleFactor * 0.95);

      const avatarCenter = avatarBox.getCenter(new THREE.Vector3());
      const clothCenter = clothBox.getCenter(new THREE.Vector3());
      clothing.position.sub(clothCenter).add(avatarCenter);
      clothing.position.y += 0.02 * avatarSize.y;
    }

    // === Match Skin & Hair Color from Selfie ===
    document.getElementById("selfieInput").addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const img = new Image();
      img.src = URL.createObjectURL(file);
      await img.decode();

      const tempCanvas = document.createElement("canvas");
      const ctx = tempCanvas.getContext("2d");
      tempCanvas.width = 64;
      tempCanvas.height = 64;
      ctx.drawImage(img, 0, 0, 64, 64);
      const data = ctx.getImageData(0, 0, 64, 64).data;

      let r = 0, g = 0, b = 0, count = 0;
      for (let i = 0; i < data.length; i += 4) {
        r += data[i];
        g += data[i + 1];
        b += data[i + 2];
        count++;
      }

      const avgColor = new THREE.Color(r / count / 255, g / count / 255, b / count / 255);

      if (avatar) {
        avatar.traverse((child) => {
          if (child.isMesh) {
            const name = child.name.toLowerCase();
            if (name.includes("skin")) {
              child.material.color.copy(avgColor);
            } else if (name.includes("hair")) {
              const darker = avgColor.clone().multiplyScalar(0.5);
              child.material.color.copy(darker);
            }
          }
        });
      }
    });

    // === Resize & Animate ===
    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / (window.innerHeight - 100);
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight - 100);
    });

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      if (mixer) mixer.update(clock.getDelta());
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
