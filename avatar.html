<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Avatar Try-On - Reality Shop</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css">
  <style>
    body { margin:0; overflow:hidden; background:#121212; color:white; }
    #canvas-container { width:100%; height:100vh; display:block; }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js",
        "three/examples/": "https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/examples/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/examples/controls/OrbitControls.js';

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x121212);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.set(0,1.6,2);

    const renderer = new THREE.WebGLRenderer({ antialias:true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0,1,0);
    controls.update();

    // Lights
    const hemiLight = new THREE.HemisphereLight(0xffffff,0x444444,1.2);
    hemiLight.position.set(0,2,0);
    scene.add(hemiLight);
    const dirLight = new THREE.DirectionalLight(0xffffff,1);
    dirLight.position.set(0,2,2);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // Floor
    const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(10,10),
        new THREE.ShadowMaterial({opacity:0.3})
    );
    floor.rotation.x=-Math.PI/2;
    floor.position.y=0;
    floor.receiveShadow=true;
    scene.add(floor);

    const loader = new GLTFLoader();
    let avatar, avatarSkeleton;

    // Load base avatar model
    async function loadAvatar() {
      return new Promise((resolve, reject)=> {
        loader.load('baseAvatar.glb', gltf => {
          avatar = gltf.scene;
          avatar.traverse(obj => {
            if(obj.isMesh) {obj.castShadow = true; obj.receiveShadow = true;}
          });
          scene.add(avatar);

          // Build skeleton map from avatar
          avatarSkeleton = {};
          avatar.traverse(obj => {
            if(obj.isBone) avatarSkeleton[obj.name] = obj;
          });
          resolve();
        }, undefined, err => reject(err));
      });
    }

    // Retarget clothing skeleton to match avatar
    function retargetClothingSkeleton(clothing, avatarSkeleton) {
      clothing.traverse(obj => {
        if(obj.isSkinnedMesh && obj.skeleton) {
          // For every bone in clothing skeleton, swap with avatar bone if name matches
          obj.skeleton.bones.forEach((bone, idx)=>{
            if(avatarSkeleton[bone.name]) {
              obj.skeleton.bones[idx] = avatarSkeleton[bone.name];
            }
          });
          obj.bind(new THREE.Skeleton(Object.values(avatarSkeleton)), obj.bindMatrix);
        }
      });
    }

    // Attach clothing
    async function loadClothing(clothingUrl) {
      loader.load(clothingUrl, gltf => {
        const clothing = gltf.scene;
        clothing.traverse(obj => {
          if(obj.isMesh || obj.isSkinnedMesh) obj.castShadow = true;
        });
        // Try to retarget clothing to the avatar's skeleton
        retargetClothingSkeleton(clothing, avatarSkeleton);

        // Add to avatar (so it follows all animations/poses)
        avatar.add(clothing);
      }, undefined, err => console.error(err));
    }

    async function init() {
      await loadAvatar();
      // EXAMPLE: load a clothing glb, update the link for your test clothing!
      await loadClothing('shirt.glb'); // <-- replace with actual clothing file name
    }
    init();

    window.addEventListener('resize', ()=>{
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
