<script type="module">
  import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.156.1/build/three.module.js';
  import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.156.1/examples/jsm/loaders/GLTFLoader.js';
  import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.156.1/examples/jsm/controls/OrbitControls.js';

  // Your Three.js code goes here
  let scene, camera, renderer, controls;
  let avatar, clothes, hair, accessory;
  let autoRotate = true;

  const BASE_AVATAR = './baseAvatar.glb';
  const CLOTHES = {
    none: null,
    tshirt: './models/clothes_tshirt.glb',
    jacket: './models/clothes_jacket.glb'
  };
  const HAIR = {
    none: null,
    short: './models/hair_short.glb',
    long: './models/hair_long.glb',
    curly: './models/hair_curly.glb'
  };
  const ACCESSORIES = {
    none: null,
    glasses: './models/glasses.glb',
    hat: './models/hat.glb'
  };

  init();
  loadAvatar(BASE_AVATAR);

  function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf0f0f0);

    camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.6, 2.5);

    renderer = new THREE.WebGLRenderer({antialias: true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.8);
    hemiLight.position.set(0, 20, 0);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1);
    dirLight.position.set(5, 10, 5);
    dirLight.castShadow = true;
    scene.add(dirLight);

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(20, 20),
      new THREE.MeshStandardMaterial({color: 0xe6e6e6})
    );
    ground.rotation.x = -Math.PI/2;
    ground.receiveShadow = true;
    scene.add(ground);

    controls = new OrbitControls(camera, renderer.domElement);
    controls.enablePan = false;
    controls.target.set(0, 1, 0);

    window.addEventListener('resize', onWindowResize);
    animate();
  }

  function loadAvatar(url) {
    new GLTFLoader().load(url, gltf => {
      if (avatar) scene.remove(avatar);
      avatar = gltf.scene;
      avatar.traverse(c=>{ if(c.isMesh){ c.castShadow=true; c.receiveShadow=true; } });
      avatar.position.set(0, 0, 0);
      avatar.scale.set(1.3, 1.3, 1.3);
      scene.add(avatar);
    });
  }

  function animate() {
    requestAnimationFrame(animate);
    if (avatar && autoRotate) avatar.rotation.y += 0.003;
    controls.update();
    renderer.render(scene, camera);
  }

  function onWindowResize() {
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }
</script>
