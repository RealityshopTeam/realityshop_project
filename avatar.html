<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reality Shop - Avatar Customization</title>
  <style>
    body { margin: 0; overflow: hidden; background: #121212; }
    #controls {
      position: absolute; top: 20px; left: 20px;
      z-index: 10; display: flex; gap: 10px;
    }
    button {
      padding: 10px 15px; border: none; border-radius: 6px;
      background: #00b894; color: white; font-weight: bold; cursor: pointer;
    }
    button:hover { background: #019875; }
  </style>
</head>
<body>
  <div id="controls">
    <button onclick="changeProduct('tshirt')">T-Shirt</button>
  </div>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js";
    import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/controls/OrbitControls.js";
    import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/loaders/GLTFLoader.js";

    let scene, camera, renderer, controls, avatar, avatarSkeleton;
    const loader = new GLTFLoader();

    init();
    loadAvatar();

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x121212);

      camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 1.6, 3);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      const light = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
      scene.add(light);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 1.4, 0);
      controls.update();

      window.addEventListener("resize", onWindowResize);
      animate();
    }

    function loadAvatar() {
      loader.load("imgs/baseAvatar.glb", (gltf) => {
        avatar = gltf.scene;
        avatar.scale.set(1, 1, 1);
        avatar.position.set(0, 0, 0);

        // find skeleton
        avatar.traverse((child) => {
          if (child.isSkinnedMesh) {
            avatarSkeleton = child.skeleton;
          }
        });

        scene.add(avatar);
      });
    }

    function changeProduct(type) {
      if (!avatar) {
        alert("Avatar not loaded yet!");
        return;
      }

      if (type === "tshirt") {
        loader.load("imgs/Tshort.jpg", (gltf) => {
          const tshirt = gltf.scene;
          tshirt.scale.set(1, 1, 1);

          // try to attach to avatar chest or spine
          let chest = avatar.getObjectByName("Spine") || avatar.getObjectByName("Chest") || avatar;
          chest.add(tshirt);

          // adjust placement if needed
          tshirt.position.set(0, 0, 0);
          tshirt.rotation.set(0, 0, 0);
        });
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
