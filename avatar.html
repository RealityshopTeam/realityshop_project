<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Avatar Try-On - Reality Shop</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js",
    "three/examples/": "https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';

let scene, camera, renderer, controls;
let avatar, clothing;
let spineBone, hipsBone, headBone, leftFootBone, rightFootBone;

init();
loadAvatar();
loadClothing();

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x121212);

  camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
  camera.position.set(0, 1.6, 3);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 1.6, 0);
  controls.update();

  const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
  hemiLight.position.set(0, 20, 0);
  scene.add(hemiLight);

  const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
  dirLight.position.set(-3, 10, -10);
  scene.add(dirLight);

  window.addEventListener('resize', onWindowResize);
  animate();
}

function onWindowResize() {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}

// Load avatar
function loadAvatar() {
  const loader = new GLTFLoader();
  loader.load('baseAvatar.glb', gltf => {
    avatar = gltf.scene;
    avatar.scale.set(1,1,1);
    scene.add(avatar);

    avatar.traverse(obj => {
      if(obj.isBone) {
        const name = obj.name.toLowerCase();
        if(name.includes('spine')) spineBone = obj;
        else if(name.includes('hips')) hipsBone = obj;
        else if(name.includes('head')) headBone = obj;
        else if(name.includes('foot_l')) leftFootBone = obj;
        else if(name.includes('foot_r')) rightFootBone = obj;
      }
    });
  });
}

// Load clothing
function loadClothing() {
  const selected = JSON.parse(localStorage.getItem("selectedClothing") || '{}');
  if(!selected.glb) return;

  const loader = new GLTFLoader();
  loader.load(selected.glb, gltf => {
    clothing = gltf.scene;

    // Determine attachment
    const cat = selected.category.toLowerCase();
    if(cat === 'clothing') {
      if(selected.name.toLowerCase().includes('shirt') || selected.name.toLowerCase().includes('t-shirt') || selected.name.toLowerCase().includes('crop')) {
        if(spineBone) attachClothing(clothing, spineBone, {yOffset:0});
      } else if(selected.name.toLowerCase().includes('pants') || selected.name.toLowerCase().includes('jeans')) {
        if(hipsBone) attachClothing(clothing, hipsBone, {yOffset:0});
      }
    } else if(cat === 'shoes') {
      if(leftFootBone && rightFootBone) {
        const leftShoe = clothing.clone();
        const rightShoe = clothing.clone();
        attachClothing(leftShoe, leftFootBone, {yOffset:0});
        attachClothing(rightShoe, rightFootBone, {yOffset:0});
      }
      return;
    } else if(cat === 'accessories') {
      if(headBone) attachClothing(clothing, headBone, {yOffset:0});
    }
  });
}

// Attach clothing to bone with scaling
function attachClothing(cloth, bone, options={}) {
  bone.add(cloth);
  cloth.position.set(0, options.yOffset || 0, 0);
  cloth.rotation.set(0,0,0);

  // Auto-scale to avatar
  const box = new THREE.Box3().setFromObject(cloth);
  const size = new THREE.Vector3();
  box.getSize(size);

  const heightScale = 1 / size.y;
  const widthScale = 0.5 / size.x;
  const depthScale = 0.5 / size.z;

  const scaleFactor = Math.min(heightScale, widthScale, depthScale);
  cloth.scale.setScalar(scaleFactor);
}
</script>
<style>
body { margin:0; overflow:hidden; }
</style>
</head>
<body></body>
</html>
