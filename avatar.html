<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Avatar Customization - Reality Shop</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { margin:0; overflow:hidden; background:#121212; }
    #info { position:absolute; top:10px; left:10px; color:white; z-index:10; font-family:sans-serif; }
  </style>

  <!-- Import map for three.js -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js",
      "three/examples/": "https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="info">Avatar Customization</div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/examples/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/examples/controls/OrbitControls.js';

    let scene, camera, renderer, controls, avatar, skeleton;
    let clothes = [];

    // Scene setup
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x121212);

    camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.set(0,1.6,3);

    renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0,1.5,0);
    controls.update();

    const light = new THREE.HemisphereLight(0xffffff,0x444444);
    light.position.set(0,20,0);
    scene.add(light);

    const dirLight = new THREE.DirectionalLight(0xffffff);
    dirLight.position.set(3,10,10);
    scene.add(dirLight);

    // Load avatar
    const loader = new GLTFLoader();
    loader.load('./baseAvatar.glb', (gltf)=>{
      avatar = gltf.scene;
      avatar.scale.set(1,1,1);
      avatar.position.set(0,0,0);
      scene.add(avatar);

      avatar.traverse((obj)=>{
        if(obj.isSkinnedMesh){
          skeleton = obj.skeleton;
        }
      });

      // After avatar loaded, load clothing from product.html
      applySelectedClothing();
    });

    // Apply clothing from localStorage (selectedClothing)
    function applySelectedClothing(){
      const selected = JSON.parse(localStorage.getItem('selectedClothing') || 'null');
      if(!selected || !selected.glb) return;

      // Determine clothing type by category
      let type = selected.category.toLowerCase(); // "clothing", "shoes", etc.
      let offsetY = 0;

      if(type === "clothing") offsetY = 1.3; // shirts
      else if(type === "pants") offsetY = 0.7;
      else if(type === "shoes") offsetY = 0.05;
      else if(type === "accessories") offsetY = 1.5;

      loader.load(selected.glb, (gltf)=>{
        const clothing = gltf.scene;
        clothing.scale.set(1,1,1);
        clothing.position.set(0, offsetY, 0);
        clothing.rotation.set(0,0,0);

        clothing.traverse((obj)=>{
          if(obj.isSkinnedMesh && skeleton){
            obj.skeleton = skeleton;
          }
        });

        scene.add(clothing);
        clothes.push(clothing);
      });
    }

    // Render loop
    function animate(){
      requestAnimationFrame(animate);
      renderer.render(scene,camera);
    }
    animate();

    window.addEventListener('resize', ()=>{
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
