<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reality Shop - Avatar Try-On</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { margin:0; background:#121212; color:white; font-family:sans-serif; }
    #canvas-container { width:100%; height:90vh; display:block; }
    #ui { height:10vh; background:#1e1e1e; display:flex; align-items:center; justify-content:center; gap:1rem; }
    select, button { padding:0.5rem; border-radius:5px; border:none; }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="ui">
    <label for="clothingSelect">Choose Clothing:</label>
    <select id="clothingSelect"></select>
    <button id="applyBtn">Apply</button>
  </div>

  <!-- Import Maps -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js",
      "three/examples/": "https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/"
    }
  }
  </script>

  <script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/examples/loaders/GLTFLoader.js';
  import { OrbitControls } from 'three/examples/controls/OrbitControls.js';
  import { SkeletonUtils } from 'three/examples/utils/SkeletonUtils.js';

  const container = document.getElementById('canvas-container');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x121212);

  const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
  camera.position.set(0,1.6,2);

  const renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  container.appendChild(renderer.domElement);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0,1,0);
  controls.update();

  // Lights
  const hemiLight = new THREE.HemisphereLight(0xffffff,0x444444,1.2);
  hemiLight.position.set(0,2,0);
  scene.add(hemiLight);

  const dirLight = new THREE.DirectionalLight(0xffffff,1);
  dirLight.position.set(0,2,2);
  dirLight.castShadow = true;
  scene.add(dirLight);

  // Floor
  const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(10,10),
      new THREE.ShadowMaterial({opacity:0.3})
  );
  floor.rotation.x=-Math.PI/2;
  floor.position.y=0;
  floor.receiveShadow=true;
  scene.add(floor);

  // Loaders
  const loader = new GLTFLoader();
  let avatar, mixer, clock = new THREE.Clock();
  let currentClothing;

  // Load Avatar
  async function loadAvatar() {
    return new Promise((resolve, reject)=>{
      loader.load('imgs/avatar.glb', gltf=>{
        avatar = gltf.scene;
        avatar.traverse(c=>{ if(c.isMesh){ c.castShadow=true; c.frustumCulled=false; } });
        scene.add(avatar);

        // Setup animations
        if(gltf.animations && gltf.animations.length>0){
          mixer = new THREE.AnimationMixer(avatar);
          mixer.clipAction(gltf.animations[0]).play();
        }

        resolve();
      }, undefined, err=>reject(err));
    });
  }

  // Load product list from product.html
  async function loadProducts() {
    const res = await fetch("product.html");
    const text = await res.text();
    const parser = new DOMParser();
    const doc = parser.parseFromString(text, "text/html");

    // Example: expects <div class="product" data-glb="shirt.glb">Shirt</div>
    const products = [...doc.querySelectorAll(".product")].map(el=>({
      name: el.textContent.trim(),
      glb: el.dataset.glb
    }));

    const select = document.getElementById("clothingSelect");
    products.forEach(p=>{
      const opt = document.createElement("option");
      opt.value = p.glb;
      opt.textContent = p.name;
      select.appendChild(opt);
    });
  }

  // Attach clothing to avatar skeleton
  function attachClothingToAvatar(clothing) {
    if(!avatar) return;

    clothing.traverse(c=>{
      if(c.isSkinnedMesh){
        // Retarget clothing to avatar skeleton
        c.skeleton = SkeletonUtils.clone(avatar).children[0].skeleton;
      }
    });

    avatar.add(clothing);
    clothing.position.set(0,0,0);
    clothing.scale.set(1,1,1);
  }

  // Load clothing
  async function loadClothing(glbPath) {
    if(currentClothing) {
      avatar.remove(currentClothing);
      currentClothing = null;
    }

    return new Promise((resolve, reject)=>{
      loader.load(glbPath, gltf=>{
        currentClothing = gltf.scene;
        currentClothing.traverse(c=>{ if(c.isMesh) c.castShadow=true; });
        attachClothingToAvatar(currentClothing);
        resolve();
      }, undefined, err=>reject(err));
    });
  }

  // UI events
  document.getElementById("applyBtn").addEventListener("click", async ()=>{
    const selected = document.getElementById("clothingSelect").value;
    if(selected) await loadClothing(selected);
  });

  // Init
  async function init(){
    await loadAvatar();
    await loadProducts();
  }
  init();

  // Resize
  window.addEventListener('resize', ()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // Animate
  function animate(){
    requestAnimationFrame(animate);
    const delta = clock.getDelta();
    if(mixer) mixer.update(delta);
    renderer.render(scene, camera);
  }
  animate();

  </script>
</body>
</html>
