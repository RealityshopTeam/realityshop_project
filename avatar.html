<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Reality Shop — Advanced Avatar Try-On</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  :root{--panel-bg:#0f1724;--panel-fg:#e6eef8}
  body{margin:0;height:100vh;background:#0b1220;color:var(--panel-fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial}
  #canvas-wrap{position:fixed;inset:0}
  #ui{position:fixed;left:12px;top:12px;width:340px;background:linear-gradient(180deg,#0b1220,#07101a);border-radius:12px;padding:12px;box-shadow:0 8px 30px rgba(2,6,23,.6);z-index:10}
  #ui h3{margin:0 0 8px;font-size:16px;color:#9be7ff}
  .row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
  label{font-size:13px;color:#bcdcff}
  select,input[type=color]{width:100%;padding:6px;border-radius:8px;border:1px solid rgba(255,255,255,.06);background:transparent;color:var(--panel-fg)}
  button{background:#06b4d4;color:#06202a;border:0;padding:8px 10px;border-radius:8px;cursor:pointer;font-weight:600}
  button.secondary{background:transparent;border:1px solid rgba(255,255,255,.06);color:var(--panel-fg)}
  small.hint{display:block;color:#7aa8bf;margin-top:6px;font-size:12px}
  .slot-list{display:flex;gap:8px;flex-wrap:wrap}
  .slot{padding:6px 8px;border-radius:8px;background:rgba(255,255,255,.03);font-size:13px}
  footer.note{position:fixed;right:12px;bottom:12px;font-size:13px;color:#9fbfce}
</style>
</head>
<body>
<div id="ui" aria-hidden="false">
  <h3>Avatar Try-On — Controls</h3>

  <div class="row">
    <label style="flex:1">Avatar</label>
    <select id="avatarSelect">
      <option value="baseAvatar.glb">baseAvatar.glb (default)</option>
    </select>
  </div>

  <div class="row">
    <label style="flex:1">Auto-rotate</label>
    <input id="autoRotate" type="checkbox" checked />
  </div>

  <div class="row">
    <label style="flex:1">Clothing tint</label>
    <input id="tint" type="color" value="#ffffff" />
  </div>

  <div class="row">
    <label style="flex:1">Animations</label>
    <select id="animSelect">
      <option value="Idle">Idle</option>
      <option value="Walk">Walk</option>
      <option value="Wave">Wave</option>
    </select>
  </div>

  <div style="margin-top:6px">
    <div style="display:flex;gap:8px">
      <button id="screenshotBtn">Download PNG</button>
      <button id="resetBtn" class="secondary">Reset Scene</button>
    </div>
    <small class="hint">Selected products come from <code>localStorage.selectedClothing</code>. Use products.html TryOn to set it.</small>
  </div>

  <hr style="opacity:.06;margin:10px 0">
  <div>
    <label>Worn items</label>
    <div id="slots" class="slot-list" aria-live="polite"></div>
  </div>
</div>

<div id="canvas-wrap"></div>
<footer class="note">Reality Shop — Client-only demo</footer>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js",
    "three/examples/": "https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/examples/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/examples/controls/OrbitControls.js';

const ui = {
  avatarSelect: document.getElementById('avatarSelect'),
  autoRotate: document.getElementById('autoRotate'),
  tint: document.getElementById('tint'),
  animSelect: document.getElementById('animSelect'),
  screenshotBtn: document.getElementById('screenshotBtn'),
  resetBtn: document.getElementById('resetBtn'),
  slots: document.getElementById('slots')
};

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0c1720);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.05, 200);
camera.position.set(0, 1.6, 3.2);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
document.getElementById('canvas-wrap').appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0,1.2,0);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xffffff, 0x222233, 0.9));
const dir = new THREE.DirectionalLight(0xffffff, 1.0);
dir.position.set(3, 10, 5);
scene.add(dir);

const loader = new GLTFLoader();
let avatar, avatarSkel, mixer, actions = {}, activeAction;

// --- Load Avatar ---
async function loadAvatar(url) {
  return new Promise((resolve,reject)=>{
    loader.load(url, gltf=>{
      if(avatar) scene.remove(avatar);
      avatar = gltf.scene;
      scene.add(avatar);

      // skeleton
      avatarSkel = null;
      avatar.traverse(o=>{ if(o.isSkinnedMesh && o.skeleton) avatarSkel = o.skeleton; });

      // animations
      mixer = new THREE.AnimationMixer(avatar);
      actions = {};
      gltf.animations.forEach(clip=>{
        actions[clip.name] = mixer.clipAction(clip);
      });
      playAnim("Idle");
      resolve();
    },undefined,reject);
  });
}

// --- Play Animations ---
function playAnim(name) {
  if(!actions[name]) return;
  if(activeAction) activeAction.fadeOut(0.3);
  activeAction = actions[name];
  activeAction.reset().fadeIn(0.3).play();
}

// --- Load Clothing ---
async function loadClothing(item) {
  return new Promise((resolve,reject)=>{
    loader.load(item.glb,gltf=>{
      const clothing = gltf.scene;
      let bound = false;

      clothing.traverse(o=>{
        if(o.isSkinnedMesh && avatarSkel) {
          try{ o.bind(avatarSkel); bound=true; }catch(e){}
        }
      });

      if(!bound) {
        // simple auto-fit to torso height
        const box = new THREE.Box3().setFromObject(clothing);
        const size = box.getSize(new THREE.Vector3());
        const scale = 1.2 / size.y;
        clothing.scale.setScalar(scale);
        clothing.position.y = 1.0; // move near chest
      }

      avatar.add(clothing);
      resolve();
    },undefined,reject);
  });
}

// --- Scene Loader ---
async function loadScene() {
  await loadAvatar(ui.avatarSelect.value);
  const selected = JSON.parse(localStorage.getItem("selectedClothing")||"null");
  if(selected) await loadClothing(selected);
}

// --- UI Events ---
ui.animSelect.addEventListener("change",()=>playAnim(ui.animSelect.value));
ui.screenshotBtn.addEventListener("click",()=>{
  renderer.domElement.toBlob(b=>{
    const a=document.createElement("a");
    a.href=URL.createObjectURL(b);
    a.download="avatar.png";a.click();
  });
});
ui.resetBtn.addEventListener("click",()=>{
  localStorage.removeItem("selectedClothing");
  loadScene();
});

// --- Init ---
async function init() {
  await loadScene();
  animate();
}
init();

// --- Loop ---
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=clock.getDelta();
  if(mixer) mixer.update(dt);
  if(ui.autoRotate.checked && avatar) avatar.rotation.y += dt*0.3;
  controls.update();
  renderer.render(scene,camera);
}
</script>
</body>
</html>
