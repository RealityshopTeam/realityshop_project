<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Avatar Try-On - Reality Shop</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  body { margin:0; overflow:hidden; background:#121212; color:white; }
  #canvas-container { width:100%; height:100vh; display:block; }
</style>
</head>
<body>
<div id="canvas-container"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js",
    "three/examples/": "https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/examples/loaders/GLTFLoader.js';   // ❌ wrong
// ✅ fix import (match importmap!)
import { GLTFLoader as Loader } from 'three/examples/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/examples/controls/OrbitControls.js';

const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x121212);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0,1.6,2);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0,1,0);
controls.update();

// Lights
scene.add(new THREE.HemisphereLight(0xffffff,0x444444,1.2));
const dirLight = new THREE.DirectionalLight(0xffffff,1);
dirLight.position.set(0,2,2);
dirLight.castShadow = true;
scene.add(dirLight);

// Floor
const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(10,10),
    new THREE.ShadowMaterial({opacity:0.3})
);
floor.rotation.x=-Math.PI/2;
floor.receiveShadow=true;
scene.add(floor);

const loader = new Loader();
let avatar, avatarSkeleton, avatarBox;

// --- Load avatar ---
async function loadAvatar() {
    return new Promise((resolve, reject)=>{
        loader.load('baseAvatar.glb', gltf=>{
            avatar = gltf.scene;
            avatar.traverse(c=>{
                if(c.isMesh){ c.castShadow=true; c.receiveShadow=true; }
                if(c.isSkinnedMesh && c.skeleton) avatarSkeleton = c.skeleton;
            });
            scene.add(avatar);

            // bounding box for fallback
            avatarBox = new THREE.Box3().setFromObject(avatar);

            resolve();
        }, undefined, err=>reject(err));
    });
}

// --- Load clothing and fit ---
async function loadClothing() {
    const selected = JSON.parse(localStorage.getItem("selectedClothing") || null);
    if(!selected || !selected.glb) return;

    loader.load(selected.glb, gltf=>{
        const clothing = gltf.scene;

        let boundToSkeleton = false;
        clothing.traverse(c=>{
            if(c.isSkinnedMesh && avatarSkeleton){
                try {
                    c.bind(avatarSkeleton);  // Attach clothing to avatar bones
                    boundToSkeleton = true;
                } catch(e){
                    console.warn("⚠️ Skeleton binding failed, fallback to positioning", e);
                }
            }
        });

        if(!boundToSkeleton){
            // --- Fallback: scale + align ---
            const avatarSize = avatarBox.getSize(new THREE.Vector3());
            const avatarCenter = avatarBox.getCenter(new THREE.Vector3());

            const clothingBox = new THREE.Box3().setFromObject(clothing);
            const clothingSize = clothingBox.getSize(new THREE.Vector3());
            const clothingCenter = clothingBox.getCenter(new THREE.Vector3());

            // scale clothing height to ~ upper body height
            const targetHeight = avatarSize.y * 0.45; // torso ~45%
            const scale = targetHeight / clothingSize.y;
            clothing.scale.setScalar(scale);

            // move clothing to chest level
            clothing.position.sub(clothingCenter); // center clothing
            clothing.position.add(new THREE.Vector3(0, avatarCenter.y + avatarSize.y*0.2, 0));
        }

        scene.add(clothing);
        console.log("✅ Clothing loaded:", selected.name, "Bound:", boundToSkeleton);
    }, undefined, err=>console.error(err));
}

// --- Init ---
async function init() {
    await loadAvatar();
    await loadClothing();
}
init();

window.addEventListener('resize', ()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
