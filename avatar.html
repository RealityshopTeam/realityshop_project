<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Avatar Try-On - Reality Shop</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { margin:0; overflow:hidden; background:#121212; color:white; }
    #canvas-container { width:100%; height:100vh; display:block; }
  </style>
</head>
<body>
<div id="canvas-container"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js",
    "three/examples/": "https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/examples/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/examples/controls/OrbitControls.js';

const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x121212);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0,1.6,3);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0,1.2,0);
controls.update();

const hemiLight = new THREE.HemisphereLight(0xffffff,0x444444,1.2);
hemiLight.position.set(0,2,0);
scene.add(hemiLight);

const dirLight = new THREE.DirectionalLight(0xffffff,1);
dirLight.position.set(3,6,5);
dirLight.castShadow = true;
scene.add(dirLight);

const loader = new GLTFLoader();
let avatar, skeleton;

// --- Load Avatar ---
async function loadAvatar() {
  return new Promise((resolve, reject)=>{
    loader.load('baseAvatar.glb', (gltf)=>{
      avatar = gltf.scene;
      avatar.traverse(c=>{
        if(c.isMesh){ c.castShadow=true; c.frustumCulled=false; }
      });
      scene.add(avatar);

      // find skeleton (if skinned mesh exists)
      avatar.traverse(obj=>{
        if(obj.isSkinnedMesh){
          skeleton = obj.skeleton;
        }
      });

      console.log("✅ Avatar loaded");
      resolve();
    }, undefined, err=>reject(err));
  });
}

// --- Load Clothing from products.html selection ---
async function loadClothing() {
  const selected = JSON.parse(localStorage.getItem("selectedClothing") || "null");
  if(!selected || !selected.glb) {
    console.warn("⚠️ No clothing selected in products.html");
    return;
  }

  loader.load(selected.glb, (gltf)=>{
    const clothing = gltf.scene;

    if(skeleton) {
      // if avatar has skeleton and clothing is skinned
      clothing.traverse(c=>{
        if(c.isSkinnedMesh){
          c.skeleton = skeleton;
          c.bind(skeleton);
        }
      });
    } else {
      // fallback → scale and position with bounding boxes
      const avatarBox = new THREE.Box3().setFromObject(avatar);
      const clothingBox = new THREE.Box3().setFromObject(clothing);

      const avatarSize = avatarBox.getSize(new THREE.Vector3());
      const clothingSize = clothingBox.getSize(new THREE.Vector3());

      const scale = avatarSize.y * 0.4 / clothingSize.y;
      clothing.scale.set(scale, scale, scale);

      clothing.position.set(0, avatarBox.min.y + avatarSize.y*0.5, 0);
    }

    scene.add(clothing);
    console.log("👕 Clothing loaded:", selected.name);
  }, undefined, err=>console.error("❌ Clothing load failed", err));
}

// --- Init ---
async function init(){
  await loadAvatar();
  await loadClothing();
}
init();

window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate(){
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
