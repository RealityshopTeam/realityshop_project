<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reality Shop - Avatar Customization</title>
  <style>
    body { margin: 0; overflow: hidden; background: #121212; }
    #controls {
      position: absolute; top: 20px; left: 20px;
      z-index: 10; display: flex; gap: 10px;
    }
    button {
      padding: 10px 15px; border: none; border-radius: 6px;
      background: #00b894; color: white; font-weight: bold; cursor: pointer;
    }
    button:hover { background: #019875; }
  </style>
</head>
<body>
  <div id="controls">
    <button onclick="changeProduct('shirt')">Shirt</button>
    <button onclick="changeProduct('jacket')">Jacket</button>
    <button onclick="changeProduct('shoes')">Shoes</button>
  </div>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js";
    import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/controls/OrbitControls.js";
    import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/loaders/GLTFLoader.js";

    let scene, camera, renderer, controls, avatar;
    let productGroup = new THREE.Group(); // container for current product

    init();
    loadAvatar();

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x121212);

      camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 1.6, 3);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      const light = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
      scene.add(light);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 1.4, 0);
      controls.update();

      scene.add(productGroup);

      window.addEventListener("resize", onWindowResize);
      animate();
    }

    function loadAvatar() {
      const loader = new GLTFLoader();
      // Replace with your avatar model (GLB file)
      loader.load("https://models.readyplayer.me/64f8827a1739b4d902ac6d4f.glb", (gltf) => {
        avatar = gltf.scene;
        avatar.scale.set(1, 1, 1);
        avatar.position.set(0, 0, 0);
        scene.add(avatar);
      });
    }

    function changeProduct(type) {
      const loader = new GLTFLoader();
      productGroup.clear(); // remove previous product

      let url;
      if (type === "shirt") {
        url = "https://cdn.jsdelivr.net/gh/KhronosGroup/glTF-Sample-Models@master/2.0/CesiumMan/glTF-Binary/CesiumMan.glb"; 
      } else if (type === "jacket") {
        url = "https://cdn.jsdelivr.net/gh/KhronosGroup/glTF-Sample-Models@master/2.0/Avocado/glTF-Binary/Avocado.glb"; 
      } else if (type === "shoes") {
        url = "https://cdn.jsdelivr.net/gh/KhronosGroup/glTF-Sample-Models@master/2.0/Duck/glTF-Binary/Duck.glb"; 
      }

      loader.load(url, (gltf) => {
        const product = gltf.scene;
        product.scale.set(0.5, 0.5, 0.5);  // adjust size to fit avatar
        product.position.set(0, 0, 0);     // adjust position to align
        productGroup.add(product);
      });
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
