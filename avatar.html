<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reality Shop - Avatar Customization</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    body { margin: 0; background: #121212; color: white; font-family: Arial, sans-serif; }
    .viewer-container { width: 100%; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    model-viewer { width: 400px; height: 600px; }
    .controls { margin-top: 15px; display: flex; gap: 10px; }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      background: #00b894;
      color: white;
    }
    button:hover { background: #019875; }
  </style>
</head>
<body>
  <div class="viewer-container">
    <!-- Avatar Model -->
    <model-viewer id="avatar" 
      src="baseAvatar.glb" 
      alt="3D Avatar"
      camera-controls 
      auto-rotate
      shadow-intensity="1">
    </model-viewer>

    <!-- Product Customization Controls -->
    <div class="controls">
      <button onclick="changeProduct('shirt')">Shirt</button>
      <button onclick="changeProduct('jacket')">Jacket</button>
      <button onclick="changeProduct('shoes')">Shoes</button>
    </div>
  </div>

  <script>
    const avatar = document.getElementById('avatar');

    // Replace with external clothing/accessory .glb URLs
    const products = {
      shirt: "https://modelviewer.dev/shared-assets/models/shirt.glb",
      jacket: "https://modelviewer.dev/shared-assets/models/jacket.glb",
      shoes: "https://modelviewer.dev/shared-assets/models/shoes.glb"
    };

    function changeProduct(type) {
      avatar.setAttribute("src", products[type]);
    }
  </script>
</body>
</html>
