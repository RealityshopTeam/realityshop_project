<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Avatar Customization - Reality Shop</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js",
      "three/examples/": "https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/"
    }
  }
  </script>
  <style>
    body { margin: 0; background: #121212; overflow: hidden; }
    #canvas-container { width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/examples/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/examples/controls/OrbitControls.js';

    const container = document.getElementById('canvas-container');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x121212);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.6, 3);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0,1.5,0);
    controls.update();

    const light = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
    light.position.set(0, 20, 0);
    scene.add(light);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(5,10,7.5);
    scene.add(dirLight);

    const loader = new GLTFLoader();

    let avatar, clothing;

    // Load base avatar
    loader.load('baseAvatar.glb', (gltf)=>{
      avatar = gltf.scene;
      avatar.scale.set(1,1,1);
      scene.add(avatar);

      // After avatar is loaded, load selected clothing
      const selectedClothing = JSON.parse(localStorage.getItem('selectedClothing'));
      if(selectedClothing && selectedClothing.glb){
        loader.load(selectedClothing.glb, (gltf2)=>{
          clothing = gltf2.scene;

          // Auto-position based on category
          switch(selectedClothing.category.toLowerCase()){
            case 'clothing': 
              clothing.position.set(0,1.4,0); // torso
              clothing.scale.set(1,1,1);
              break;
            case 'shoes': 
              clothing.position.set(0,0,0); // feet
              clothing.scale.set(1,1,1);
              break;
            case 'accessories':
              clothing.position.set(0,1.7,0); // head/neck
              clothing.scale.set(1,1,1);
              break;
            default:
              clothing.position.set(0,1,0);
          }

          avatar.add(clothing);
        }, undefined, console.error);
      }
    }, undefined, console.error);

    // Handle window resize
    window.addEventListener('resize', ()=>{
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate(){
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
