<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Avatar Try-On - Reality Shop</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body { margin: 0; overflow: hidden; background: #121212; }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
import { AnimationMixer } from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x121212);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0,1.6,3);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0,1.5,0);
controls.update();

scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.2));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(0,10,10);
scene.add(dirLight);

const loader = new GLTFLoader();
const clock = new THREE.Clock();

let avatar, avatarSkeleton, mixer;
let clothingMeshes = [];

// --- Load Avatar ---
loader.load('imgs/avatar.glb', gltf => {
  avatar = SkeletonUtils.clone(gltf.scene);
  scene.add(avatar);

  avatar.traverse(obj => {
    if(obj.isSkinnedMesh && !avatarSkeleton) avatarSkeleton = obj.skeleton;
  });

  if(gltf.animations && gltf.animations.length > 0){
    mixer = new AnimationMixer(avatar);
    gltf.animations.forEach(clip => mixer.clipAction(clip).play());
  }

  loadClothing();
});

// --- Load Clothing ---
function loadClothing(){
  const selected = localStorage.getItem("selectedClothing");
  if(!selected) return;
  const product = JSON.parse(selected);
  if(!product.glb) return;

  loader.load(product.glb, gltf => {
    const clothing = SkeletonUtils.clone(gltf.scene);

    clothing.traverse(mesh => {
      if(mesh.isSkinnedMesh){
        // Bind clothing to avatar skeleton
        mesh.skeleton = avatarSkeleton;
        mesh.bind(avatarSkeleton);
        clothingMeshes.push(mesh);

        // Auto-fit clothing
        fitClothingProportionally(mesh, product.category);
      }
    });

    scene.add(clothing);
  });
}

// --- Proportional Clothing Fit ---
function fitClothingProportionally(mesh, category){
  const avatarBox = new THREE.Box3().setFromObject(avatar);
  const avatarHeight = avatarBox.max.y - avatarBox.min.y;

  const clothBox = new THREE.Box3().setFromObject(mesh);
  const clothHeight = clothBox.max.y - clothBox.min.y;

  let scale = avatarHeight / clothHeight;

  // Adjust per category
  switch(category){
    case "Clothing": // Shirts/Jackets
      scale *= 0.95;
      mesh.scale.set(scale, scale, scale);

      // Optional: adjust position to avatar torso
      const avatarMidY = (avatarBox.min.y + avatarBox.max.y*0.55);
      const clothMidY = (clothBox.min.y + clothBox.max.y)/2;
      mesh.position.y += avatarMidY - clothMidY;
      break;

    case "Pants":
      scale *= 0.95;
      mesh.scale.set(scale, scale, scale);

      const avatarLegY = avatarBox.min.y + avatarHeight*0.25;
      const clothLegMidY = (clothBox.min.y + clothBox.max.y)/2;
      mesh.position.y += avatarLegY - clothLegMidY;
      break;

    case "Shoes":
      scale *= 1.0;
      mesh.scale.set(scale, scale, scale);
      mesh.position.y = avatarBox.min.y + 0.02;
      break;

    case "Accessories":
      scale *= 1.0;
      mesh.scale.set(scale, scale, scale);
      mesh.position.y = avatarBox.max.y - 0.05;
      break;
  }
}

// --- Animate ---
function animate(){
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  if(mixer) mixer.update(delta);

  // Keep clothing synced with avatar
  clothingMeshes.forEach(mesh => mesh.skeleton.pose());

  renderer.render(scene, camera);
}
animate();

// --- Resize ---
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
