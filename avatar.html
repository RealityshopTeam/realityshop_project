<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reality Shop - Avatar Customization</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      background: #0a0a0a;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      height: 100vh;
      color: #fff;
      font-family: Poppins, sans-serif;
    }
    #canvas-container {
      width: 100%;
      height: 80vh;
    }
    #ui {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      padding: 10px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(10px);
      position: fixed;
      bottom: 0;
      left: 0;
    }
    input[type=file] {
      background: #111;
      color: #00eaff;
      border: 1px solid #00eaff;
      border-radius: 8px;
      padding: 8px;
      cursor: pointer;
    }
    button {
      background: linear-gradient(135deg, #00eaff, #0066ff);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.3s;
    }
    button:hover {
      background: linear-gradient(135deg, #0077ff, #0044aa);
      transform: translateY(-2px);
    }
  </style>

  <!-- Importmap for Three.js -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js",
      "GLTFLoader": "https://cdn.jsdelivr.net/npm/three@0.166.1/examples/jsm/loaders/GLTFLoader.js",
      "OrbitControls": "https://cdn.jsdelivr.net/npm/three@0.166.1/examples/jsm/controls/OrbitControls.js",
      "AnimationMixer": "three"
    }
  }
  </script>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="ui">
    <input type="file" id="selfieInput" accept="image/*">
    <button id="recolorBtn">Apply Skin & Hair Color</button>
  </div>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "GLTFLoader";
    import { OrbitControls } from "OrbitControls";

    let scene, camera, renderer, avatar, mixer, clock;
    const container = document.getElementById("canvas-container");

    const selectedProduct = JSON.parse(localStorage.getItem("selectedClothing"));
    console.log("Selected Product:", selectedProduct);

    init();
    animate();

    async function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0a0a0a);
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / (window.innerHeight * 0.8), 0.1, 100);
      camera.position.set(0, 1.6, 3);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight * 0.8);
      container.appendChild(renderer.domElement);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 1.5, 0);
      controls.update();

      // Lights
      const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1);
      hemiLight.position.set(0, 20, 0);
      scene.add(hemiLight);
      const dirLight = new THREE.DirectionalLight(0xffffff, 1);
      dirLight.position.set(-3, 10, -10);
      scene.add(dirLight);

      clock = new THREE.Clock();

      // Load avatar base
      const loader = new GLTFLoader();
      loader.load("imgs/avatar.glb", (gltf) => {
        avatar = gltf.scene;
        avatar.scale.set(1.4, 1.4, 1.4);
        avatar.position.set(0, 0, 0);
        scene.add(avatar);

        mixer = new THREE.AnimationMixer(avatar);
        if (gltf.animations && gltf.animations.length > 0) {
          mixer.clipAction(gltf.animations[0]).play();
        }

        if (selectedProduct && selectedProduct.glb) {
          loadClothing(selectedProduct.glb);
        }
      });
    }

    function loadClothing(modelPath) {
      const loader = new GLTFLoader();
      loader.load(modelPath, (gltf) => {
        const clothing = gltf.scene;
        clothing.scale.set(1.4, 1.4, 1.4);
        clothing.position.set(0, 0, 0);

        // Try to auto-fit the clothing on the avatar (approximate)
        clothing.traverse((child) => {
          if (child.isMesh) {
            child.material.side = THREE.DoubleSide;
          }
        });

        avatar.add(clothing);
      });
    }

    // --- Skin & Hair Color from Selfie ---
    document.getElementById("recolorBtn").addEventListener("click", () => {
      const file = document.getElementById("selfieInput").files[0];
      if (!file) {
        alert("Please upload a selfie first!");
        return;
      }

      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        canvas.width = img.width;
        canvas.height = img.height;
        ctx.drawImage(img, 0, 0, img.width, img.height);

        // Average face color approximation
        const imageData = ctx.getImageData(0, 0, img.width, img.height).data;
        let r = 0, g = 0, b = 0, count = 0;
        for (let i = 0; i < imageData.length; i += 4) {
          r += imageData[i];
          g += imageData[i + 1];
          b += imageData[i + 2];
          count++;
        }
        r = Math.floor(r / count);
        g = Math.floor(g / count);
        b = Math.floor(b / count);

        const avgColor = new THREE.Color(`rgb(${r},${g},${b})`);

        avatar.traverse((child) => {
          if (child.isMesh) {
            const name = child.name.toLowerCase();
            if (name.includes("skin") || name.includes("face")) {
              child.material.color = avgColor;
            }
            if (name.includes("hair")) {
              // Slightly darker hair color
              const hairColor = avgColor.clone().offsetHSL(0, 0, -0.3);
              child.material.color = hairColor;
            }
          }
        });
      };
      img.src = URL.createObjectURL(file);
    });

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / (window.innerHeight * 0.8);
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight * 0.8);
    });

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      if (mixer) mixer.update(delta);
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
