      {name:"gas stove",price:3000, glb:"imgs/gas_stove_kitchen.glb", category:"Electronics"},
      {name:"mobile charger",price:550, glb:"imgs/mobile_charger.glb", category:"Electronics"},
    ];

    const productDetails = document.getElementById('product-details');
    const relatedList = document.getElementById('related-list');

    function getQueryParam(param) {
      return new URLSearchParams(window.location.search).get(param);
    }

    function getWishlist() {
      return JSON.parse(localStorage.getItem('wishlist') || '[]');
    }
    function setWishlist(list) {
      localStorage.setItem('wishlist', JSON.stringify(list));
    }
    function isWishlisted(name) {
      return getWishlist().some(item => item.name === name);
    }

    function displayProduct(product) {
      if (!product) {
        productDetails.innerHTML = "<p>Product not found.</p>";
        return;
      }

      const canTryOn = ['Clothing','Shoes','Accessories'].includes(product.category);

      productDetails.innerHTML = `
        ${product.glb ? `<model-viewer src="${product.glb}" alt="${product.name}" camera-controls auto-rotate shadow-intensity="1"></model-viewer>` :
          product.img ? `<img src="${product.img}" alt="${product.name}">` : `<div>No Preview</div>`}
        <div class="product-info">
          <h1>${product.name}</h1>
          <p class="price">₹${product.price}.00</p>
          <div class="buttons-row">
            <button id="add-to-cart" class="btn-primary">Add to Cart</button>
            <button id="wishlist-btn" class="btn-primary ${isWishlisted(product.name) ? 'active' : ''}">
              ${isWishlisted(product.name) ? 'Remove from Wishlist' : 'Add to Wishlist'}
            </button>
            ${canTryOn ? `<button id="tryon-btn" class="btn-primary">Try On</button>` : ''}
          </div>
          <p class="description">High quality product description goes here.</p>
        </div>
      `;

      // Add to Cart
      document.getElementById('add-to-cart').onclick = () => {
        let cart = JSON.parse(localStorage.getItem('cart') || '[]');
        let idx = cart.findIndex(item => item.name === product.name);
        if (idx > -1) cart[idx].quantity++;
        else cart.push({ name: product.name, price: product.price, quantity: 1 });
        localStorage.setItem('cart', JSON.stringify(cart));
        alert(`Added ${product.name} to cart`);
      };

      // Wishlist
      const wishlistBtn = document.getElementById('wishlist-btn');
      wishlistBtn.onclick = () => {
        let wishlist = getWishlist();
        let idx = wishlist.findIndex(item => item.name === product.name);
        if (idx > -1) {
          wishlist.splice(idx, 1);
          wishlistBtn.classList.remove('active');
          wishlistBtn.textContent = "Add to Wishlist";
        } else {
          wishlist.push(product);
          wishlistBtn.classList.add('active');
          wishlistBtn.textContent = "Remove from Wishlist";
        }
        setWishlist(wishlist);
      };

      // Try On → Save selected clothing and open avatar.html
      const tryOnBtn = document.getElementById('tryon-btn');
      if(tryOnBtn){
        tryOnBtn.onclick = () => {
          const selectedProduct = {
            name: product.name,
            glb: product.glb,
            category: product.category
          };
          localStorage.setItem("selectedClothing", JSON.stringify(selectedProduct));
          window.open("avatar.html", "_blank");
        };
      }
    }

    function displayRelated(product){
      relatedList.innerHTML = '';
      let related = products.filter(p => p.category === product.category && p.name !== product.name);
      if(!related.length) related = products.slice(0,4);
      related.forEach(p=>{
        const div = document.createElement('div');
        div.className='product';
        div.innerHTML=`
          ${p.glb ? `<model-viewer src="${p.glb}" alt="${p.name}" camera-controls auto-rotate></model-viewer>` :
          p.img ? `<img src="${p.img}" alt="${p.name}" />` : `<div>No Image</div>`}
          <h3>${p.name}</h3><p class="price">₹${p.price}.00</p>
        `;
        div.onclick = ()=>window.location.href=`product.html?name=${encodeURIComponent(p.name)}`;
        relatedList.appendChild(div);
      });
    }

    window.onload = () => {
      const productName = getQueryParam('name');
      const product = products.find(p=>p.name===productName);
      if(product){
        displayProduct(product);
        displayRelated(product);
      } else productDetails.innerHTML='<p>Product not found.</p>';
    };
  </script>
