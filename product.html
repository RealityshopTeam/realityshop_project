<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Product Details - Reality Shop</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <link rel="stylesheet" href="styles.css">
    <style>
    /* Reset & base */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #a8edea, #fed6e3);
      color: #333;
      line-height: 1.6;
      min-height: 100vh;
    }
    /* Navbar */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #111827;
      padding: 15px 40px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.28);
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    .navbar .logo {
      font-size: 22px;
      font-weight: 700;
      color: #06b6d4;
      text-decoration: none;
    }
    .navbar ul {
      list-style: none;
      display: flex;
      gap: 24px;
      align-items: center;
    }
    .navbar ul li a {
      color: #f3f4f6;
      text-decoration: none;
      font-weight: 500;
      position: relative;
      padding-bottom: 4px;
      transition: color 0.25s ease;
    }
    .navbar ul li a:hover,
    .navbar ul li a.active {
      color: #06b6d4;
    }
    .navbar ul li a::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: -4px;
      width: 0;
      height: 2px;
      background: #06b6d4;
      transition: width 0.25s ease;
    }
    .navbar ul li a:hover::after,
    .navbar ul li a.active::after {
      width: 100%;
    }
    /* Page layout */
    .page-container {
      max-width: 1100px;
      margin: 36px auto;
      padding: 20px;
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 24px;
      align-items: start;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.06);
      padding: 18px;
    }
    /* Product area */
    .product-card { padding: 24px; }
    model-viewer,
    .product-media img {
      width: 100%;
      height: 480px;
      object-fit: contain;
      border-radius: 10px;
      display: block;
      background: #fafafa;
      margin-bottom: 18px;
    }
    .product-info {
      text-align: center;
    }
    .product-info h1 {
      font-size: 1.9rem;
      color: #00bcd4;
      margin-bottom: 8px;
    }
    .product-info p.price {
      font-weight: 700;
      font-size: 1.5rem;
      color: #ff9800;
      margin-bottom: 12px;
    }
    .product-info p.description {
      color: #444;
      font-size: 0.98rem;
      margin-bottom: 18px;
      line-height: 1.5;
    }
    .buttons-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .btn-primary {
      background: linear-gradient(135deg,#00c6ff,#0072ff);
      color: #fff;
      border: none;
      padding: 10px 22px;
      border-radius: 28px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 12px rgba(0,114,255,0.22);
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,114,255,0.3); }
    .btn-ghost {
      background: #fff;
      color: #ff9800;
      border: 1px solid #ff9800;
      padding: 10px 20px;
      border-radius: 28px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-ghost.active {
      background: #ff9800; color: #fff; border-color: transparent;
    }
    /* Related products */
    .related-products .title { font-weight: 700; color: #00bcd4; margin-bottom: 12px; }
    .related-list { display: flex; flex-direction: column; gap: 14px; }
    .related-item {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      align-items: center;
      cursor: pointer;
      padding: 8px;
      border-radius: 8px;
      transition: background .18s ease, transform .12s ease;
    }
    .related-item:hover { background: #f1f8ff; transform: translateY(-3px); }
    .related-media model-viewer,
    .related-media img { width: 100%; height: 150px; object-fit: contain; border-radius: 8px; }
    .related-meta h4 { margin: 6px 0 4px; color: #00bcd4; font-size: 1rem; }
    .related-meta p { margin: 0; font-weight: 700; color: #333; }
    /* Responsive */
    @media (max-width: 980px) {
      .page-container { grid-template-columns: 1fr; padding: 16px; }
      model-viewer, .product-media img { height: 420px; }
    }
    @media (max-width: 480px) {
      model-viewer, .product-media img { height: 320px; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="logo">Reality Shop</a>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="shop.html" class="active">Shop</a></li>
      <li><a href="cart.html">Cart</a></li>
      <li><a href="wishlist.html">Wishlist</a></li>
      <li><a href="login.html">Account</a></li>
    </ul>
  </nav>
  <main class="page-container">
    <section class="card product-card" id="product-details"></section>
    <aside class="card related-products">
      <div class="title">Related Products</div>
      <div class="related-list" id="related-list"></div>
    </aside>
  </main>
  <script type="module">
    import { products } from './products.js';

    function getQueryParam(param) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(param);
    }
    function getWishlist() {
      return JSON.parse(localStorage.getItem('wishlist') || '[]');
    }
    function setWishlist(wishlist) {
      localStorage.setItem('wishlist', JSON.stringify(wishlist));
    }
    function isWishlisted(name) {
      return getWishlist().some(item => item.name === name);
    }
    function displayProduct(product) {
      const container = document.getElementById('product-details');
      if (!product) {
        container.innerHTML = `<p>Product not found.</p>`;
        return;
      }
      const canAR = ["Furniture", "Clothing", "Accessories"].includes(product.category);
      let arButtonHtml = '';
      if (canAR && product.glb) {
        arButtonHtml = `<button class="ar-button" id="ar-view-btn">View in AR</button>`;
      }
      const canTryOnAvatar = ["Clothing", "Accessories"].includes(product.category);
      let tryOnHtml = '';
      if (canTryOnAvatar && (product.img || product.glb)) {
        tryOnHtml = `<button class="tryon-button" id="tryon-btn">Try On Avatar</button>`;
      }
      container.innerHTML = `
      ${product.glb ? `
        <model-viewer 
          src="${product.glb}" alt="${product.name} 3D model" 
          camera-controls auto-rotate shadow-intensity="1" 
          style="width:100%; height:480px; border-radius:8px;" 
          id="main-model"
          interaction-prompt="auto">
          <button slot="ar-button" id="fullscreen-btn" title="Toggle Fullscreen" style="
            position: absolute; bottom: 12px; right: 12px;
            background: rgba(0,0,0,0.5); color: white; border: none;
            border-radius: 30px; padding: 10px 16px; cursor: pointer; z-index: 10;">
            ⛶
          </button>
        </model-viewer>
      ` : product.img ? `
        <img src="${product.img}" alt="${product.name}" style="width:100%; height:480px; object-fit: contain; border-radius:8px;">
      ` : ''}
      <div class="product-info">
        <h1>${product.name}</h1>
        <div class="buttons-row">
          <button class="btn-primary" id="add-cart-btn">Add to Cart</button>
          <button class="btn-ghost ${isWishlisted(product.name) ? 'active' : ''}" id="wishlist-btn">
            ${isWishlisted(product.name) ? "Remove from Wishlist" : "Add to Wishlist"}
          </button>
          ${arButtonHtml}
          ${tryOnHtml}
        </div>
        <p class="price">₹${product.price}.00</p>
        <p class="description">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Aenean euismod bibendum laoreet. Proin gravida dolor sit amet lacus accumsan.</p>
      </div>
      `;

      document.getElementById('add-cart-btn').onclick = () => {
        let cart = JSON.parse(localStorage.getItem('cart') || '[]');
        let existing = cart.find(item => item.name === product.name);
        if(existing) existing.quantity += 1;
        else cart.push({name: product.name, price: product.price, quantity: 1});
        localStorage.setItem('cart', JSON.stringify(cart));
        alert(product.name + " added to cart!");
      };

      // Wishlist toggle handler
      document.getElementById('wishlist-btn').onclick = function() {
        let wishlist = getWishlist();
        const idx = wishlist.findIndex(item => item.name === product.name);
        if (idx > -1) {
          wishlist.splice(idx, 1);
          this.classList.remove('active');
          this.textContent = "Add to Wishlist";
        } else {
          wishlist.push({
            name: product.name, price: product.price, category: product.category,
            img: product.img, glb: product.glb
          });
          this.classList.add('active');
          this.textContent = "Remove from Wishlist";
        }
        setWishlist(wishlist);
      };

      // AR/tryon button handlers
      const arBtn = document.getElementById('ar-view-btn');
      if (arBtn) arBtn.onclick = () => openARViewer(product.glb);

      const tryonBtn = document.getElementById('tryon-btn');
      if (tryonBtn) tryonBtn.onclick = () => openTryOn(product.name, product.img, product.glb);

      // Fullscreen helper for model-viewer
      if (product.glb) {
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const modelViewer = document.getElementById('main-model');
        fullscreenBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          if (!document.fullscreenElement) {
            modelViewer.requestFullscreen();
          } else {
            document.exitFullscreen();
          }
        });
      }
    }

    function openARViewer(modelPath) {
      window.open(`ar-view.html?model=${encodeURIComponent(modelPath)}`, '_blank');
    }
    function openTryOn(name, img, glb) {
      let url = `avatar.html?name=${encodeURIComponent(name)}`;
      if (img) url += `&img=${encodeURIComponent(img)}`;
      if (glb) url += `&glb=${encodeURIComponent(glb)}`;
      window.open(url, '_blank');
    }

    function displayRelated(product) {
      const relatedList = document.getElementById('related-list');
      relatedList.innerHTML = '';
      let related = products.filter(p => p.category === product.category && p.name !== product.name);
      if (!related.length) related = products.filter(p => p.name !== product.name).slice(0, 4);
      related.forEach(p => {
        const item = document.createElement('div');
        item.className = 'related-item card';
        item.tabIndex = 0;
        // preview
        const preview = document.createElement('div');
        preview.className = 'related-media';
        if (p.glb) {
          preview.innerHTML = `<model-viewer src="${p.glb}" alt="${p.name}" camera-controls auto-rotate shadow-intensity="0.5" style="width:100%;height:150px;"></model-viewer>`;
        } else if (p.img) {
          preview.innerHTML = `<img src="${p.img}" alt="${p.name}">`;
        } else {
          preview.innerHTML = `<div style="width:100%; height:150px; display:grid; place-items:center; background:#f3f6fb; border-radius:8px;">No Image</div>`;
        }
        // meta
        const meta = document.createElement('div');
        meta.className = 'related-meta';
        meta.innerHTML = `<h4>${p.name}</h4><p>₹${p.price}.00</p>`;
        item.appendChild(preview);
        item.appendChild(meta);
        // click behaviour
        item.addEventListener('click', () => {
          window.location.href = `product.html?name=${encodeURIComponent(p.name)}`;
        });
        relatedList.appendChild(item);
      });
    }

    window.onload = () => {
      const productName = getQueryParam('name');
      const product = products.find(p => p.name === productName);
      displayProduct(product);
      if (product) displayRelated(product);
    };
  </script>
</body>
</html>
