<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Product Details - Reality Shop</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    /* Reset & base */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #a8edea, #fed6e3);
      color: #333;
      line-height: 1.6;
      min-height: 100vh;
    }

    /* Navbar */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #111827;
      padding: 15px 40px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.28);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .navbar .logo {
      font-size: 22px;
      font-weight: 700;
      color: #06b6d4;
      text-decoration: none;
    }

    .navbar ul {
      list-style: none;
      display: flex;
      gap: 24px;
      align-items: center;
    }

    .navbar ul li a {
      color: #f3f4f6;
      text-decoration: none;
      font-weight: 500;
      position: relative;
      padding-bottom: 4px;
      transition: color 0.25s ease;
    }

    .navbar ul li a:hover,
    .navbar ul li a.active {
      color: #06b6d4;
    }

    .navbar ul li a::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: -4px;
      width: 0;
      height: 2px;
      background: #06b6d4;
      transition: width 0.25s ease;
    }

    .navbar ul li a:hover::after,
    .navbar ul li a.active::after {
      width: 100%;
    }

    /* Page layout */
    .page-container {
      max-width: 1100px;
      margin: 36px auto;
      padding: 20px;
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 24px;
      align-items: start;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.06);
      padding: 18px;
    }

    /* Product area */
    .product-card { padding: 24px; }

    model-viewer,
    .product-media img {
      width: 100%;
      height: 480px;
      object-fit: contain;
      border-radius: 10px;
      display: block;
      background: #fafafa;
      margin-bottom: 18px;
    }

    .product-info {
      text-align: center;
    }

    .product-info h1 {
      font-size: 1.9rem;
      color: #00bcd4;
      margin-bottom: 8px;
    }

    .product-info p.price {
      font-weight: 700;
      font-size: 1.5rem;
      color: #ff9800;
      margin-bottom: 12px;
    }

    .product-info p.description {
      color: #444;
      font-size: 0.98rem;
      margin-bottom: 18px;
      line-height: 1.5;
    }

    .buttons-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .btn-primary {
      background: linear-gradient(135deg,#00c6ff,#0072ff);
      color: #fff;
      border: none;
      padding: 10px 22px;
      border-radius: 28px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 12px rgba(0,114,255,0.22);
      transition: transform .18s ease, box-shadow .18s ease;
    }

    .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,114,255,0.3); }

    .btn-ghost {
      background: #fff;
      color: #ff9800;
      border: 1px solid #ff9800;
      padding: 10px 20px;
      border-radius: 28px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-ghost.active {
      background: #ff9800; color: #fff; border-color: transparent;
    }

    /* Related products */
    .related-products .title { font-weight: 700; color: #00bcd4; margin-bottom: 12px; }

    .related-list { display: flex; flex-direction: column; gap: 14px; }

    .related-item {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      align-items: center;
      cursor: pointer;
      padding: 8px;
      border-radius: 8px;
      transition: background .18s ease, transform .12s ease;
    }

    .related-item:hover { background: #f1f8ff; transform: translateY(-3px); }

    .related-media model-viewer,
    .related-media img { width: 100%; height: 150px; object-fit: contain; border-radius: 8px; }

    .related-meta h4 { margin: 6px 0 4px; color: #00bcd4; font-size: 1rem; }

    .related-meta p { margin: 0; font-weight: 700; color: #333; }

    /* Responsive */
    @media (max-width: 980px) {
      .page-container { grid-template-columns: 1fr; padding: 16px; }
      model-viewer, .product-media img { height: 420px; }
    }

    @media (max-width: 480px) {
      model-viewer, .product-media img { height: 320px; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="logo">Reality Shop</a>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="shop.html" class="active">Shop</a></li>
      <li><a href="cart.html">Cart</a></li>
      <li><a href="wishlist.html">Wishlist</a></li>
      <li><a href="login.html">Account</a></li>
    </ul>
  </nav>

  <main class="page-container">
    <section class="card product-card" id="product-details">
      <!-- product content will be injected here -->
    </section>

    <aside class="card related-products" id="related-products">
      <div class="title">Related Products</div>
      <div class="related-list" id="related-list"></div>
    </aside>
  </main>

  <script>
    /* --- Product data --- */
    const products = [
      { name: "Samsung s22 ultra", price: 65999, glb: "imgs/samsung_galaxy_s22_ultra.glb", category: "Mobile" },
      { name: "Poco x3", price: 15999, glb: "imgs/poco_x3_nfc.glb", category: "Mobile" },
      { name: "Iphone 16 pro max", price: 159999, glb: "imgs/iphone_16_pro_max.glb", category: "Mobile" },
      { name: "Single Royal Chair", price: 950, glb: "imgs/chair.glb", category: "Furniture" },
      { name: "Single Cot", price: 999, glb: "imgs/singlecot.glb", category: "Furniture" },
      { name: "Blue T-shirt", price: 499, img: "imgs/Ts.jpg", category: "Clothing" },
      { name: "Plain Shirt", price: 450, img: "imgs/short.jpg", category: "Clothing" },
      { name: "Table", price: 850, glb: "imgs/table.glb", category: "Furniture" },
      { name: "Sun Glass", price: 299, glb: "imgs/sunglas.glb", category: "Accessories" },
      { name: "Three Seat Sofa", price: 999, glb: "imgs/sofa1.glb", category: "Furniture" },
      { name: "Wooden Table", price: 750, glb: "imgs/wood table.glb", category: "Furniture" },
      { name: "Sweat Shirt", price: 550, img: "imgs/Tshort.jpg", category: "Clothing" },
      { name: "Head Phones", price: 899, glb: "imgs/head phone.glb", category: "Electronics" },
      { name: "Single Sofa", price: 980, glb: "imgs/sofa.glb", category: "Furniture" },
      { name: "nike shoes", price: 1400, glb: "imgs/nike_air_zoom_pegasus_36.glb", category: "Shoes" }
    ];

    /* --- Utilities --- */
    function getQueryParam(key) {
      return new URLSearchParams(window.location.search).get(key);
    }

    function getWishlist() {
      return JSON.parse(localStorage.getItem('wishlist') || '[]');
    }

    function setWishlist(list) {
      localStorage.setItem('wishlist', JSON.stringify(list));
    }

    function isWishlisted(name) {
      return getWishlist().some(i => i.name === name);
    }

    /* --- Render product --- */
    function renderProduct(product) {
      const container = document.getElementById('product-details');

      if (!product) {
        container.innerHTML = `<div class="product-info"><h2>Product not found</h2><p>Please go back to the <a href="shop.html">shop</a>.</p></div>`;
        return;
      }

      // choose preview markup
      let previewHtml = '';
      if (product.glb) {
        previewHtml = `<model-viewer id="main-model" src="${product.glb}" alt="${product.name} 3D" camera-controls auto-rotate shadow-intensity="1" style="width:100%; height:480px;"></model-viewer>`;
      } else if (product.img) {
        previewHtml = `<div class="product-media"><img src="${product.img}" alt="${product.name}"></div>`;
      }

      container.innerHTML = `
        ${previewHtml}

        <div class="product-info">
          <h1>${product.name}</h1>

          <div class="buttons-row">
            <button class="btn-primary" id="add-cart">Add to Cart</button>
            <button class="btn-ghost ${isWishlisted(product.name) ? 'active' : ''}" id="wishlist-btn">${isWishlisted(product.name) ? 'Remove from Wishlist' : 'Add to Wishlist'}</button>
            ${product.glb ? `<button class="btn-primary" id="ar-btn">View in AR</button>` : ''}
          </div>

          <p class="price">₹${product.price}.00</p>
          <p class="description">High-quality product description goes here. Replace with real content to describe features, materials and sizing.</p>
        </div>
      `;

      // attach handlers
      document.getElementById('add-cart').addEventListener('click', () => {
        const cart = JSON.parse(localStorage.getItem('cart') || '[]');
        const found = cart.find(i => i.name === product.name);
        if (found) found.quantity += 1; else cart.push({ name: product.name, price: product.price, quantity: 1 });
        localStorage.setItem('cart', JSON.stringify(cart));
        alert(`${product.name} added to cart`);
      });

      document.getElementById('wishlist-btn').addEventListener('click', (e) => {
        let list = getWishlist();
        const idx = list.findIndex(i => i.name === product.name);
        const btn = e.currentTarget;
        if (idx > -1) {
          list.splice(idx, 1);
          btn.classList.remove('active');
          btn.textContent = 'Add to Wishlist';
        } else {
          list.push({ name: product.name, price: product.price, category: product.category, img: product.img, glb: product.glb });
          btn.classList.add('active');
          btn.textContent = 'Remove from Wishlist';
        }
        setWishlist(list);
      });

      const arBtn = document.getElementById('ar-btn');
      if (arBtn) arBtn.addEventListener('click', () => {
        window.open(`ar-view.html?model=${encodeURIComponent(product.glb)}`, '_blank');
      });

      // fullscreen helper for model-viewer
      const mv = document.getElementById('main-model');
      if (mv) {
        mv.addEventListener('error', () => console.warn('model-viewer error for', product.glb));
      }
    }

    /* --- Related products --- */
    function renderRelated(currentProduct) {
      const list = document.getElementById('related-list');
      list.innerHTML = '';

      // pick related by category, fallback to others
      let related = products.filter(p => p.category === currentProduct.category && p.name !== currentProduct.name);
      if (!related.length) related = products.filter(p => p.name !== currentProduct.name).slice(0, 4);

      related.forEach(p => {
        const item = document.createElement('div');
        item.className = 'related-item card';
        item.tabIndex = 0;

        // preview
        const preview = document.createElement('div');
        preview.className = 'related-media';
        if (p.glb) {
          preview.innerHTML = `<model-viewer src="${p.glb}" alt="${p.name}" camera-controls auto-rotate shadow-intensity="0.5" style="width:100%; height:150px;"></model-viewer>`;
        } else if (p.img) {
          preview.innerHTML = `<img src="${p.img}" alt="${p.name}">`;
        } else {
          preview.innerHTML = `<div style="width:100%; height:150px; display:grid; place-items:center; background:#f3f6fb; border-radius:8px;">No Image</div>`;
        }

        // meta
        const meta = document.createElement('div');
        meta.className = 'related-meta';
        meta.innerHTML = `<h4>${p.name}</h4><p>₹${p.price}.00</p>`;

        item.appendChild(preview);
        item.appendChild(meta);

        // click behaviour
        item.addEventListener('click', () => {
          window.location.href = `product.html?name=${encodeURIComponent(p.name)}`;
        });

        list.appendChild(item);
      });
    }

    /* --- Init page --- */
    (function init() {
      const name = getQueryParam('name');
      const product = products.find(p => p.name === name) || products[0];
      renderProduct(product);
      renderRelated(product);
    })();
  </script>
</body>
</html>
