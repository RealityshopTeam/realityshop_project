<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Product Details - Reality Shop</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- model-viewer for 3D product preview -->
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Top Navbar for desktop/tablet -->
  <nav class="navbar">
    <a href="index.html" class="logo">Reality Shop</a>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="shop.html" class="active">Shop</a></li>
      <li><a href="cart.html">Cart</a></li>
      <li><a href="wishlist.html">Wishlist</a></li>
      <li><a href="login.html">Account</a></li>
    </ul>
  </nav>
  <!-- Mobile bottom navbar (optional, add if wanted) -->
  <nav class="mobile-bottom-nav">
    <a href="index.html"><svg ...></svg>Home</a>
    <a href="shop.html" class="active"><svg ...></svg>Shop</a>
    <a href="cart.html"><svg ...></svg>Cart</a>
    <a href="wishlist.html"><svg ...></svg>Wishlist</a>
    <a href="login.html"><svg ...></svg>Account</a>
  </nav>

  <!-- Product Details Container -->
  <div class="container" id="product-details"></div>
  <div class="container">
    <h2 class="section-title">Related Products</h2>
    <div class="grid" id="related-list"></div>
  </div>
  
  <footer>
    <p>© 2025 Reality Shop. All rights reserved.</p>
  </footer>

  <script type="module">
    // Import products array from external JS file or define it here
    import { products } from './products.js';
    function getQueryParam(param) {
      return new URLSearchParams(window.location.search).get(param);
    }
    function getWishlist() {
      return JSON.parse(localStorage.getItem('wishlist') || '[]');
    }
    function setWishlist(wishlist) {
      localStorage.setItem('wishlist', JSON.stringify(wishlist));
    }
    function isWishlisted(name) {
      return getWishlist().some(item => item.name === name);
    }
    function loadProduct() {
      const productName = getQueryParam('name');
      const product = products.find(p => p.name === productName);
      const el = document.getElementById('product-details');
      if (!product) {
        el.innerHTML = `<h2 class="section-title">Product not found</h2>`;
        return;
      }
      let mediaHtml = '';
      if (product.glb) {
        mediaHtml = `<model-viewer src="${product.glb}" alt="${product.name} 3D view" camera-controls auto-rotate shadow-intensity="1" style="width:100%;height:200px;border-radius:8px;margin-bottom:12px;"></model-viewer>`;
      } else if (product.img) {
        mediaHtml = `<img src="${product.img}" alt="${product.name}" style="width:100%;height:200px;object-fit:contain;border-radius:8px;margin-bottom:12px;">`;
      } else {
        mediaHtml = `<div class="no-asset">Preview not available</div>`;
      }
      el.innerHTML = `
        ${mediaHtml}
        <h1 class="section-title">${product.name}</h1>
        <p class="category">${product.category}</p>
        <p class="price">₹${product.price}.00</p>
        <div class="button-row">
          <button class="cart-btn" type="button">Add to Cart</button>
          <button class="wishlist-btn${isWishlisted(product.name) ? ' added' : ''}" type="button">
            ${isWishlisted(product.name) ? "Remove from Wishlist" : "Add to Wishlist"}
          </button>
        </div>
        <p class="description">High-quality product description goes here. Replace with real content to describe features, materials and sizing.</p>
      `;
      el.querySelector('.cart-btn').onclick = () => {
        let cart = JSON.parse(localStorage.getItem('cart') || '[]');
        let existing = cart.find(item => item.name === product.name);
        if (existing) existing.quantity += 1;
        else cart.push({ name: product.name, price: product.price, quantity: 1 });
        localStorage.setItem('cart', JSON.stringify(cart));
        alert(product.name + " added to cart!");
      };
      const wishBtn = el.querySelector('.wishlist-btn');
      wishBtn.onclick = () => {
        let wishlist = getWishlist();
        const index = wishlist.findIndex(item => item.name === product.name);
        if (index > -1) {
          wishlist.splice(index, 1);
          wishBtn.classList.remove('added');
          wishBtn.textContent = "Add to Wishlist";
        } else {
          wishlist.push({
            name: product.name,
            price: product.price,
            category: product.category,
            img: product.img,
            glb: product.glb
          });
          wishBtn.classList.add('added');
          wishBtn.textContent = "Remove from Wishlist";
        }
        setWishlist(wishlist);
      };
    }
    function loadRelated() {
      const productName = getQueryParam('name');
      const product = products.find(p => p.name === productName);
      const grid = document.getElementById('related-list');
      let related = products.filter(p => p.category === product.category && p.name !== product.name);
      if (!related.length) related = products.filter(p => p.name !== product.name).slice(0, 4);
      grid.innerHTML = '';
      related.forEach(p => {
        let preview = p.glb
          ? `<model-viewer src="${p.glb}" alt="${p.name}" camera-controls auto-rotate shadow-intensity="1"></model-viewer>`
          : p.img
          ? `<img src="${p.img}" alt="${p.name}">`
          : `<div class="no-asset">Preview not available</div>`;
        const div = document.createElement('div');
        div.className = 'product';
        div.innerHTML = `
          ${preview}
          <h3>${p.name}</h3>
          <p class="category">${p.category}</p>
          <p>₹${p.price}.00</p>
        `;
        div.onclick = () =>
          window.location.href = `product.html?name=${encodeURIComponent(p.name)}`;
        grid.appendChild(div);
      });
    }
    window.onload = () => {
      loadProduct();
      loadRelated();
    };
  </script>
</body>
</html>
