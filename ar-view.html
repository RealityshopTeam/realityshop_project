<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Marker Based AR (A-Frame + Importmap)</title>
  <style>
    body { margin: 0; overflow: hidden; }
  </style>
<script src="https://aframe.io/releases/0.8.2/aframe.min.js"></script>
<script src="https://cdn.rawgit.com/jeromeetienne/AR.js/1.6.2/aframe/build/aframe-ar.js"></srcipt>
</head>
<body style="margin:0; overflow:hidden;">
  <a-scene embedded arjs>
    <a-marker preset="hiro">
      <a-box position="0 0.5 0" material="color:red">
        <a-animation attribute="rotation"
          dur="3000"
          to="360 360 0"
          repeat="indefinite"
          easing="linear">
          </a-animation>
      </a-box>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
