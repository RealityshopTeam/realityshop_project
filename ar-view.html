<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Reality Shop - AR Furniture from Products</title>
  <style>
    body { margin: 0; overflow: hidden; }
  </style>

  <!-- Import maps -->
  <script type="importmap">
  {
    "imports": {
      "aframe": "https://aframe.io/releases/1.2.0/aframe.min.js",
      "arjs": "https://cdn.rawgit.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"
    }
  }
  </script>

  <script type="module">
    import "aframe";
    import "arjs";

    async function loadProducts() {
      // Fetch your product list
      const res = await fetch("products.html");
      const text = await res.text();

      // Parse HTML
      const parser = new DOMParser();
      const doc = parser.parseFromString(text, "text/html");

      // Get product items
      const items = doc.querySelectorAll("#product-list li");

      // Insert models into AR scene
      const marker = document.querySelector("a-marker");
      items.forEach((item, index) => {
        const modelUrl = item.dataset.model;
        if (modelUrl) {
          const entity = document.createElement("a-entity");
          entity.setAttribute("gltf-model", modelUrl);
          entity.setAttribute("scale", "0.5 0.5 0.5");
          entity.setAttribute("position", `${index * 1.5} 0 0`); // spread out
          marker.appendChild(entity);
        }
      });
    }

    window.addEventListener("DOMContentLoaded", loadProducts);
  </script>
</head>
<body>
  <a-scene embedded arjs>
    <!-- Marker (default Hiro) -->
    <a-marker preset="hiro"></a-marker>
    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
