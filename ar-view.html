<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reality Shop - Universal AR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- model-viewer (ARCore / ARKit) -->
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <!-- A-Frame (fallback for non-ARCore devices) -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://cdn.rawgit.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    body, html { margin: 0; padding: 0; height: 100%; background: #101010; }
    #mv-container, #aframe-container, #error { width: 100%; height: 100%; display: none; }
    #error { color: white; text-align: center; padding-top: 30%; font-size: 1.2rem; }
  </style>
</head>
<body>

<!-- ✅ Model Viewer (real AR for supported devices) -->
<div id="mv-container">
  <model-viewer id="mv"
    alt="3D Product"
    ar
    ar-modes="webxr scene-viewer quick-look"
    camera-controls
    environment-image="neutral"
    shadow-intensity="1"
    style="width: 100%; height: 100%; background:#101010;">
  </model-viewer>
</div>

<!-- ⚠️ Fallback AR.js (camera + tap to place product) -->
<div id="aframe-container">
  <a-scene embedded vr-mode-ui="enabled: false"
           renderer="logarithmicDepthBuffer: true;"
           arjs="sourceType: webcam; trackingMethod: best; debugUIEnabled: false;">
    <!-- Tap placement -->
    <a-entity id="fallback-model"
      scale="0.5 0.5 0.5"
      visible="false">
    </a-entity>

    <a-entity camera></a-entity>
  </a-scene>
</div>

<!-- ❌ Error if no model -->
<div id="error">⚠️ No product selected. Please go back to Products page.</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const modelPath = params.get("model");

  const mv = document.getElementById("mv");
  const fallbackModel = document.getElementById("fallback-model");
  const mvContainer = document.getElementById("mv-container");
  const aframeContainer = document.getElementById("aframe-container");
  const errorMsg = document.getElementById("error");

  if (!modelPath) {
    errorMsg.style.display = "block";
  } else {
    mv.setAttribute("src", modelPath);
    fallbackModel.setAttribute("gltf-model", `url(${modelPath})`);

    // Listen for AR status → if ARCore fails, use fallback
    mv.addEventListener("ar-status", (e) => {
      if (e.detail.status === "failed") {
        console.log("⚠️ No ARCore → fallback mode");
        mvContainer.style.display = "none";
        aframeContainer.style.display = "block";
      } else {
        console.log("✅ ARCore available");
        mvContainer.style.display = "block";
        aframeContainer.style.display = "none";
      }
    });

    // Fallback tap-to-place
    document.addEventListener("click", function (event) {
      if (aframeContainer.style.display === "block") {
        const x = (event.clientX / window.innerWidth) * 2 - 1;
        const y = -(event.clientY / window.innerHeight) * 2 + 1;
        fallbackModel.setAttribute("position", `${x} -0.5 -2`);
        fallbackModel.setAttribute("visible", "true");
      }
    });
  }
</script>

</body>
</html>
