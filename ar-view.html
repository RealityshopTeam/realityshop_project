<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reality Shop - Universal AR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- model-viewer (for ARCore/ARKit devices) -->
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  
  <!-- A-Frame + AR.js (for devices without ARCore) -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://cdn.rawgit.com/jeromeetienne/AR.js/3.3.2/aframe/build/aframe-ar.js"></script>

  <style>
    body, html { margin: 0; padding: 0; overflow: hidden; height: 100%; background: #101010; }
    #mv-container, #arjs-container { width: 100%; height: 100%; display: none; }
  </style>
</head>
<body>

<!-- Model Viewer Container (ARCore/ARKit) -->
<div id="mv-container">
  <model-viewer id="mv" 
    src="products/chair.glb"
    alt="3D Product"
    ar
    ar-modes="webxr scene-viewer quick-look"
    camera-controls
    environment-image="neutral"
    shadow-intensity="1"
    style="width: 100%; height: 100%;">
  </model-viewer>
</div>

<!-- AR.js Container (Marker-based fallback) -->
<div id="arjs-container">
  <a-scene embedded arjs="sourceType: webcam;">
    <!-- Marker (Hiro) -->
    <a-marker preset="hiro">
      <a-entity gltf-model="url(products/chair.glb)" 
                scale="0.5 0.5 0.5" 
                position="0 0 0">
      </a-entity>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>
</div>

<script>
  const mv = document.getElementById("mv");
  const mvContainer = document.getElementById("mv-container");
  const arjsContainer = document.getElementById("arjs-container");

  // Check ARCore/ARKit support
  mv.addEventListener("ar-status", (e) => {
    if (e.detail.status === "failed") {
      console.log("⚠️ AR not supported → using AR.js marker fallback");
      mvContainer.style.display = "none";
      arjsContainer.style.display = "block";
    } else {
      console.log("✅ AR supported → using model-viewer AR");
      mvContainer.style.display = "block";
      arjsContainer.style.display = "none";
    }
  });
</script>

</body>
</html>
