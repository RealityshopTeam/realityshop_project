<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Marker Based AR (Fixed Importmap)</title>
    <style>
      body { margin: 0; overflow: hidden; }
    </style>

    <!-- Importmap -->
    <script type="importmap">
    {
      "imports": {
        "aframe": "https://unpkg.com/aframe@1.4.2/dist/aframe.min.js",
        "arjs-aframe": "https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"
      }
    }
    </script>

    <!-- Load A-Frame as global first -->
    <script type="module">
      import * as AFRAME from "aframe";
      window.AFRAME = AFRAME; // 👈 expose to global
    </script>

    <!-- Then load AR.js -->
    <script type="module">
      import "arjs-aframe";
    </script>
  </head>
  <body>
    <!-- AR Scene -->
    <a-scene embedded arjs>
      <!-- Marker -->
      <a-marker preset="hiro">
        <a-box position="0 0.5 0" material="color: green;"></a-box>
      </a-marker>

      <!-- Camera -->
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
