<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reality Shop - Universal AR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- model-viewer (for ARCore/ARKit devices) -->
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <!-- A-Frame + AR.js (for non-ARCore devices) -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://cdn.rawgit.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

  <style>
    body, html { margin: 0; padding: 0; height: 100%; background: #101010; }
    #mv-container, #arjs-container { width: 100%; height: 100%; display: none; }
    #error { display: none; color: white; text-align: center; padding-top: 30%; font-size: 1.2rem; }
  </style>
</head>
<body>

<!-- Model Viewer Container (ARCore/ARKit) -->
<div id="mv-container">
  <model-viewer id="mv" 
    alt="3D Product"
    ar
    ar-modes="webxr scene-viewer quick-look"
    camera-controls
    environment-image="neutral"
    shadow-intensity="1"
    style="width: 100%; height: 100%; background:#101010;">
  </model-viewer>
</div>

<!-- AR.js Container (Fallback for non-ARCore devices) -->
<div id="arjs-container">
  <a-scene 
      embedded 
      vr-mode-ui="enabled: false"
      renderer="logarithmicDepthBuffer: true;"
      arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">
      
    <a-entity id="ar-model"
      scale="0.5 0.5 0.5"
      position="0 0 -2"
      rotation="0 0 0">
    </a-entity>

    <a-entity camera></a-entity>
  </a-scene>
</div>

<!-- Error message -->
<div id="error">⚠️ No product selected. Please go back to Products page.</div>

<script>
  // Get product model path from query string (?model=...)
  const params = new URLSearchParams(window.location.search);
  const modelPath = params.get("model"); 

  const mv = document.getElementById("mv");
  const arModel = document.getElementById("ar-model");
  const mvContainer = document.getElementById("mv-container");
  const arjsContainer = document.getElementById("arjs-container");
  const errorMsg = document.getElementById("error");

  if (!modelPath) {
    // No product selected → show error
    errorMsg.style.display = "block";
  } else {
    // Set model in both viewers
    mv.setAttribute("src", modelPath);
    arModel.setAttribute("gltf-model", `url(${modelPath})`);

    // First try model-viewer (ARCore/ARKit devices)
    mvContainer.style.display = "block";

    mv.addEventListener("ar-status", (e) => {
      if (e.detail.status === "failed") {
        console.log("⚠️ AR not supported → using AR.js fallback");
        mvContainer.style.display = "none";
        arjsContainer.style.display = "block";
      } else if (e.detail.status === "session-started") {
        console.log("✅ AR session started with model-viewer");
      }
    });

    // If model-viewer never triggers AR (older browsers), fallback to AR.js after timeout
    setTimeout(() => {
      if (mvContainer.style.display === "block" && !mv.canActivateAR) {
        console.log("⏳ model-viewer AR not available → switching to AR.js");
        mvContainer.style.display = "none";
        arjsContainer.style.display = "block";
      }
    }, 4000);
  }
</script>

</body>
</html>
