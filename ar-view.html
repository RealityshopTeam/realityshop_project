<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reality Shop - Universal AR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <!-- model-viewer (for ARCore/ARKit devices) -->  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>  <!-- A-Frame (for devices without ARCore) -->  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>  <style>
    body, html { margin: 0; padding: 0; overflow: hidden; height: 100%; background: #101010; }
    #mv-container, #aframe-container { width: 100%; height: 100%; display: none; }
    .draggable { touch-action: none; }
  </style></head>
<body><!-- Model Viewer Container (ARCore/ARKit) --><div id="mv-container">
  <model-viewer id="mv" 
    src=""
    alt="3D Product"
    ar
    ar-modes="webxr scene-viewer quick-look"
    camera-controls
    environment-image="neutral"
    shadow-intensity="1"
    style="width: 100%; height: 100%; background:#101010;">
  </model-viewer>
</div><!-- A-Frame Fallback (for non-ARCore devices, simulated AR with camera feed) --><div id="aframe-container">
  <a-scene embedded vr-mode-ui="enabled: false" renderer="logarithmicDepthBuffer: true;" 
           device-orientation-permission-ui="enabled: true"><!-- Live camera feed -->
<a-entity camera></a-entity>

<!-- Product model -->
<a-entity id="fallback-model"
  gltf-model=""
  class="draggable"
  scale="0.5 0.5 0.5"
  position="0 0 -2"
  rotation="0 0 0">
</a-entity>

  </a-scene>
</div><script>
  const mv = document.getElementById("mv");
  const mvContainer = document.getElementById("mv-container");
  const aframeContainer = document.getElementById("aframe-container");
  const fallbackModel = document.getElementById("fallback-model");

  // Get product path from URL (?model=imgs/chair.glb)
  const urlParams = new URLSearchParams(window.location.search);
  const modelPath = urlParams.get("model") || "imgs/chair.glb";

  // Apply model path
  mv.setAttribute("src", modelPath);
  fallbackModel.setAttribute("gltf-model", `url(${modelPath})`);

  // Detect ARCore/ARKit support via model-viewer
  mv.addEventListener("ar-status", (e) => {
    if (e.detail.status === "failed") {
      console.log("⚠️ AR not supported → using simulated AR with camera feed");
      mvContainer.style.display = "none";
      aframeContainer.style.display = "block";
    } else {
      console.log("✅ AR supported → using model-viewer AR");
      mvContainer.style.display = "block";
      aframeContainer.style.display = "none";
    }
  });

  // Drag controls for fallback mode (touch/mouse)
  let isDragging = false, startX, startY;
  fallbackModel.addEventListener("mousedown", (e) => { isDragging = true; startX = e.clientX; startY = e.clientY; });
  window.addEventListener("mouseup", () => isDragging = false);
  window.addEventListener("mousemove", (e) => {
    if (!isDragging) return;
    const dx = e.clientX - startX;
    fallbackModel.object3D.rotation.y += dx * 0.01;
    startX = e.clientX;
  });

  // Touch support
  fallbackModel.addEventListener("touchstart", (e) => {
    isDragging = true; startX = e.touches[0].clientX; startY = e.touches[0].clientY;
  });
  window.addEventListener("touchend", () => isDragging = false);
  window.addEventListener("touchmove", (e) => {
    if (!isDragging) return;
    const dx = e.touches[0].clientX - startX;
    fallbackModel.object3D.rotation.y += dx * 0.01;
    startX = e.touches[0].clientX;
  });
</script></body>
</html>
