<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Marker Based AR (A-Frame + AR.js)</title>
  <style>
    body { margin: 0; overflow: hidden; }
  </style>

  <!-- Latest A-Frame -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <!-- Latest AR.js build -->
  <script src="https://rawcdn.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin:0; overflow:hidden;">
  <a-scene
    vr-mode-ui="enabled: false"
    embedded
    arjs="sourceType: webcam; detectionMode: mono; debugUIEnabled: false;">
    
    <!-- Marker -->
    <a-marker preset="hiro">
      <a-box position="0 0.5 0" material="color: red">
        <a-animation attribute="rotation"
          dur="3000"
          to="360 360 0"
          repeat="indefinite"
          easing="linear">
        </a-animation>
      </a-box>
    </a-marker>

    <!-- Camera -->
    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
