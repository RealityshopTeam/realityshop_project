<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reality Shop - AR View with Products</title>
  <style>
    body { margin: 0; overflow: hidden; }
  </style>

  <!-- Latest A-Frame -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <!-- Latest AR.js -->
  <script src="https://rawcdn.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin:0; overflow:hidden;">
  <a-scene
    vr-mode-ui="enabled: false"
    embedded
    arjs="sourceType: webcam; detectionMode: mono; debugUIEnabled: false;">

    <!-- Marker -->
    <a-marker preset="hiro">
      <!-- Product placeholder -->
      <a-entity id="productModel" scale="0.5 0.5 0.5" rotation="0 180 0" position="0 0 0"></a-entity>
    </a-marker>

    <!-- Camera -->
    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // Get product URL from query string
    const urlParams = new URLSearchParams(window.location.search);
    const productUrl = urlParams.get("product") || "models/chair.glb"; // default product

    // Load product model
    const productEntity = document.getElementById("productModel");
    productEntity.setAttribute("gltf-model", productUrl);
  </script>
</body>
</html>
