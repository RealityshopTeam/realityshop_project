<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Marker Based AR (A-Frame + Importmap)</title>
  <style>
    body { margin: 0; overflow: hidden; }
  </style>

  <!-- Importmap -->
  <script type="importmap">
  {
    "imports": {
      "aframe": "https://unpkg.com/aframe@1.4.2/dist/aframe.min.js",
      "arjs-aframe": "https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"
    }
  }
  </script>

  <!-- Load A-Frame -->
  <script type="module">
    import * as AFRAME from "aframe";
    window.AFRAME = AFRAME; // expose as global
  </script>

  <!-- Load AR.js -->
  <script type="module">
    import "arjs-aframe";
  </script>
</head>
<body style="margin:0; overflow:hidden;">
  <a-scene embedded arjs>
    <a-marker preset="hiro">
      <a-entity
        position="0 0 0"
        scale="0.05 0.05 0.05"
        gltf-model="https://raw.githack.com/AR-js-org/AR.js/master/aframe/examples/image-tracking/nft/trex/scene.gltf">
      </a-entity>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
