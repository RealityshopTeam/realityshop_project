<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reality Shop - Universal AR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- model-viewer for immersive AR -->
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <!-- A-Frame + AR.js for marker AR fallback -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
  <style>
    body, html { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
    #mv-container, #arjs-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; display: none; }
    .instructions {
      position: absolute;
      bottom: 20px;
      left: 0;
      width: 100vw;
      text-align: center;
      color: #fff;
      font-size: 1.1em;
      font-family: Arial, sans-serif;
      padding: 8px 0;
      background: rgba(0,0,0,0.4);
      z-index: 10;
      pointer-events: none;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
<div class="instructions" id="instructions">Loading AR experience...</div>

<div id="mv-container">
  <model-viewer id="mv"
    alt="3D Product"
    camera-controls
    auto-rotate
    style="width:100vw; height:100vh; background:#000; border: none;">
  </model-viewer>
</div>

<div id="arjs-container">
  <a-scene
    vr-mode-ui="enabled: false"
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;">
    <a-marker preset="hiro">
      <a-entity id="arjs-model"
        scale="0.5 0.5 0.5"
        position="0 0 0">
      </a-entity>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>
</div>

<script>
  const mv = document.getElementById("mv");
  const mvContainer = document.getElementById("mv-container");
  const arjsContainer = document.getElementById("arjs-container");
  const arjsModel = document.getElementById("arjs-model");
  const instructions = document.getElementById("instructions");
  // Get product path from URL (?model=yourmodel.glb)
  const urlParams = new URLSearchParams(window.location.search);
  const modelPath = urlParams.get("model") || "https://modelviewer.dev/shared-assets/models/Astronaut.glb"; // Demo fallback

  // Set 3D model for both viewers
  mv.setAttribute("src", modelPath);
  arjsModel.setAttribute("gltf-model", `url(${modelPath})`);

  // Universal mode check
  instructions.textContent = "Checking device AR capabilities...";

  function showModelViewerAR() {
    mv.setAttribute("ar", "true");
    mv.setAttribute("ar-modes", "webxr scene-viewer quick-look");
    mvContainer.style.display = "block";
    arjsContainer.style.display = "none";
    instructions.textContent = "Tap AR button to place product in your room. Rotate and zoom in 3D mode if you prefer.";
  }

  function showARjsMarker() {
    mvContainer.style.display = "none";
    arjsContainer.style.display = "block";
    instructions.innerHTML = `
      Point your camera at the <a style="color:yellow;text-decoration:underline;" href="https://raw.githubusercontent.com/jeromeetienne/ar.js/master/three.js/data/images/HIRO.jpg" target="_blank">HIRO marker</a> to see the product.<br>
      Rotate/zoom in 3D mode if preferred.`;
  }

  // Check for immersive AR support, fallback to marker AR if unavailable
  if ('xr' in navigator && navigator.xr) {
    navigator.xr.isSessionSupported('immersive-ar').then((supported) => {
      if (supported) {
        showModelViewerAR();
      } else {
        showARjsMarker();
      }
    }).catch(() => {
      showARjsMarker();
    });
  } else {
    showARjsMarker();
  }
</script>
</body>
</html>
