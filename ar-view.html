<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reality Shop - AR View</title>
  <style>
    body { margin: 0; overflow: hidden; background: black; }
    video, canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }
  </style>

  <!-- Importmap -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/examples/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <!-- Marker-based AR (AR.js) -->
  <a-scene id="markerScene" embedded vr-mode-ui="enabled: false"
           arjs="sourceType: webcam; debugUIEnabled: false;">
    <a-marker preset="hiro">
      <a-entity id="markerModel"></a-entity>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>

  <!-- Fallback camera overlay -->
  <video id="camera" autoplay playsinline style="display:none;"></video>
  <canvas id="overlay" style="display:none;"></canvas>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/examples/loaders/GLTFLoader.js";

    // Get product model from URL (ex: arview.html?product=models/chair.glb)
    const urlParams = new URLSearchParams(window.location.search);
    const modelUrl = urlParams.get("product") || "models/chair.glb";

    const markerScene = document.getElementById("markerScene");
    const video = document.getElementById("camera");
    const overlay = document.getElementById("overlay");

    // Load model into AR.js marker
    const markerModel = document.getElementById("markerModel");
    markerModel.setAttribute("gltf-model", modelUrl);
    markerModel.setAttribute("scale", "0.5 0.5 0.5");
    markerModel.setAttribute("rotation", "0 -90 0");

    let markerDetected = false;
    markerScene.addEventListener("markerFound", () => {
      markerDetected = true;
      video.style.display = "none";
      overlay.style.display = "none";
    });
    markerScene.addEventListener("markerLost", () => {
      markerDetected = false;
      startFallback(modelUrl);
    });

    function startFallback(modelUrl) {
      if (markerDetected) return;
      markerScene.style.display = "none";
      video.style.display = "block";
      overlay.style.display = "block";

      navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
        .then(stream => video.srcObject = stream);

      const renderer = new THREE.WebGLRenderer({ canvas: overlay, alpha: true });
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
      camera.position.z = 2;
      scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1));

      const loader = new GLTFLoader();
      loader.load(modelUrl, (gltf) => {
        const model = gltf.scene;
        model.scale.set(0.5, 0.5, 0.5);
        scene.add(model);
        animate();
      });

      function animate() {
        requestAnimationFrame(animate);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.render(scene, camera);
      }
    }

    // If no marker after 5s, fallback
    setTimeout(() => {
      if (!markerDetected) startFallback(modelUrl);
    }, 5000);
  </script>

  <!-- AR.js + A-Frame -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.rawgit.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</body>
</html>
