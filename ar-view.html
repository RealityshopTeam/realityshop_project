<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reality Shop - Universal AR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- model-viewer (for ARCore/ARKit devices) -->
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <!-- A-Frame + AR.js (for devices without ARCore) -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>

  <style>
    body, html { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
    #mv-container, #arjs-container { width: 100%; height: 100%; display: none; }
  </style>
</head>
<body>

<!-- Model Viewer Container (ARCore/ARKit) -->
<div id="mv-container">
  <model-viewer id="mv"
    alt="3D Product"
    camera-controls
    auto-rotate
    style="width:100%; height:100%; background:#000;">
  </model-viewer>
</div>

<!-- AR.js Container (Fallback for non-ARCore) -->
<div id="arjs-container">
  <a-scene
    vr-mode-ui="enabled: false"
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;">
    
    <a-entity id="arjs-model"
      scale="0.5 0.5 0.5"
      position="0 0 -2">
    </a-entity>

    <a-entity camera></a-entity>
  </a-scene>
</div>

<script>
  const mv = document.getElementById("mv");
  const mvContainer = document.getElementById("mv-container");
  const arjsContainer = document.getElementById("arjs-container");
  const arjsModel = document.getElementById("arjs-model");

  // Get product path from URL (?model=imgs/chair.glb)
  const urlParams = new URLSearchParams(window.location.search);
  const modelPath = urlParams.get("model") || "imgs/chair.glb";

  // Apply product
  mv.setAttribute("src", modelPath);
  arjsModel.setAttribute("gltf-model", `url(${modelPath})`);

  // Check if immersive AR is supported
  if ('xr' in navigator) {
    navigator.xr.isSessionSupported('immersive-ar').then((supported) => {
      if (supported) {
        console.log("✅ ARCore/ARKit available → using model-viewer immersive AR");
        mv.setAttribute("ar", "true");
        mv.setAttribute("ar-modes", "webxr scene-viewer quick-look");
        mvContainer.style.display = "block";
      } else {
        console.log("⚠️ No immersive AR support → using AR.js fallback");
        arjsContainer.style.display = "block";
      }
    }).catch(() => {
      console.log("⚠️ Error detecting WebXR → using AR.js fallback");
      arjsContainer.style.display = "block";
    });
  } else {
    console.log("⚠️ WebXR not available → using AR.js fallback");
    arjsContainer.style.display = "block";
  }
</script>

</body>
</html>
