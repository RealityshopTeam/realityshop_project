<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Marker Based AR (Importmap)</title>
    <style>
      body { margin: 0; overflow: hidden; }
    </style>

    <!-- Importmap -->
    <script type="importmap">
    {
      "imports": {
        "aframe": "https://unpkg.com/aframe@1.4.2/dist/aframe.min.js",
        "aframe-ar": "https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.min.js"
      }
    }
    </script>

    <!-- Load A-Frame -->
    <script type="module">
      import "aframe";
      import "aframe-ar";
    </script>
  </head>
  <body>
    <!-- AR Scene -->
    <a-scene embedded arjs>
      <!-- Marker -->
      <a-marker preset="hiro">
        <!-- 3D object on marker -->
        <a-box position="0 0.5 0" material="color: blue;"></a-box>
      </a-marker>

      <!-- Camera -->
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
