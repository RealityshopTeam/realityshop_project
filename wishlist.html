<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Wishlist - Reality Shop</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f6f6f6;
      color: #222;
      margin: 0;
      padding: 0 20px 40px;
    }

    /* Header/Nav (same as Cart page) */
    header {
      background-color: #111827;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header .logo {
      font-size: 20px;
      font-weight: bold;
      color: #06b6d4; /* cyan logo */
      text-decoration: none;
    }
    header nav a {
      color: #f3f4f6;
      text-decoration: none;
      margin: 0 12px;
      font-weight: 500;
      transition: color 0.3s ease, border-bottom 0.3s ease;
      padding-bottom: 4px;
    }
    header nav a:hover,
    header nav a.active {
      color: #06b6d4;
      border-bottom: 2px solid #06b6d4;
    }

    h1 {
      text-align: center;
      margin: 40px 0 20px;
    }
    .wishlist-container {
      max-width: 960px;
      margin: 0 auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
      padding: 30px 20px;
      min-height: 180px;
    }
    .wishlist-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 0;
      border-bottom: 1px solid #eee;
    }
    .wishlist-item:last-child {
      border-bottom: none;
    }
    .item-details {
      display: flex;
      align-items: center;
      gap: 20px;
      min-width: 0;
      flex: 1 1 0;
    }
    .thumb-box {
      width: 100px;
      height: 100px;
      border-radius: 10px;
      background: #ebebeb;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 18px;
      flex-shrink: 0;
    }
    .thumb-box img, .thumb-box model-viewer {
      width: 100px;
      height: 100px;
      object-fit: contain;
      border-radius: 10px;
      background: #fafafa;
      display: block;
    }
    .item-meta {
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-width: 0;
      flex: 1 1 0;
      overflow: hidden;
    }
    .item-name {
      font-weight: bold;
      font-size: 1.1rem;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .item-category {
      font-size: 0.95rem;
      color: #666;
    }
    .item-price {
      color: #06b6d4;
      font-weight: 600;
      font-size: 1rem;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: flex-end;
    }
    .actions button {
      background: #06b6d4;
      border: none;
      color: white;
      padding: 8px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.95rem;
      margin: 0 0 0 8px;
      transition: background 0.3s, transform 0.2s;
    }
    .actions button:hover {
      background: #0891b2;
      transform: translateY(-2px) scale(1.04);
    }
    .empty-msg {
      text-align: center;
      color: #666;
      font-size: 1.1rem;
      margin: 60px 0;
    }

    @media (max-width: 700px) {
      header {
        flex-direction: column;
        align-items: flex-start;
      }
      header nav {
        margin-top: 8px;
      }
      header nav a {
        display: inline-block;
        margin: 6px 8px;
      }
    }
  </style>
</head>
<body>
  <!-- Updated header -->
  <header>
    <a href="index.html" class="logo">Reality Shop</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="cart.html">Cart</a>
      <a href="wishlist.html" class="active">Wishlist</a>
      <a href="login.html">Account</a>
    </nav>
  </header>

  <h1>Your Wishlist</h1>
  <div class="wishlist-container" id="wishlistContainer"></div>

  <script>
    function getWishlist() {
      return JSON.parse(localStorage.getItem('wishlist') || '[]');
    }
    function setWishlist(wishlist) {
      localStorage.setItem('wishlist', JSON.stringify(wishlist));
    }
    function renderWishlist() {
      const container = document.getElementById('wishlistContainer');
      const wishlist = getWishlist();
      container.innerHTML = '';

      if(wishlist.length === 0) {
        container.innerHTML = '<div class="empty-msg">No items in your wishlist.</div>';
        return;
      }

      wishlist.forEach((item, idx) => {
        const div = document.createElement('div');
        div.className = 'wishlist-item';

        // Thumbnail logic
        let thumbHTML = '';
        if(item.glb) {
          thumbHTML = `<model-viewer src="${item.glb}" alt="${item.name} 3D" auto-rotate camera-controls shadow-intensity="1"></model-viewer>`;
        } else if(item.img) {
          thumbHTML = `<img src="${item.img}" alt="${item.name}" />`;
        } else {
          thumbHTML = `<div style="width:100px;height:100px;background:#eee;line-height:100px;text-align:center;">No Image</div>`;
        }

        div.innerHTML = `
          <div class="item-details">
            <div class="thumb-box">${thumbHTML}</div>
            <div class="item-meta">
              <div class="item-name">${item.name}</div>
              <div class="item-category">${item.category || ''}</div>
              <div class="item-price">₹${item.price}.00</div>
            </div>
          </div>
          <div class="actions">
            <button class="add-cart-btn" type="button">Add to Cart</button>
            <button class="remove-btn" type="button">Remove</button>
          </div>
        `;

        // Remove button handler
        div.querySelector('.remove-btn').onclick = () => {
          wishlist.splice(idx, 1);
          setWishlist(wishlist);
          renderWishlist();
        };
        // Add to cart handler
        div.querySelector('.add-cart-btn').onclick = () => {
          let cart = JSON.parse(localStorage.getItem('cart') || '[]');
          let existing = cart.find(p => p.name === item.name);
          if(existing) existing.quantity += 1;
          else cart.push({ name: item.name, price: item.price, quantity: 1 });
          localStorage.setItem('cart', JSON.stringify(cart));
          wishlist.splice(idx, 1);
          setWishlist(wishlist);
          renderWishlist();
          alert(item.name + " added to cart!");
        };
        container.appendChild(div);
      });
    }
    renderWishlist();
  </script>
</body>
</html>
